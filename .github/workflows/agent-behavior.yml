name: Agent Behavior

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read-only: needed for the "Collect PR commit records" step's `gh api .../pulls/.../commits`
  # call, which the dependency-bump exemption uses to verify every commit on the PR is both
  # authored/committed by the trusted logins AND GitHub-signature-verified. Login alone is not
  # proof: an insider can `git commit --author="dependabot[bot] <...noreply...>"` with a
  # matching committer email and get the same `.author.login`/`.committer.login` with no GitHub
  # involvement at all, so the check also requires `commit.verification.verified == true`.
  pull-requests: read

jobs:
  behavior-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate behavior specs
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in .agents/behaviors/*/BEHAVIOR.md; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            dir=$(basename "$(dirname "$file")")
            name=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm==1 && /^name:/{sub(/^name:[[:space:]]*/, ""); print; exit}' "$file")
            desc=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm==1 && /^description:/{sub(/^description:[[:space:]]*/, ""); print; exit}' "$file")
            test -n "$name" && test -n "$desc" && test "$name" = "$dir"
          done
          test "$count" -gt 0
      - name: Guard immutable build and release inputs
        run: |
          python3 scripts/ci/check-mutable-inputs.py \
            .github/workflows/lint.yml \
            .github/workflows/release.yml \
            .github/workflows/version-check.yml \
            .github/workflows/agent-behavior.yml \
            scripts/airgap/lib/binary-checksums.tsv
      - name: Evaluate representative trace
        run: python3 .agents/evals/evaluate.py .agents/evals/reference-trace.json
      - name: Collect PR changed paths
        if: github.event_name == 'pull_request'
        shell: bash
        # Three-dot range (base...head): diffs head against the merge-base of base and head,
        # so changes already on base (which the branch hasn't rebased onto) never show up as
        # "PR changes" here. A plain two-dot diff would compare the two snapshots directly and
        # could disagree with what GitHub itself calls the PR's diff.
        run: |
          set -euo pipefail
          RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$RANGE" > /tmp/agent-changed-files.txt
          cat /tmp/agent-changed-files.txt
          git diff "$RANGE" -- .github/workflows > /tmp/agent-workflow-diff.txt
      - name: Collect PR commit records
        if: github.event_name == 'pull_request'
        shell: bash
        # Used only by the dependency-bump exemption. `.author.login`/`.committer.login` are
        # GitHub matching a commit's author/committer EMAIL to an account -- not proof of who
        # made the commit -- so this also captures `commit.verification.{verified,reason}`,
        # which GitHub sets only for commits it actually signed itself (true for every commit
        # the Dependabot API authors and GitHub's own "web-flow" identity commits). Also caps
        # at 250 commits even with --paginate; --expected-commit-count below (from the PR's own
        # commit count) lets the checker fail closed if that cap was ever hit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --paginate \
            --jq '.[] | {sha: .sha, author_login: (.author.login // "NONE"), committer_login: (.committer.login // "NONE"), verified: .commit.verification.verified, reason: (.commit.verification.reason // "NONE")}' \
            > /tmp/agent-pr-commits.jsonl
          cat /tmp/agent-pr-commits.jsonl
      - name: Require operational trace for high-risk changes
        if: github.event_name == 'pull_request'
        shell: bash
        # PR_AUTHOR goes through env, not string interpolation, so an untrusted login
        # can't inject shell; check-agent-trace-requirement.py only ever compares it
        # against risk-policy.json's trustedAuthors allowlist. PR_COMMIT_COUNT is a plain
        # integer from GitHub's own PR metadata (github.event.pull_request.commits).
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-agent-trace-requirement.py \
            --policy .agents/evals/risk-policy.json \
            --changed-files /tmp/agent-changed-files.txt \
            --workflow-diff /tmp/agent-workflow-diff.txt \
            --commits /tmp/agent-pr-commits.jsonl \
            --expected-commit-count "$PR_COMMIT_COUNT" \
            --pr-author "$PR_AUTHOR" \
            --report-out /tmp/agent-risk-result.json
      - name: Bind live version-consistency evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/evals/bind-verification.py \
            --trace .agents/evals/traces/2026-08-version-consistency.json \
            --event-id e4 \
            --event-id e5 \
            --out /tmp/narwhal-version-consistency-trace.json \
            -- bash scripts/ci/check-version-consistency.sh
      - name: Gate live version-consistency behavior locally
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/evals/gate.py \
            --trace /tmp/narwhal-version-consistency-trace.json \
            --baseline .agents/evals/baseline.eval.json \
            --current-out /tmp/narwhal-local-eval.json \
            --comparison-out /tmp/narwhal-local-comparison.json
      - name: Canary canonical OpenForge reusable gate
        uses: dasomel/openforge/.github/actions/agent-eval@36b2474951a228338e21196afdeb3fd97d523704
        with:
          trace: /tmp/narwhal-version-consistency-trace.json
          baseline: .agents/evals/baseline.eval.json
          current-out: /tmp/narwhal-openforge-eval.json
          comparison-out: /tmp/narwhal-openforge-comparison.json
      - name: Require local and reusable gate equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def outcomes(data): return {item['behavior']: item['outcome'] for item in data.get('results', [])}
          local_eval=load('/tmp/narwhal-local-eval.json'); remote_eval=load('/tmp/narwhal-openforge-eval.json')
          local_cmp=load('/tmp/narwhal-local-comparison.json'); remote_cmp=load('/tmp/narwhal-openforge-comparison.json')
          assert local_eval.get('schemaVersion') == remote_eval.get('schemaVersion')
          assert local_eval.get('traceId') == remote_eval.get('traceId')
          assert local_eval.get('summary',{}).get('failed') == remote_eval.get('summary',{}).get('failed')
          assert outcomes(local_eval) == outcomes(remote_eval)
          assert local_cmp.get('summary',{}).get('regressions') == remote_cmp.get('summary',{}).get('regressions')
          assert local_cmp.get('regressions',[]) == remote_cmp.get('regressions',[])
          print('Local and OpenForge reusable gates are semantically equivalent')
          PY
      - name: Correlate high-risk changes with trace evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          args=(--trace /tmp/narwhal-version-consistency-trace.json)
          for trace in .agents/evals/traces/*.json; do
            [ -f "$trace" ] || continue
            [ "$trace" = ".agents/evals/traces/2026-08-version-consistency.json" ] && continue
            args+=(--trace "$trace")
          done
          python3 scripts/ci/check-agent-trace-evidence.py \
            --policy .agents/evals/risk-policy.json \
            --changed-files /tmp/agent-changed-files.txt \
            "${args[@]}" \
            --report-out /tmp/agent-evidence-quality.json
      - name: Gate operational traces against trusted baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/evals/gate.py \
            --trace /tmp/narwhal-version-consistency-trace.json \
            --baseline .agents/evals/baseline.eval.json \
            --current-out /tmp/current-agent-eval.json \
            --comparison-out /tmp/agent-eval-comparison.json
          for trace in .agents/evals/traces/*.json; do
            [ -f "$trace" ] || continue
            [ "$trace" = ".agents/evals/traces/2026-08-version-consistency.json" ] && continue
            echo "Evaluating $trace"
            python3 .agents/evals/gate.py \
              --trace "$trace" \
              --baseline .agents/evals/baseline.eval.json \
              --current-out /tmp/current-agent-eval.json \
              --comparison-out /tmp/agent-eval-comparison.json
          done
