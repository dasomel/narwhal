name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the checkout. GitHub's default token is broader,
# and a workflow that never needs write should not carry it.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all scripts
        run: |
          find scripts/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      # CLAUDE.md documents 2-space indentation for shell. All 52 scripts already
      # comply, so this blocks rather than warns. shellcheck does not cover it.
      - name: Check 2-space indentation
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            width=$(grep -o '^ \+' "$f" | awk '{print length}' | sort -n | head -1)
            if [ -n "$width" ] && [ "$width" -ne 2 ]; then
              echo "$f: smallest indent is $width spaces, expected 2"
              bad=1
            fi
          done < <(find scripts/ -name '*.sh')
          exit "$bad"

  # The clean-install regression checks, static half. Each one corresponds to a dated row
  # in docs/common/lessons-log.md, so a failure here names the bug that came back rather
  # than just "something broke". Three clean installs of the Kakao cluster produced 24
  # defects; this is what stops them being reintroduced silently.
  #
  # Static only: the runtime half needs a live cluster. See docs/kakao/clean-install-rca.md
  # for what a full clean install in CI would additionally require.
  regression-static:
    name: Clean-install regression (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # R65/R66 (narwhal#52's mutable-image-tag gate) render gitops/charts/ with
      # `helm template` and WARN-skip (not fail) when helm is absent — install it so
      # the gate actually runs here rather than only locally. Same version this
      # cluster's own provisioning already pins (scripts/airgap/lib/binary-checksums.tsv),
      # not merely "some recent helm", so CI renders charts exactly as a real install would.
      - name: Install helm
        env:
          HELM_VERSION: v4.2.1
          HELM_SHA256: 479dca836e5b45e8bd222400c5591b0e3a647378f03ff96597180db97c17fdae
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp "linux-amd64/helm"
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      # R117/R117b (narwhal#52 D3-A) compare this repo's images.txt against the portal's
      # deploy/kaniko-build-job.yaml. Without a sibling checkout the script only warns and
      # skips both checks -- which is exactly how the two drifted to :latest unnoticed in the
      # first place. Check out the public repo read-only (this job's permissions are
      # contents: read; no token needed for a public repo) and set NARWHAL_PORTAL_REQUIRED
      # below so a missing/failed checkout here fails the job instead of silently skipping.
      - name: Checkout narwhal-portal for cross-repo kaniko tag contract check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dasomel/narwhal-portal
          ref: main
          path: ../narwhal-portal

      - name: Run static regression checks
        env:
          NARWHAL_PORTAL_REQUIRED: "1"
        run: ./scripts/test/regression-check-kakao.sh --static

  # The Mistakes Log is a set of 3-column tables. An unescaped `|` inside a cell silently
  # adds a column and the row stops rendering — three rows had drifted that way unnoticed
  # before this check existed. Cheap to verify, invisible to catch by eye.
  lessons-log-format:
    name: Mistakes Log format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every row parses as three columns
        run: |
          python3 - <<'EOF'
          import re, sys
          bad = 0
          for n, line in enumerate(open("docs/common/lessons-log.md"), 1):
              line = line.rstrip("\n")
              if not line.startswith("| ") or line.startswith("|---") or line.startswith("| Date"):
                  continue
              cells = re.split(r"(?<!\\)\|", line)
              if len(cells) != 5:
                  print(f"lessons-log.md:{n}: {len(cells)-2} columns, expected 3")
                  print(f"  {line[:100]}")
                  print("  escape any literal | inside a cell as \\|")
                  bad += 1
          sys.exit(1 if bad else 0)
          EOF

  yaml-validate:
    name: YAML Validate (GitOps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `releases/latest/download` is a mutable reference: it resolved to whatever
      # upstream published most recently, and nothing checked what arrived. A pinned
      # version alone is not enough either — a tag can be moved. The digest is the part
      # that makes the download immutable, so bump the two together or the check fails.
      # v4.53.3 rather than the newest (v4.53.6, published 2026-08-20): the cooling
      # window in docs/common/supply-chain-policy.md is seven days.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Validate GitOps YAML
        run: |
          for f in gitops/apps/*.yaml gitops/resources/*.yaml; do
            echo "Validating $f..."
            yq eval '.' "$f" > /dev/null
          done

  kubeconform:
    name: kubeconform (K8s Resources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same mutable reference as yq, plus a second problem the pipe created: `curl | tar`
      # unpacks the archive as it arrives, so there is no point at which the bytes exist
      # to be checked. Download first, verify, then extract.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate K8s manifests in gitops/resources
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'schemas/crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/resources/*.yaml

  vagrantfile-syntax:
    name: Vagrantfile Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'

      - name: Validate Vagrantfile syntax
        run: ruby -c Vagrantfile

  markdown-lint:
    name: Markdown Lint (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned for the same reason as the two above. No digest: npm resolves a package to
      # a tarball whose integrity hash lives in a lockfile, and there is no lockfile for a
      # global install — asserting a digest here would mean inventing one. The version pin
      # is the whole control, so it has to be a version and never a range.
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: Lint Markdown files
        run: |
          markdownlint \
            --config .markdownlint.json \
            --ignore node_modules \
            'docs/**/*.md' 'README.md' 'CHANGELOG.md' \
            || true
