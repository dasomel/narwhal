name: Markdown Changed-Line Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - 'scripts/ci/markdownlint-changed.py'
      - '.github/workflows/markdown-changed.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - 'scripts/ci/markdownlint-changed.py'
      - '.github/workflows/markdown-changed.yml'

permissions:
  contents: read

jobs:
  changed-lines:
    name: Markdown changed lines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: Gate changed active-documentation lines
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BASE_SHA}"
          fi
          test -n "${base}"
          python3 scripts/ci/markdownlint-changed.py --base "${base}"
