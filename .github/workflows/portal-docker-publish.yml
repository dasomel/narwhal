name: Portal Build & Publish Container (GHCR)

# D-MONO-CI ported from narwhal-portal. Decisions:
#   D1  Trigger: tags `portal/v*.*.*` only. GitHub's tag glob `*` never matches `/`, so
#       narwhal's own `v*` / `v*.*.*` tags do not fire this workflow, and `portal/v1.2.3`
#       does not match narwhal's `v*` (it starts with `p`). Verified in the PR description.
#   D2  IMAGE is hardcoded ghcr.io/dasomel/narwhal-portal. `github.repository` would silently
#       become ghcr.io/dasomel/narwhal and GitOps pins the old name.
#   D3  The version used for image tags is the tag minus the `portal/v` prefix; metadata-action's
#       type=semver is fed it explicitly (`value=`) because it cannot parse `portal/v1.2.3`.
#   D4  Build context `portal`, Dockerfile `portal/Dockerfile`. Signing/attestation steps and
#       their secrets contract (COSIGN_PRIVATE_KEY, COSIGN_PASSWORD) live in the `sign` job.
#   D5  ADMIN PREREQUISITES (cannot be done from here): (a) the GHCR package
#       ghcr.io/dasomel/narwhal-portal must grant this repository (dasomel/narwhal) write access
#       under Package settings > Manage Actions access, otherwise GITHUB_TOKEN gets 403 on push;
#       (b) COSIGN_PRIVATE_KEY / COSIGN_PASSWORD must exist as dasomel/narwhal secrets (known
#       missing in narwhal-portal too: a portal/v*.*.* release FAILS at the sign job until set,
#       see portal/docs/cosign-signing-setup.md).
#   D6  Job-level working-directory is not used: the only file-reading run step is the
#       package.json guard, which takes the explicit portal/ path.
#   D10 CycloneDX SBOM attestation (narwhal#684): Kyverno's verify-image-signatures policy
#       requires both a Cosign signature and a CycloneDX SBOM attestation (`https://cyclonedx.org/bom`)
#       signed by the same key; buildx `sbom: true` only attaches an unsigned BuildKit SPDX
#       attestation to the image index. Both release and `sign_digest` recovery runs generate a
#       CycloneDX SBOM from `${IMAGE}@${DIGEST}` via `aquasecurity/trivy-action` (already pinned in
#       `portal-release.yml`/`portal-license-and-sbom.yml`) and publish both a Sigstore bundle
#       attestation and a legacy `.att` tag (`--new-bundle-format=false --use-signing-config=false`)
#       for Kyverno 1.18.x. Cost: extra scan/attest time, ~457 KB `.att` artifact per release,
#       deprecated cosign v3 legacy flags. Escape hatch: drop the legacy `.att` line after upgrading
#       to Kyverno >= 1.19 with `SigstoreBundle`.
#   D11 Isolated SBOM job (narwhal#750): `aquasecurity/trivy-action` downloads the trivy binary and
#       DB at runtime; step-level `env:` scoping in `sign` is not an isolation boundary because a
#       compromised download can tamper with the runner before `cosign` runs. Move SBOM generation
#       into its own `sbom` job with no secrets and `permissions: { contents: read }` (the package
#       is public, so trivy pulls anonymously), upload the CycloneDX file and its `.sha256` as an
#       artifact, and pass the SHA-256 via a job output (`needs.sbom.outputs.sbom_sha256`). `sign`
#       fails closed in step 1 if `needs.sbom.result != 'success'` (so a failed or skipped `sbom`
#       never leaves `sign` skipped/green) and verifies the downloaded artifact's SHA-256 (against
#       the job output, never the `.sha256` file in the artifact), size (<= 10 MiB), CycloneDX JSON
#       structure, and target `${IMAGE}@${DIGEST}` (`metadata.component.name` and
#       `aquasecurity:trivy:RepoDigest`) before touching `COSIGN_PRIVATE_KEY`.
#       Residual risk: the SBOM CONTENT is still produced by trivy; job isolation protects the
#       signing key, not the SBOM's truthfulness.
#       Cost: one extra runner startup + artifact round-trip (~15-30s).
#       Escape hatch: if `ghcr.io/dasomel/narwhal-portal` ever becomes private, add `packages: read`
#       and `docker/login-action` (with `GITHUB_TOKEN`, still no cosign secrets) to `sbom`.
#

# Builds the narwhal-portal container and publishes it to GitHub Container
# Registry (ghcr.io/dasomel/narwhal-portal).
#
# Tagging strategy (docker/metadata-action):
#   - push tag portal/v1.2.3 (SemVer)-> :1.2.3, :1.2, :1, :latest
#   - manual (workflow_dispatch)
# Version source of truth = git tags (portal/v-prefixed). On a release tag we also
# assert the tag matches package.json "version" so the two never drift.
#
# Builds ONLY on version tags (not on every main push): a release commit is
# pushed to main AND tagged, which previously fired two duplicate builds of the
# same commit. GitOps pins an immutable SemVer tag, so a release == a tag == one
# build. Use workflow_dispatch for ad-hoc builds.
#
# ARCH STRATEGY — one job per architecture, on a NATIVE runner:
# v1.0.16 never published because a single job built both platforms and the
# arm64 leg ran `next build` under QEMU emulation: amd64 finished in ~90s while
# arm64 was still compiling 5 minutes later (an earlier run reached 2h38m before
# being cancelled). Emulated Node/Next builds are pathologically slow, and the
# cost grows with the app. So each arch builds on its own native runner
# (`ubuntu-24.04-arm` is free for public repos), pushes by digest, and a final
# job merges the digests into one multi-arch manifest. No QEMU anywhere.

on:
  push:
    tags: ['portal/v*.*.*']
  workflow_dispatch:
    inputs:
      sign_digest:
        description: 'Recovery only: sign and attest this existing manifest-list digest (sha256:<64 hex>) of the published image and skip build/merge'
        required: false
        default: ''
        type: string

concurrency:
  group: portal-ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dasomel/narwhal-portal # hardcoded on purpose (D2): github.repository is now dasomel/narwhal

# Default for any job that does not declare its own; the build and merge jobs below
# widen this deliberately for GHCR push and provenance.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    if: ${{ inputs.sign_digest == '' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to GHCR via GITHUB_TOKEN
      id-token: write # provenance/attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # D7 (PR #347 review): a tag run must be a real portal/vX.Y.Z tag whose commit is this
      # run's commit; an ad-hoc workflow_dispatch from a branch is fine, but never from a branch
      # named like a release tag (portal-release.yml keys off the run's ref name).
      - name: Validate the ref is a release tag or an ordinary branch
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF_TYPE: ${{ github.ref_type }}
          RUN_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-portal-release-ref.py --mode publish \
            --event "$RUN_EVENT" --ref-type "$RUN_REF_TYPE" --ref-name "$RUN_REF_NAME" --sha "$GITHUB_SHA"

      # Slashes are illegal in artifact names — linux/amd64 -> linux-amd64.
      - name: Derive platform slug
        run: |
          set -euo pipefail
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Guard: on a portal/vX.Y.Z tag, the tag must match portal/package.json version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/portal/v')
        run: |
          pkg="$(node -p "require('./portal/package.json').version")"
          tag="${GITHUB_REF_NAME#portal/v}"
          echo "portal/package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::git tag portal/v$tag does not match portal/package.json version $pkg — bump portal/package.json before tagging."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here; the tags are applied by the merge job on the manifest
      # list. Tagging a per-arch image would make the tag point at one arch.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=narwhal-portal
            org.opencontainers.image.description=Narwhal IDP management portal (Next.js)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: portal
          file: portal/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # Scope the cache per arch — a shared scope makes the two jobs evict
          # each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Exercise the exact pushed digest on its matching native runner before the
      # merge job creates any release tags or multi-arch manifest.
      - name: Smoke test pushed image
        run: |
          set -euo pipefail
          image="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          container=$(docker run -d -p 3000:3000 \
            -e AUTH_SECRET=smoke-test-secret-at-least-32-characters \
            -e KEYCLOAK_ISSUER=https://keycloak.invalid/realms/narwhal \
            -e KEYCLOAK_CLIENT_ID=portal \
            -e KEYCLOAK_CLIENT_SECRET=dummy \
            -e K8S_API_SERVER=https://kubernetes.invalid:6443 \
            "$image")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health/live || true)
            if [ "$code" = 200 ]; then
              echo "live health: $code"
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health/ready || true)
              echo "ready health: $ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not return 200 from /api/health/live after ${attempt} attempts (last status: ${code:-none})"
          exit 1

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & tag
    if: ${{ inputs.sign_digest == '' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # D3: `portal/v1.2.3` -> `1.2.3`. Only meaningful on a tag; workflow_dispatch leaves it empty.
      - name: Derive version from the tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/portal/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${REF_NAME#portal/v}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version || '0.0.0' }},enable=${{ startsWith(github.ref, 'refs/tags/portal/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version || '0.0.0' }},enable=${{ startsWith(github.ref, 'refs/tags/portal/v') }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version || '0.0.0' }},enable=${{ startsWith(github.ref, 'refs/tags/portal/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/portal/v') }}

      # D8: the sign job signs the manifest-list digest, not a mutable tag. `imagetools create
      # --metadata-file` has no `containerimage.digest` key (that is docker/build-push-action's
      # shape): buildx v0.38 writes {"containerimage.descriptor": {mediaType,digest,size},
      # "image.name": ...} (commands/imagetools/create.go), so the old jq read gave `null` and the
      # sign job ran `cosign sign ...@null` on portal/v1.1.0. The digest is therefore taken from
      # the create step's own descriptor, never from a tag lookup (`:latest`/`:1`/`:1.1` are
      # mutable and could be re-pointed between create and inspect). On a release tag it is
      # additionally cross-checked against the immutable full-SemVer tag. Fail closed unless it is
      # a well-formed sha256 digest.
      - name: Create manifest list and push
        id: create-manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # One file per arch, named after its digest (see "Export digest").
          count=$(find . -type f | wc -l)
          echo "merging ${count} per-arch digests"
          [ "$count" -ge 2 ] || { echo "::error::expected 2 digests, got ${count}"; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --metadata-file "${RUNNER_TEMP}/manifest-metadata.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(jq -r '.["containerimage.descriptor"].digest // empty' "${RUNNER_TEMP}/manifest-metadata.json")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::imagetools create reported no valid manifest list digest (got '${digest}'); refusing to pass it to the sign job"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            tagged=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${VERSION}")
            [ "$tagged" = "$digest" ] || { echo "::error::${IMAGE}:${VERSION} is ${tagged}, create reported ${digest}"; exit 1; }
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify both architectures are present
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "$ref"
          raw=$(docker buildx imagetools inspect --raw "$ref")
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)' \
              >/dev/null <<< "$raw" \
              || { echo "::error::${arch} missing from ${ref}"; exit 1; }
          done
    outputs:
      digest: ${{ steps.create-manifest.outputs.digest }}

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: merge
    # Normal run: merge succeeded. Recovery run (sign_digest input): merge is skipped by design.
    if: ${{ !cancelled() && (needs.merge.result == 'success' || (inputs.sign_digest != '' && needs.merge.result == 'skipped')) }}
    # D11 (narwhal#750): isolate runtime-downloading trivy-action from cosign signing secrets.
    # No secrets are referenced in this job; ghcr.io/dasomel/narwhal-portal is public so trivy
    # pulls anonymously with only contents: read.
    permissions:
      contents: read
    outputs:
      sbom_sha256: ${{ steps.sbom-hash.outputs.sha256 }}
    steps:
      # Fail closed before invoking trivy: an empty/`null`/malformed digest must never reach scan-ref.
      - name: Validate image digest
        env:
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image digest for SBOM is not sha256:<64 hex> (got '${DIGEST}'); refusing to scan."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/sbom"
          echo "generating CycloneDX SBOM for ${IMAGE}@${DIGEST}"

      - name: Generate CycloneDX SBOM for image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.IMAGE }}@${{ inputs.sign_digest || needs.merge.outputs.digest }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom/sbom-cyclonedx.json
          cache: 'false'

      - name: Compute SBOM SHA-256
        id: sbom-hash
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          set -euo pipefail
          sbom="${SBOM_DIR}/sbom-cyclonedx.json"
          [ -f "$sbom" ] && [ ! -L "$sbom" ] && [ -s "$sbom" ] \
            || { echo "::error::CycloneDX SBOM not produced at ${sbom}"; exit 1; }
          sha=$(sha256sum "$sbom" | awk '{print $1}')
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected sha256sum output: '${sha}'"
            exit 1
          fi
          printf '%s  sbom-cyclonedx.json\n' "$sha" > "${SBOM_DIR}/sbom-cyclonedx.json.sha256"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=${sha} ($(wc -c < "$sbom" | tr -d '[:space:]') bytes)"

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-sbom-cyclonedx
          path: |
            ${{ runner.temp }}/sbom/sbom-cyclonedx.json
            ${{ runner.temp }}/sbom/sbom-cyclonedx.json.sha256
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign published image
    runs-on: ubuntu-latest
    needs: [merge, sbom]
    # Normal run: merge succeeded. Recovery run (sign_digest input): merge is skipped by design.
    # Deliberately do NOT gate job `if:` on needs.sbom.result == 'success': doing so would mark
    # `sign` skipped (and leave the workflow green) if `sbom` were ever skipped. Step 1 below fails
    # closed on any non-success `sbom` result before touching the artifact or any signing secret.
    if: ${{ !cancelled() && (needs.merge.result == 'success' || (inputs.sign_digest != '' && needs.merge.result == 'skipped')) }}
    # WHY THIS EXISTS (narwhal#35): narwhal's Kyverno verify-image-signatures ClusterPolicy
    # expects a Cosign signature and CycloneDX attestation made with a static key pair — narwhal's
    # own docs (docs/common/supply-chain-policy.md §6) chose key-based verification specifically to
    # avoid a runtime dependency on the public Sigstore Rekor log in an air-gapped cluster.
    # narwhal#35 flagged that the signing half belongs here, since narwhal only consumes
    # images this repo publishes. See portal/docs/cosign-signing-setup.md for the one-time human
    # setup (key generation + the two secrets below) this step assumes.
    permissions:
      contents: read
      packages: write # cosign pushes the signature as an OCI artifact alongside the image
    steps:
      - name: Require SBOM job to have succeeded
        env:
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          set -euo pipefail
          if [[ "$SBOM_RESULT" != "success" ]]; then
            echo "::error::sbom job did not succeed (result='${SBOM_RESULT}'); refusing to sign"
            exit 1
          fi

      # Fail closed before anything touches cosign: an empty/`null`/malformed digest must never
      # reach `cosign sign` (it became `...@null` on portal/v1.1.0).
      - name: Validate image digest
        env:
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image digest to sign is not sha256:<64 hex> (got '${DIGEST}'). The merge job output 'digest' is missing or malformed; refusing to sign."
            exit 1
          fi
          echo "signing ${IMAGE}@${DIGEST}"

      - name: Download CycloneDX SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portal-sbom-cyclonedx
          path: ${{ runner.temp }}/sbom

      # D11 (narwhal#750): verify the downloaded SBOM against the SHA-256 passed via job output
      # (not the `.sha256` file inside the artifact), enforce a sane size ceiling before JSON
      # parsing, and confirm it is a single CycloneDX JSON document describing `${IMAGE}@${DIGEST}`.
      # Runs before `cosign sign` so a corrupt or mismatched SBOM fails before publishing `.sig`.
      - name: Verify CycloneDX SBOM artifact
        env:
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
          EXPECTED_SHA256: ${{ needs.sbom.outputs.sbom_sha256 }}
          SBOM_PATH: ${{ runner.temp }}/sbom/sbom-cyclonedx.json
          MAX_SBOM_BYTES: '10485760'
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::sbom job output sbom_sha256 is missing or malformed (got '${EXPECTED_SHA256}')"
            exit 1
          fi
          if [ ! -f "$SBOM_PATH" ] || [ -L "$SBOM_PATH" ] || [ ! -s "$SBOM_PATH" ]; then
            echo "::error::downloaded SBOM missing, empty, or symlink: ${SBOM_PATH}"
            exit 1
          fi
          size=$(wc -c < "$SBOM_PATH" | tr -d '[:space:]')
          if [ "$size" -le 0 ] || [ "$size" -gt "$MAX_SBOM_BYTES" ]; then
            echo "::error::SBOM size ${size} bytes outside allowed range (1..${MAX_SBOM_BYTES})"
            exit 1
          fi
          actual_sha=$(sha256sum "$SBOM_PATH" | awk '{print $1}')
          if [ "$actual_sha" != "$EXPECTED_SHA256" ]; then
            echo "::error::SBOM sha256 mismatch: expected ${EXPECTED_SHA256} (job output), got ${actual_sha}"
            exit 1
          fi
          expected_ref="${IMAGE}@${DIGEST}"
          jq -es --arg ref "$expected_ref" '
            length == 1
            and (.[0] | type == "object"
              and .bomFormat == "CycloneDX"
              and ((.specVersion | type) == "string" and (.specVersion | test("^[0-9]+\\.[0-9]+")))
              and .metadata.component.type == "container"
              and .metadata.component.name == $ref
              and (((.metadata.component.properties // [])
                    | map(select(.name == "aquasecurity:trivy:RepoDigest" and .value == $ref))
                    | length) > 0))
          ' "$SBOM_PATH" >/dev/null \
            || { echo "::error::SBOM is not a valid CycloneDX JSON document for ${expected_ref}"; exit 1; }
          echo "verified CycloneDX SBOM (${size} bytes, sha256=${actual_sha}) for ${expected_ref}"

      # A portal/v*.*.* tag is a real release — GitOps will pull this image, so it must be signed
      # or the workflow fails. workflow_dispatch is an ad-hoc/manual build (same distinction
      # the merge job already draws for the :latest tag at line ~172); it still gets signed
      # when the secrets are configured, but a missing secret only warns, never fails it.
      # EXCEPTION: a sign_digest recovery run exists only to sign, so there signing is always
      # required and missing secrets fail the job instead of ending green with nothing signed.
      - name: Determine whether signing is mandatory
        id: gate
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/portal/v') }}
          SIGN_DIGEST: ${{ inputs.sign_digest }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE_TAG" == "true" || -n "$SIGN_DIGEST" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Actions expressions evaluate `secrets.X != ''` without ever placing the
      # secret value itself into the generated script or logs, so this is safe to use for a
      # presence check. Both secrets are required: cosign.key from `generate-key-pair` is
      # password-encrypted by default, and cosign only decrypts it non-interactively when
      # COSIGN_PASSWORD is set — without it, `cosign sign` would block on a stdin prompt
      # that doesn't exist on a runner.
      - name: Check signing secrets are configured
        id: secrets-check
        env:
          KEY_PRESENT: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          PASSWORD_PRESENT: ${{ secrets.COSIGN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [[ "$KEY_PRESENT" == "true" && "$PASSWORD_PRESENT" == "true" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail — release build published without signing secrets
        if: steps.gate.outputs.required == 'true' && steps.secrets-check.outputs.present == 'false'
        run: |
          echo "::error::COSIGN_PRIVATE_KEY and/or COSIGN_PASSWORD secrets are not configured. A portal/v*.*.* release must be signed for narwhal's Kyverno admission policy. See portal/docs/cosign-signing-setup.md."
          exit 1

      - name: Skip signing — secrets not configured on a non-release build
        if: steps.gate.outputs.required == 'false' && steps.secrets-check.outputs.present == 'false'
        run: echo "::warning::COSIGN_PRIVATE_KEY/COSIGN_PASSWORD not configured — skipping image signing for this workflow_dispatch build (not a portal/v*.*.* release)."

      # cosign-installer verifies the cosign binary it downloads itself (see the action's
      # README), matching this repo's convention of pinning every `uses:` to a full commit
      # SHA with the version as a comment.
      - name: Install cosign
        if: steps.secrets-check.outputs.present == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        if: steps.secrets-check.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # D9: sign_digest can sign ANY digest that exists in ${IMAGE} (not only a release). Accepted
      # risk: it needs workflow_dispatch, i.e. repo write access, which already allows pushing
      # to this package. The existence check below only stops typos and `@null`-style refs from
      # reaching cosign; it is not an authorization control.
      - name: Verify digest exists in the image repository
        if: steps.secrets-check.outputs.present == 'true'
        env:
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null \
            || { echo "::error::${IMAGE}@${DIGEST} does not exist in the registry; refusing to sign"; exit 1; }

      # Signs the immutable manifest-list digest from the merge job, not a mutable tag —
      # a later `:latest`/`:1.2` re-point must not silently carry an old signature.
      # --yes skips cosign's interactive "publish to a public registry?" confirmation
      # prompt, which would otherwise hang a non-interactive CI runner (verified against
      # the locally installed cosign v3.1.3). COSIGN_PASSWORD is a cosign-recognized env
      # var name read automatically to decrypt the key — no explicit --password flag
      # exists on `cosign sign`. Deliberately no --tlog-upload/--use-signing-config flag:
      # cosign-installer defaults to cosign v3.0.6, and --tlog-upload=false requires the
      # newer --use-signing-config mechanism that v3.0.6 may not have, so pinning the sign
      # invocation to that flag combo untested against the actually-installed version is
      # a worse risk than the transparency-log upload itself — this CI runner has internet
      # access and narwhal's air-gap policy only constrains the cluster-side *verify* path
      # (docs/common/supply-chain-policy.md §6), not this sign step.
      - name: Sign image digest
        if: steps.secrets-check.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          # D-dual-signature (narwhal#684): cosign v3 stores the signature above as a Sigstore
          # bundle (OCI referrer). Kyverno 1.18.x verifyImages cannot verify a KEY-signed bundle
          # (static-key bundle verification arrived in Kyverno 1.19), so the platform policy
          # verify-image-signatures reported fail for every portal image. Also publish the legacy
          # tag-based signature (sha256-<digest>.sig), which Kyverno 1.18 verifies. The flag is
          # hidden/deprecated in cosign v3.1.x. It must be combined with --use-signing-config=false:
          # alone it fails with "must provide --new-bundle-format or --bundle where applicable with
          # --signing-config or --use-signing-config" (recovery run 44455706927, 2026-11-19). The pair
          # was checked with v3.1.4 and a throwaway key against a local registry (transparency-log
          # upload off in that test): it writes the .sig tag. The CI path with Rekor upload is
          # confirmed by a sign_digest recovery run after merge. Both
          # formats coexist on the same digest. Escape hatch: drop this line only after the
          # cluster runs Kyverno >= 1.19 AND the policy uses a SigstoreBundle attestor.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false "${IMAGE}@${DIGEST}"

      # D-dual-attestation (narwhal#684 / narwhal#750): Kyverno's verify-image-signatures
      # ClusterPolicy requires a Cosign CycloneDX SBOM attestation
      # (`predicateType: https://cyclonedx.org/bom`) signed by the same key; buildx `sbom: true`
      # writes an unsigned BuildKit SPDX attestation inside the image index that Kyverno does not
      # read. The CycloneDX SBOM was generated in the isolated `sbom` job and verified above.
      # Fail closed: any cosign attest failure fails the sign job.
      - name: Attest image digest with CycloneDX SBOM
        if: steps.secrets-check.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ inputs.sign_digest || needs.merge.outputs.digest }}
          SBOM_PATH: ${{ runner.temp }}/sbom/sbom-cyclonedx.json
        run: |
          set -euo pipefail
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --predicate "${SBOM_PATH}" --type cyclonedx "${IMAGE}@${DIGEST}"
          # D-dual-attestation (narwhal#684): mirror D-dual-signature above. cosign v3 writes
          # a Sigstore bundle (OCI referrer), which Kyverno 1.18.x cannot verify with a static
          # key; also publish the legacy tag-based attestation (`sha256-<digest>.att`) with
          # predicateType `https://cyclonedx.org/bom` (`in_toto.PredicateCycloneDX`). Verified
          # with cosign v3.1.4 + trivy + Kyverno v1.18.1 CLI against a local registry (tlog off).
          # Cost: deprecated flags and a second ~457 KB OCI artifact per release.
          # Escape hatch: drop this line only after the cluster runs Kyverno >= 1.19 AND the
          # policy uses a SigstoreBundle attestor.
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --predicate "${SBOM_PATH}" --type cyclonedx \
            --new-bundle-format=false --use-signing-config=false "${IMAGE}@${DIGEST}"
