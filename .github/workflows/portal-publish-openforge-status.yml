name: Portal Publish OpenForge Portfolio Status

# D-MONO-CI ported from narwhal-portal. Decisions:
#   D1  Kept as a portal-scoped copy, not folded into root publish-openforge-status.yml: the root
#       one publishes project `narwhal` and listens to workflow `Release`; this one publishes
#       project `narwhal-portal` and listens to `Portal Release` (distinct names, so a narwhal
#       release never publishes portal status or the reverse).
#   D2  FOLLOW-UP DECISION (not invented here): `project`/`repository` stay narwhal-portal /
#       dasomel/narwhal-portal, and `revision` is now a narwhal-repo SHA. Whether OpenForge keeps
#       one portfolio entry for the portal after the repo is archived, and which repository its
#       reusable workflow should verify the revision against, needs an OpenForge-side decision.
#

on:
  workflow_dispatch:
    inputs:
      development_status:
        description: Verified OpenForge lifecycle state
        required: true
        type: choice
        options:
          - implemented
          - adopted
          - active
          - maintenance
          - blocked
      milestone:
        description: Completed milestone or capability
        required: false
        type: string
      progress_percent:
        description: Optional progress percentage (0-100)
        required: false
        type: string
  workflow_run:
    workflows: ["Portal Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: dasomel/openforge/.github/workflows/publish-project-status.yml@0276924d288d3426ad2c2c09f5b9878a86c68d11
    with:
      project: narwhal-portal
      repository: dasomel/narwhal-portal
      development_status: ${{ github.event_name == 'workflow_run' && 'active' || inputs.development_status }}
      milestone: ${{ github.event_name == 'workflow_run' && 'release' || inputs.milestone }}
      progress_percent: ${{ github.event_name == 'workflow_run' && '' || inputs.progress_percent }}
      revision: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      evidence_workflow_url: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
    secrets:
      OPENFORGE_STATUS_TOKEN: ${{ secrets.OPENFORGE_STATUS_TOKEN }}
