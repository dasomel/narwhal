name: Version Check

on:
  pull_request:
    paths:
      - 'VERSIONS.md'
      - 'scripts/**'
      - 'gitops/**'
      - 'Vagrantfile'
      - '.github/workflows/version-check.yml'
  push:
    branches: [main]
    paths:
      - 'VERSIONS.md'
      - 'scripts/**'
      - 'gitops/**'
      - 'Vagrantfile'

permissions:
  contents: read

jobs:
  version-sync:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version consistency
        run: bash scripts/ci/check-version-consistency.sh
