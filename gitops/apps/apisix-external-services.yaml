apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-external-services
  namespace: devtools
  annotations:
    # apisix-routes(sync-wave 5)가 이 ExternalName들을 참조하므로 먼저 생성되어야 함.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: resources
    directory:
      include: "apisix-external-services.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
