apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: narwhal-apps
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: charts/narwhal-apps
    helm:
      valuesObject:
        baseDomain: local.narwhal.internal
        repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
        # vagrant (MetalLB VIP) or kakao (worker LB -> APISIX NodePort). Must match the
        # PROVIDER the provisioning scripts ran with, or ArgoCD reverts what they set up.
        provider: vagrant
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
