apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.17.1
    helm:
      valuesObject:
        expose:
          type: clusterIP
          tls:
            enabled: false
        externalURL: http://harbor.local.narwhal.io
        harborAdminPassword: Harbor12345
        database:
          type: external
          external:
            host: harbor-db-rw.harbor.svc.cluster.local
            port: 5432
            username: harbor
            password: harbor-db-password
            coreDatabase: harbor
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:
              storageClass: nfs-csi
              size: 50Gi
            jobservice:
              storageClass: nfs-csi
            trivy:
              storageClass: nfs-csi
        redis:
          type: internal
        trivy:
          enabled: true
        core:
          configureUserSettings: |-
            {
              "auth_mode": "oidc_auth",
              "oidc_name": "Keycloak",
              "oidc_endpoint": "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/kubernetes",
              "oidc_client_id": "harbor",
              "oidc_client_secret": "harbor-secret",
              "oidc_groups_claim": "groups",
              "oidc_admin_group": "cluster-admins",
              "oidc_scope": "openid,profile,email,groups",
              "oidc_auto_onboard": "true",
              "oidc_verify_cert": "false"
            }
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
