apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-policy
  namespace: devtools
  annotations:
    # Policy must exist before the headlamp Deployment is (re)admitted.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: resources
    directory:
      include: "headlamp-policy.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
