apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.40.0
    helm:
      valuesObject:
        config:
          oidc:
            clientID: headlamp
            clientSecret: headlamp-secret
            issuerURL: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/kubernetes
            scopes: openid,profile,email,groups
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
