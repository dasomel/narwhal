apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.40.0
    helm:
      valuesObject:
        podLabels:
          istio.io/dataplane-mode: "none"
        config:
          oidc:
            clientID: headlamp
            clientSecret: headlamp-secret
            issuerURL: https://keycloak.local.narwhal.io/realms/kubernetes
            scopes: openid,profile,email,groups
        initContainers:
          - name: ca-bundle
            image: ghcr.io/headlamp-k8s/headlamp:v0.40.0
            command: ['sh', '-c', 'cat /etc/ssl/certs/ca-certificates.crt /narwhal-ca/ca.crt > /combined/ca-certificates.crt']
            volumeMounts:
              - name: narwhal-ca
                mountPath: /narwhal-ca
                readOnly: true
              - name: combined-certs
                mountPath: /combined
        volumes:
          - name: narwhal-ca
            secret:
              secretName: narwhal-ca-cert
          - name: combined-certs
            emptyDir: {}
        volumeMounts:
          - name: combined-certs
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
