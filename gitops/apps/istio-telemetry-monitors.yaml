apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-telemetry-monitors
  namespace: devtools
  annotations:
    # PodMonitor CRD comes from prometheus-stack; sync after monitoring + istio are up.
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: resources
    directory:
      include: "istio-telemetry-monitors.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
