# Keycloak IAM (Authentik 대체)
# Keycloak Operator CRD+RBAC: 11-keycloak.sh에서 스크립트로 설치
# GitOps는 Keycloak CR만 관리
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: resources
    directory:
      include: "keycloak-cr.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
