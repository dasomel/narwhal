apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: narwhal-portal
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/gitea-admin/narwhal-gitops.git
    targetRevision: HEAD
    path: resources
    directory:
      include: "{narwhal-portal-k8s.yaml,narwhal-portal-policy.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Skaffold 로컬 개발(dev-{user}-{timestamp} 태그) 이미지 교체를 drift로 간주하지 않음.
  # 운영 배포는 GitOps 매니페스트의 태그(예: :latest)를 그대로 유지.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: narwhal-portal
      namespace: devtools
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/env
        - /spec/replicas
    # Kyverno admission webhook injects autogen rules / defaults — suppress drift.
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.rules[].match
        - .spec.rules[].exclude
        - .spec.rules[].validate
        - .spec.rules[].mutate
        - .spec.rules[].generate
        - .spec.background
        - .spec.admission
        - .spec.emitWarning
        - .spec.failurePolicy
        - .spec.validationFailureAction
        - .metadata.annotations
        - .metadata.labels
