apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.1.3
    helm:
      valuesObject:
        replicaCount: 1
        podLabels:
          istio.io/dataplane-mode: "none"
        config:
          clientID: oauth2-proxy
          clientSecret: oauth2-proxy-secret
          cookieSecret: "7f3e9d2c4b8a1f6e5d9c3a7b2e4f8c1d"
          configFile: |-
            provider = "keycloak-oidc"
            provider_display_name = "Keycloak"
            oidc_issuer_url = "https://keycloak.local.narwhal.io/realms/kubernetes"
            redirect_url = "https://oauth2-proxy.local.narwhal.io/oauth2/callback"
            upstreams = ["static://200"]
            email_domains = ["*"]
            cookie_secure = true
            ssl_insecure_skip_verify = true
            cookie_domains = [".local.narwhal.io"]
            whitelist_domains = [".local.narwhal.io"]
            set_xauthrequest = true
            set_authorization_header = true
            pass_access_token = true
            pass_authorization_header = true
            skip_provider_button = true
            code_challenge_method = "S256"
            insecure_oidc_skip_issuer_verification = true
            insecure_oidc_allow_unverified_email = true
            allowed_groups = ["cluster-admin", "developer", "viewer"]
            # cookie_expire = "168h"  # default 7 days, browser restart survives
        extraArgs:
          - --skip-jwt-bearer-tokens=true
        service:
          type: ClusterIP
          portNumber: 80
        ingress:
          enabled: false  # We use Gateway API instead
  destination:
    server: https://kubernetes.default.svc
    namespace: iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
