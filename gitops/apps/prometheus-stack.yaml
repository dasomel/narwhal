apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 81.5.1
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 7d
            # Discover all PrometheusRules regardless of release label
            ruleSelector: {}
            ruleNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 10Gi
        grafana:
          assertNoLeakedSecrets: false
          # Admin credentials loaded from existingSecret
          # Secret 'grafana-secrets' is created by scripts/cluster/08-platform-apps.sh
          # Required keys: admin-user, admin-password
          admin:
            existingSecret: grafana-secrets
            userKey: admin-user
            passwordKey: admin-password
          podLabels:
            istio.io/dataplane-mode: "none"
          persistence:
            enabled: true
            storageClassName: nfs-csi
            size: 5Gi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              enabled: true
          # OIDC client_secret loaded from Secret via $__file{} Grafana file provider
          # Secret 'grafana-oauth-secret' is created by scripts/cluster/11-keycloak.sh
          # Required key: client_secret
          extraSecretMounts:
            - name: grafana-oidc-secret-mount
              secretName: grafana-oidc-secret
              defaultMode: 0440
              mountPath: /etc/secrets/auth_generic_oauth
              readOnly: true
          grafana.ini:
            server:
              root_url: https://grafana.local.narwhal.io
            tracing.opentelemetry.otlp:
              address: tempo.monitoring.svc.cluster.local:4317
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
              scopes: openid email profile groups
              auth_url: https://keycloak.local.narwhal.io/realms/narwhal/protocol/openid-connect/auth
              token_url: https://keycloak.local.narwhal.io/realms/narwhal/protocol/openid-connect/token
              api_url: https://keycloak.local.narwhal.io/realms/narwhal/protocol/openid-connect/userinfo
              groups_attribute_path: groups
              # self-signed cert 환경 (narwhal-ca). 실제 CA cert ca_file로 교체 가능
              tls_skip_verify_insecure: true
              allow_assign_grafana_admin: true
              role_attribute_path: contains(groups[*], 'cluster-admin') && 'Admin' || contains(groups[*], 'developer') && 'Editor' || 'Viewer'
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
