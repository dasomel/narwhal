apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 34.0.0
    helm:
      valuesObject:
        # Gateway API support
        providers:
          kubernetesGateway:
            enabled: true
            experimentalChannel: true

        # GatewayClass configuration
        gatewayClass:
          enabled: true
          name: traefik

        # Gateway configuration
        gateway:
          enabled: true
          name: traefik-gateway
          namespace: traefik
          listeners:
            http:
              port: 8000
              protocol: HTTP
            https:
              port: 8443
              protocol: HTTPS
              certificateRefs:
                - name: traefik-tls
                  kind: Secret

        # Service configuration
        service:
          type: LoadBalancer
          annotations:
            # For MetalLB or kube-vip
            io.cilium/lb-ipam-ips: "192.168.56.100"

        # Resource limits for 8GB nodes
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        # Single replica for dev
        deployment:
          replicas: 1

        # Dashboard
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.local.narwhal.io`)
            entryPoints:
              - web

        # Logs
        logs:
          general:
            level: INFO
          access:
            enabled: true

        # Metrics for Prometheus
        metrics:
          prometheus:
            enabled: true
            serviceMonitor:
              enabled: true
              namespace: traefik

        # Additional arguments
        additionalArguments:
          - "--api.insecure=true"
          - "--providers.kubernetesgateway.experimentalchannel=true"

        # RBAC
        rbac:
          enabled: true

        # Tolerations for disk pressure
        tolerations:
          - key: "node.kubernetes.io/disk-pressure"
            operator: "Exists"
            effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
