apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.27.0
    helm:
      valuesObject:
        # Standalone mode — Trivy CLI runs inside scan Job pods, no shared server.
        # 자원 제약 환경(Worker 6GB)에서 Server 모드보다 가볍고 격리도 높음.
        trivy:
          mode: Standalone
          ignoreUnfixed: false
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          timeout: "10m0s"
          # Trivy DB는 ghcr.io/aquasecurity/trivy-db 에서 pull (레이트 리밋 영향 적음)
          dbRepository: ghcr.io/aquasecurity/trivy-db
          javaDbRepository: ghcr.io/aquasecurity/trivy-java-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        operator:
          # 모든 네임스페이스 스캔 (빈 문자열 = all)
          targetNamespaces: ""
          excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system"
          scanJobsConcurrentLimit: 3
          scanJobTimeout: 10m
          # 빌트인 Trivy 서버 비활성 (Standalone 모드)
          builtInTrivyServer: false
          # 자동 스캔 활성
          vulnerabilityScannerEnabled: true
          configAuditScannerEnabled: false  # CIS/kube-bench는 별도 (사용자 결정)
          rbacAssessmentScannerEnabled: false
          infraAssessmentScannerEnabled: false
          exposedSecretScannerEnabled: true
          clusterComplianceEnabled: false
          metricsVulnIdEnabled: true
          metricsExposedSecretInfo: true
          # 12시간 주기 재스캔 (Vagrant 환경 부하 고려)
          scanJobTTL: 12h
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # Prometheus 자동 수집 (prometheus-stack 의 ServiceMonitor selector 매칭됨)
        serviceMonitor:
          enabled: true
          namespace: security-system
          interval: 1m

        # Istio ambient mesh 제외 — Trivy operator는 K8s API + scan Job만 사용
        podLabels:
          istio.io/dataplane-mode: "none"

        nodeSelector: {}
        tolerations:
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule

        # node-collector: 노드 OS/패키지 인벤토리 수집 (CNI/kernel 정보)
        nodeCollector:
          # 비용/소음 줄이려면 비활성. 일단 활성 — Phase 2에서 노드 OS CVE에도 활용.
          enabled: true
          tolerations:
            - operator: Exists
              effect: NoSchedule

  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
