apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 11.3.2
    helm:
      valuesObject:
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.1
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://seaweedfs-s3.storage.svc.cluster.local:8333
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: us-east-1
          defaultBackupStorageLocation: default
          defaultVolumeSnapshotLocations: aws:default
          uploaderType: kopia
          # Enable file-system backup by default for all pods with PVCs
          defaultVolumesToFsBackup: true
        credentials:
          useSecret: true
          # Reference secret created by 08-platform-apps.sh (velero-s3-credentials in storage ns)
          # Secret key 'cloud' contains AWS credentials file format with actual SeaweedFS S3 keys
          existingSecret: velero-s3-credentials
        snapshotsEnabled: false
        # Disable CRD upgrade hook - alpine/k8s musl binaries can't exec in velero glibc container
        upgradeCRDs: false
        kubectl:
          image:
            repository: docker.io/alpine/k8s
            tag: "1.31.4"
        deployNodeAgent: true
        nodeAgent:
          podVolumePath: /var/lib/kubelet/pods
          privileged: true
        schedules:
          # Daily full backup (all namespaces with PVCs)
          daily-full:
            disabled: false
            schedule: "0 2 * * *"
            template:
              ttl: 168h
              includedNamespaces:
                - "*"
              excludedNamespaces:
                - kube-system
                - storage
                - monitoring
              includeClusterResources: true
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Database backup (PostgreSQL - CNPG)
          daily-databases:
            disabled: false
            schedule: "0 1 * * *"
            template:
              ttl: 336h  # 14 days
              includedNamespaces:
                - iam
                - devtools
              labelSelector:
                matchLabels:
                  cnpg.io/cluster: ""
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Gitea backup
          daily-gitea:
            disabled: false
            schedule: "0 3 * * *"
            template:
              ttl: 336h  # 14 days
              includedNamespaces:
                - devtools
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Harbor backup
          daily-harbor:
            disabled: false
            schedule: "0 4 * * *"
            template:
              ttl: 168h  # 7 days
              includedNamespaces:
                - devtools
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # OpenBao backup
          daily-openbao:
            disabled: false
            schedule: "0 5 * * *"
            template:
              ttl: 336h  # 14 days
              includedNamespaces:
                - storage
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
