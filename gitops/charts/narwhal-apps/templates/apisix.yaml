apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: apisix
    targetRevision: "2.13.0"
    helm:
      valuesObject:
        extraVolumes:
          - name: narwhal-root-ca
            secret:
              secretName: narwhal-root-ca-secret
              optional: true
        extraVolumeMounts:
          - name: narwhal-root-ca
            mountPath: /usr/local/apisix/conf/cert/narwhal
            readOnly: true
        # APISIX 3.15 has NO kubernetes secret manager module, so OIDC secrets
        # are injected as env vars here and referenced via $env://VAR in
        # apisix-routes.yaml (chart renders these with valueFrom into the apisix container).
        extraEnvVars:
          - name: GITEA_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: gitea-oidc-secret
                key: client_secret
          - name: GITEA_OIDC_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: gitea-oidc-secret
                key: session_secret
          - name: HUBBLE_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: hubble-oidc-secret
                key: client_secret
          - name: HUBBLE_OIDC_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: hubble-oidc-secret
                key: session_secret
          - name: PROMETHEUS_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: prometheus-oidc-secret
                key: client_secret
          - name: PROMETHEUS_OIDC_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: prometheus-oidc-secret
                key: session_secret
          - name: ALERTMANAGER_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: alertmanager-oidc-secret
                key: client_secret
          - name: ALERTMANAGER_OIDC_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: alertmanager-oidc-secret
                key: session_secret
          - name: VELERO_UI_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: velero-ui-oidc-secret
                key: client_secret
          - name: VELERO_UI_OIDC_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: velero-ui-oidc-secret
                key: session_secret
        # Trivy KSV001/003/104 on the apisix container. NOTE: this chart's
        # deployment.yaml template reads `.Values.securityContext` (TOP-LEVEL, sibling
        # of `apisix:` below), NOT `apisix.securityContext` -- verified by reading the
        # chart source. No runAsNonRoot here (KSV012 left unfixed): the live image
        # config USER is the non-numeric string "apisix" (resolves to numeric uid 636
        # at runtime via NSS, confirmed functionally non-root, but kubelet's static
        # admission check can't verify a non-numeric USER and rejects
        # runAsNonRoot:true -- this broke the gateway on the first hardening attempt,
        # reverted). seccompProfile is explicit here (not covered by kyverno's
        # add-default-seccomp mutate -- platform-system is in that policy's exclude
        # list).
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        # apisix.image.tag override removed: chart 2.13.0's Deployment template does NOT
        # wire this key -- the live pod always runs the chart's top-level `image:`
        # default (apache/apisix:3.15.0-ubuntu). A "-debian" override here was dead
        # config that misrepresented what actually runs; removed for honesty, not
        # changed to apply (that would restart apisix onto a different image).
        apisix:
          enabled: true
          podLabels:
            istio.io/dataplane-mode: "none"
          # Mount Narwhal root CA so openid-connect plugin can verify Keycloak TLS
          # (Vuln 3 — replaces ssl_verify=false in 11-3/11-5 routes).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ssl:
            enabled: true
            containerPort: 9443
          # OIDC secrets come from extraEnvVars above; routes reference them via $env:// (see apisix-routes.yaml).
          fullCustomConfig:
            enabled: true
            config:
              apisix:
                node_listen:
                  - 9080
                enable_heartbeat: true
                enable_admin: true
                enable_admin_cors: true
                enable_debug: false
                enable_control: true
                control:
                  ip: 127.0.0.1
                  port: 9090
                enable_dev_mode: false
                enable_reuseport: true
                enable_ipv6: true
                enable_http2: true
                enable_server_tokens: true
                proxy_cache:
                  cache_ttl: 10s
                  zones:
                  - name: disk_cache_one
                    memory_size: 50m
                    disk_size: 1G
                    disk_path: "/tmp/disk_cache_one"
                    cache_levels: "1:2"
                router:
                  http: radixtree_host_uri
                  ssl: 'radixtree_sni'
                proxy_mode: http
                dns_resolver_valid: 30
                resolver_timeout: 5
                ssl:
                  enable: true
                  # Trust the Narwhal Root CA for internal OIDC token exchange (Keycloak TLS)
                  ssl_trusted_certificate: /usr/local/apisix/conf/cert/narwhal/ca.crt
                  listen:
                    - port: 9443
                      enable_http3: false
                  ssl_protocols: "TLSv1.2 TLSv1.3"
                  ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA"
                trusted_addresses:
                  - 127.0.0.1
              nginx_config:
                error_log: "/dev/stderr"
                error_log_level: "warn"
                worker_processes: "auto"
                enable_cpu_affinity: true
                worker_rlimit_nofile: 20480
                event:
                  worker_connections: 10620
                # NextAuth session cookies (portal ≥1.0.11 stores Keycloak access+refresh
                # tokens in the JWE) push /api/auth/callback/keycloak response headers past
                # nginx's 4k default proxy buffer → "upstream sent too big header" → 502 on
                # every portal login. http-context directives inherit into all routes.
                http_configuration_snippet: |
                  proxy_buffer_size 16k;
                  proxy_buffers 8 16k;
                  proxy_busy_buffers_size 32k;
                http:
                  enable_access_log: true
                  access_log: "/dev/stdout"
                  access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request" $status $body_bytes_sent $request_time "$http_referer" "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time "$upstream_scheme://$upstream_host$upstream_uri"'
                  access_log_format_escape: default
                  keepalive_timeout: "60s"
                  client_header_timeout: 60s
                  client_body_timeout: 60s
                  client_max_body_size: 0
                  client_body_buffer_size: 128k
                  send_timeout: 10s
                  underscores_in_headers: "on"
                  real_ip_header: "X-Real-IP"
                  real_ip_from:
                    - 127.0.0.1
                    - 'unix:'
              deployment:
                role: traditional
                role_traditional:
                  config_provider: etcd
                admin:
                  allow_admin:
                    - 0.0.0.0/0
                  admin_listen:
                    ip: 0.0.0.0
                    port: 9180
                  admin_key:
                    # admin/viewer keys are injected at runtime from the APISIX_ADMIN_KEY /
                    # APISIX_VIEWER_KEY env vars (APISIX env-interpolation). The value below is
                    # double-escaped so the literal placeholder survives BOTH this narwhal-apps
                    # Helm render (backtick raw string) AND the apisix chart's own tpl pass;
                    # without it ArgoCD's helm template fails ("function APISIX_ADMIN_KEY not
                    # defined") and the app is stuck Unknown. (Do NOT put brace-placeholders in
                    # this comment — Helm processes comment text too.)
                    - name: "admin"
                      key: '{{ `${{ "{{" }}APISIX_ADMIN_KEY{{ "}}" }}` }}'
                      role: admin
                    - name: "viewer"
                      key: '{{ `${{ "{{" }}APISIX_VIEWER_KEY{{ "}}" }}` }}'
                      role: viewer
                etcd:
                  host:
                    - "http://apisix-etcd.platform-system.svc.cluster.local:2379"
                  prefix: "/apisix"
                  timeout: 30
          # Chart 2.13.0 uses apisix.admin.allow.ipList to generate allow_admin.
          # Default 127.0.0.1/24 blocks apisix-ingress-controller → sync failures → 403.
          admin:
            credentials:
              secretName: apisix-admin-key
              secretAdminKey: key
              secretViewerKey: viewer
            allow:
              ipList:
                - 0.0.0.0/0
        {{- /*
        Kakao Cloud has no L2 for MetalLB, so the worker LB forwards to fixed node
        ports. They are declared here rather than patched in by 08-1-networking.sh,
        or ArgoCD selfHeal reverts the patch to whatever this chart renders. Chart
        2.13.0 service-gateway.yaml honors service.{http,tls}.nodePort only while
        service.type is NodePort. Kept as a Helm comment, not a YAML one, so the
        vagrant branch renders byte-identical to before this became provider-aware.
        */}}
        {{- if eq .Values.provider "kakao" }}

        service:
          type: NodePort
          http:
            nodePort: {{ .Values.apisixNodePorts.http }}
          tls:
            nodePort: {{ .Values.apisixNodePorts.tls }}
        {{- else }}

        # LoadBalancer: same IP as former Traefik
        # NOTE: chart uses service.type/annotations (not gateway.type)
        service:
          type: LoadBalancer
          annotations:
            metallb.universe.tf/loadBalancerIPs: "192.168.56.200"
        {{- end }}
        gateway:
          http:
            enabled: true
            servicePort: 80
            containerPort: 9080
          tls:
            enabled: true
            servicePort: 443
            containerPort: 9443

        # Admin API (internal only)
        admin:
          enabled: true
          type: ClusterIP
          port: 9180

        # Use external etcd (registry.k8s.io/etcd — no Bitnami)
        # NOTE: chart uses externalEtcd.host when etcd.enabled=false
        etcd:
          enabled: false
          prefix: "/apisix"
          timeout: 30
        externalEtcd:
          user: ""  # disable etcd auth (etcd auth is not enabled)
          host:
            - "http://apisix-etcd.platform-system.svc.cluster.local:2379"

        # APISIX Ingress Controller (watches ApisixRoute CRDs)
        ingressController:
          enabled: true
          image:
            # docker.io: APISIX Ingress Controller 공식 이미지, ghcr.io/quay.io 대안 없음
            repository: apache/apisix-ingress-controller
            tag: "1.8.0"
          podLabels:
            istio.io/dataplane-mode: "none"
          config:
            apisix:
              serviceNamespace: platform-system
              adminAPIVersion: "v3"
            kubernetes:
              watchNamespaces: []  # All namespaces
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        # Metrics for Prometheus
        serviceMonitor:
          enabled: true
          namespace: platform-system

        tolerations:
          - key: "node.kubernetes.io/disk-pressure"
            operator: "Exists"
            effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
