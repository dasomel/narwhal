apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: chaos-mesh
    targetRevision: 2.8.3
    helm:
      valuesObject:
        chaosDaemon:
          # chaos-daemon needs privileged + hostPID (hardcoded in the chart's
          # DaemonSet, not a values toggle) to inject faults into other pods'
          # network/IO namespaces. Excluded from Kyverno disallow-privileged-
          # containers / disallow-host-namespaces for the chaos-testing
          # namespace only (see gitops/resources/kyverno-policies.yaml).
          runtime: containerd
          socketPath: /run/containerd/containerd.sock
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # D-OWN-CHAOS: namespace-scoped mode. The chart then binds the target-namespace
        # ClusterRole with a RoleBinding in targetNamespace only (instead of a
        # ClusterRoleBinding) and the manager caches/acts on chaos-testing alone, so
        # Pod/ConfigMap/Secret and chaos-mesh.org verbs are no longer granted cluster-wide.
        clusterScoped: false
        controllerManager:
          # Chart default replicaCount is 3 -- nodes are 2vCPU/6GB, so pin to 1.
          replicaCount: 1
          # Only experiments in this namespace can target pods (RBAC boundary).
          targetNamespace: chaos-testing
          # Blast-radius guard is the RoleBinding above, not the namespace annotation:
          # the annotation filter reads Namespace objects cluster-wide, which the chart's
          # namespace-scoped ClusterRole deliberately omits (namespaces/services only
          # under clusterScoped), so keeping it true would deny every experiment.
          enableFilterNamespace: false
          # D-OWN-CHAOS: the chart's controller pod securityContext is the only knob
          # (no container-level one). v2.8.3 image has no USER (root by default), runs a
          # static Go controller on ports 10250/10080, reads webhook/daemon/chaosd certs from
          # 0644 Secret volumes and needs only /tmp (1777) -> 65532 is safe.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        dashboard:
          create: false
        dnsServer:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-testing
  # The controller injects webhook caBundle at runtime; ArgoCD must not
  # fight it (same pattern as cert-manager-injected bundles).
  # The chart also regenerates self-signed certs (genSignedCert) and a random
  # `rollme` pod annotation on EVERY render — without ignoring those, selfHeal
  # re-rolls controller/daemon on every sync forever (same trap as harbor's
  # checksum/secret churn).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    # chaos-testing is a single-tenant namespace and every Secret in it is a
    # chart-regenerated self-signed cert (genSignedCert on each render) — ignore
    # /data on all of them with one rule so a chart bump adding/renaming a cert
    # secret can't restart the selfHeal re-roll churn.
    - kind: Secret
      namespace: chaos-testing
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: chaos-controller-manager
      namespace: chaos-testing
      jqPathExpressions:
        - '.spec.template.metadata.annotations.rollme'
    - group: apps
      kind: DaemonSet
      name: chaos-daemon
      namespace: chaos-testing
      jqPathExpressions:
        - '.spec.template.metadata.annotations.rollme'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large chaos-mesh CRDs exceed the last-applied annotation limit
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    # D-PSA-LABELS-14 (KISA-POD-01): keep chaos-testing PSA audit/warn labels declared
    # in GitOps alongside apply-psa-labels.sh (privileged because chaos-daemon needs
    # privileged + hostPID). Never set enforce here.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
