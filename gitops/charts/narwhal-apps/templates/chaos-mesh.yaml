apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
      chart: chaos-mesh
      targetRevision: 2.8.3
      helm:
        valuesObject:
          chaosDaemon:
            # chaos-daemon needs privileged + hostPID (hardcoded in the chart's
            # DaemonSet, not a values toggle) to inject faults into other pods'
            # network/IO namespaces. Excluded from Kyverno disallow-privileged-
            # containers / disallow-host-namespaces for the chaos-testing
            # namespace only (see gitops/resources/kyverno-policies.yaml).
            runtime: containerd
            socketPath: /run/containerd/containerd.sock
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          # D-OWN-CHAOS: scope the manager cache and pod selection to chaos-testing.
          clusterScoped: false
          rbac:
            create: false
          controllerManager:
            # The Deployment uses these settings to select its SA even with rbac.create=false.
            serviceAccountCreate: true
            serviceAccount: chaos-controller-manager
            # Chart default replicaCount is 3 -- nodes are 2vCPU/6GB, so pin to 1.
            replicaCount: 1
            targetNamespace: chaos-testing
            # The namespace annotation filter requires cluster-wide Namespace reads.
            enableFilterNamespace: false
            # The chart sets pod-level securityContext. The controller uses
            # unprivileged ports and reads its certificates from mounted files.
            # D-CHAOS-MGR-CHART (R423): chart 2.8.3 only renders Pod securityContext;
            # container privilege/capability controls are unavailable, so the controller-manager
            # KSV001/KSV003/KSV004 findings stay accepted; escape: revisit after chart support.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          dashboard:
            create: false
          dnsServer:
            create: false
    # D-CHAOS-OWN-RBAC: use the same Application to sync and prune the chart and
    # its RBAC. Chart 2.8.3 hardcodes wildcard grants and extraObjects calls an
    # undefined helper. Cost: re-audit the explicit rules on each chart upgrade.
    # Escape hatch: once a chart can render the same rules, migrate their ownership
    # within this Application and drop this source after checking the rendered diff.
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: HEAD
      path: resources
      directory:
        include: chaos-mesh-rbac.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-testing
  # The controller injects webhook caBundle at runtime; ArgoCD must not
  # fight it (same pattern as cert-manager-injected bundles).
  # The chart also regenerates self-signed certs (genSignedCert) and a random
  # `rollme` pod annotation on EVERY render — without ignoring those, selfHeal
  # re-rolls controller/daemon on every sync forever (same trap as harbor's
  # checksum/secret churn).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    # chaos-testing is a single-tenant namespace and every Secret in it is a
    # chart-regenerated self-signed cert (genSignedCert on each render) — ignore
    # /data on all of them with one rule so a chart bump adding/renaming a cert
    # secret can't restart the selfHeal re-roll churn.
    - kind: Secret
      namespace: chaos-testing
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: chaos-controller-manager
      namespace: chaos-testing
      jqPathExpressions:
        - '.spec.template.metadata.annotations.rollme'
    - group: apps
      kind: DaemonSet
      name: chaos-daemon
      namespace: chaos-testing
      jqPathExpressions:
        - '.spec.template.metadata.annotations.rollme'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large chaos-mesh CRDs exceed the last-applied annotation limit
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    # D-PSA-LABELS-14 (KISA-POD-01): keep chaos-testing PSA audit/warn labels declared
    # in GitOps alongside apply-psa-labels.sh (privileged because chaos-daemon needs
    # privileged + hostPID). Never set enforce here.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
