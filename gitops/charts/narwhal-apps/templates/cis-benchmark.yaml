# Generated by scripts/ops/render-cis-benchmark.py.
# D2: /data only on labeled record ConfigMaps; script data stays reconciled.
# Cost: evidence data drift intentional; escape hatch: remove ignore + RespectIgnoreDifferences.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cis-benchmark
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: HEAD
    path: resources
    directory:
      include: cis-benchmark.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  ignoreDifferences:
    -
      group: ""
      kind: ConfigMap
      namespace: security-system
      jqPathExpressions:
        - select(.metadata.labels["narwhal.io/compliance-tool"] == "kube-bench") | .data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
