{{- /*
D-FALCO-045 (2026-10-28, owner decision) — Falco 0.45.1 (chart 9.2.1) is ENABLED on every provider.

History: disabled 2026-07-08 because Falco 0.39.2 (libs 0.18.2) modern_ebpf failed `scap_init` on the
Ubuntu 26.04 / kernel 7.0 Vagrant box (docs/common/lessons-log.md 2026-07-08).

Reason: 0.45.1 (libs 0.26.1, driver 11.0.1) is the first release carrying all the upstream fixes for
kernel 7.0: falcosecurity/libs#2997 (execve verifier instruction count), #3021 (sendmmsg/recvmmsg
bpf_loop), #3086 (per-CPU auxmap race on preemptible kernels, falcosecurity/falco#3955) and #3119
(signal_deliver verifier on newer kernels). Upstream reports no such failures on Ubuntu 24.04 / kernel 6.8
(the Kakao nodes); none of this has been observed on this repo's nodes yet.

Cost: a privileged DaemonSet on every node, masters included (~300Mi each, see
docs/common/master-memory-pressure.md). falcoctl is OFF (airgap), so the rules (falco-rules 5.2.0) and the
container plugin (0.7.5) are the ones baked into the image and change only with an image bump. Kernel 7.0
(Vagrant) is backed by upstream reports only; it has NOT been observed on this repo's nodes.

Escape hatch: wrap the manifest below in a Helm "if false" guard again and push; ArgoCD prunes the app.
03-save-helm-charts.sh and check-chart-upstream-sources.py skip a template that carries that guard,
and they match the guard text ANYWHERE in the file, so never spell it out in a comment here.
There is no per-OS exclusion any more: 14-gitops-bootstrap.sh used to `rm` this file on Ubuntu 26.04.

Chart 4.16.0 -> 9.2.1 breaking changes handled here (falcosecurity/charts BREAKING-CHANGES.md):
  - 7.0.0 collectors.containerd/cri/docker removed  -> collectors.containerEngine (container plugin)
  - 9.0.0 gRPC output + server dropped             -> falco.grpc / falco.grpc_output removed; the chart FAILS
                                                      TO RENDER if either key is present. falcosidekick now
                                                      receives events over http_output (set by the chart).
  - 9.0.0 legacy eBPF + gVisor dropped             -> modern_ebpf only (unchanged here)
  - k8s_audit_rules.yaml is not in the 0.45.1 image (listed /etc/falco) -> dropped from rules_files

Images come from docker.io: ghcr.io/falcosecurity/{falco,falcosidekick,falcoctl} do not exist (`crane ls`
-> NAME_UNKNOWN), quay.io answers UNAUTHORIZED, and the only other publisher is public.ecr.aws, which is
outside the repo's registry order (ghcr.io > registry.k8s.io > quay.io > docker.io).
Tags are pinned here, not left to chart defaults: falcosidekick's subchart 0.14.1 declares
appVersion 2.31.1 in Chart.yaml but its values.yaml/Deployment use image 2.32.0.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: falco
    targetRevision: 9.2.1
    helm:
      valuesObject:
        image:
          # docker.io: none of ghcr.io, registry.k8s.io or quay.io hosts this image (see header).
          registry: docker.io
          repository: falcosecurity/falco
          tag: "0.45.1"

        # modern_ebpf: Cilium(eBPF CNI)와 공존 검증된 모드.
        # CO-RE 기반 — 커널 헤더 의존성 없음, kernel module 빌드 불필요.
        # (driver loader init 컨테이너는 modern_ebpf에서 렌더되지 않는다 — 이미지 1개 절약)
        driver:
          enabled: true
          kind: modern_ebpf
          modernEbpf:
            # leastPrivileged:false (full privileged), unchanged. 0.45.1 was not tried with true. The July
            # note blaming leastPrivileged for the 0.39.2 failure does not hold: 0.39.2 also fails
            # scap_init on a kernel 7.0.14 VM when run privileged (2026-10-28 lab, lessons-log).
            leastPrivileged: false

        # Falco DaemonSet (모든 노드)
        tty: true

        # Container/K8s metadata (Falco >= 0.41): the `container` plugin replaces the old built-in
        # container engine. It is BAKED INTO the Falco image (/usr/share/falco/plugins/libcontainer.so),
        # so no falcoctl artifact pull is needed. k8s.ns.name / k8s.pod.name come from the CRI socket
        # (pod sandbox labels), so k8s-metacollector / k8smeta stay off.
        # Only the CRI engine on the kubeadm containerd socket is enabled: each enabled engine adds a
        # hostPath mount of its socket directory to a privileged pod.
        collectors:
          enabled: true
          containerEngine:
            enabled: true
            engines:
              docker:
                enabled: false
              podman:
                enabled: false
              containerd:
                enabled: false
              cri:
                enabled: true
                sockets: ["/run/containerd/containerd.sock"]
              lxc:
                enabled: false
              libvirt_lxc:
                enabled: false
              bpm:
                enabled: false

        # Airgap: Kakao nodes cannot reach ghcr.io / docker.io, and falcoctl pulls rules and the container
        # plugin from ghcr.io/falcosecurity at runtime. Both are baked into the image, so the install
        # init container and the follow sidecar are disabled (also removes the falcoctl image from the
        # mirror list). Rule updates now arrive with the Falco image bump, not between bumps.
        falcoctl:
          artifact:
            install:
              enabled: false
            follow:
              enabled: false

        # Prometheus 메트릭 endpoint
        metrics:
          enabled: true
          interval: 1h
          # outputRule:false — with true, Falco 0.45.1 emits a "Falco internal: metrics snapshot" event
          # (priority Informational, source "internal") at start and every `interval`, even with
          # `priority: notice`; falcosidekick ships it to Loki and the portal feed ({rule=~".+"}) would list
          # one such row per node per hour. Prometheus scrapes the same counters from the webserver.
          outputRule: false
          rulesCountersEnabled: true
          resourceUtilizationEnabled: true
          stateCountersEnabled: true
          kernelEventCountersEnabled: true

        # ServiceMonitor (Prometheus 자동 수집)
        # prometheus-stack only selects monitors labelled release=prometheus-stack
        # (see gitops/resources/istio-telemetry-monitors.yaml); without the label the monitor is never scraped.
        serviceMonitor:
          create: true
          labels:
            release: prometheus-stack

        falco:
          json_output: true
          json_include_output_property: true
          log_stderr: true
          log_syslog: false
          priority: notice
          # 기본 룰셋 (이미지 번들 falco-rules 5.2.0). k8s_audit_rules.yaml은 0.45.1 이미지에 없다.
          rules_files:
            - /etc/falco/falco_rules.yaml
            - /etc/falco/falco_rules.local.yaml
            - /etc/falco/rules.d
          # The portal (portal/src/lib/falco.ts) reads k8s.ns.name, k8s.pod.name, container.name and
          # container.image.repository from output_fields. Since 0.41 the bundled rules no longer print
          # %container.info: those keys exist only because the container plugin's suggested output
          # appends them (observed on 0.45.1 + plugin 0.7.5: output_fields carry container.id/.name/
          # .image.repository/.image.tag and k8s.ns.name/k8s.pod.name). Keep suggested_output on.
          append_output:
            - suggested_output: true
          # gRPC output/server was dropped in Falco 0.44 (chart 9.0.0): the chart fails to render with
          # falco.grpc / falco.grpc_output. falcosidekick is fed over http_output, which the chart wires
          # automatically when falcosidekick.enabled=true.

        # 노드 리소스 제약
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # privileged DaemonSet — kernel namespace 접근 필수
        tolerations:
          - operator: Exists
            effect: NoSchedule

        podLabels:
          istio.io/dataplane-mode: "none"

        # ─────────────────────────────────────────
        # Falcosidekick: Falco 이벤트 → Loki + Alertmanager fanout
        # ─────────────────────────────────────────
        falcosidekick:
          enabled: true
          replicaCount: 1
          image:
            # docker.io: none of ghcr.io, registry.k8s.io or quay.io hosts this image (see header).
            registry: docker.io
            repository: falcosecurity/falcosidekick
            tag: "2.32.0"
          # Web UI 비활성 (portal에서 자체 UI 제공)
          webui:
            enabled: false
          podLabels:
            istio.io/dataplane-mode: "none"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus-stack
          config:
            debug: false
            # 모든 priority 이벤트를 Loki에 적재 → portal에서 LogQL로 조회
            loki:
              hostport: "http://loki.monitoring.svc.cluster.local:3100"
              user: ""
              tenant: ""
              minimumpriority: "informational"
              # REQUIRED by the portal: the default `text` format stores only the output string, and
              # portal/src/lib/falco.ts JSON.parse()s every Loki line (a text line is silently dropped).
              format: json
              # falcosidekick 2.31-2.32 (outputs/loki.go) sets the stream labels rule, source and priority,
              # plus hostname, tags, k8s_ns_name and k8s_pod_name when present. `source` is the Falco EVENT
              # source ("syscall"), never the literal "falco", and `priority` is capitalised ("Critical").
              # The portal selects on {rule=~".+"} and matches both spellings of priority.
              # extralabels names additional output_fields keys; none are needed.
              extralabels: ""
            # critical 이상은 Alertmanager로 알림 발사
            alertmanager:
              hostport: "http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
              minimumpriority: "critical"
              # default labels 자동 매핑 (rule, priority, hostname → labels)
              # Alertmanager alerts always carry source=falco (hardcoded in falcosidekick
              # outputs/alertmanager.go); kept explicit as the contract for alert routing.
              extralabels: "source:falco"

  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
