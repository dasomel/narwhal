apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.19.1
    helm:
      valuesObject:
        expose:
          type: clusterIP
          tls:
            enabled: false
        externalURL: https://harbor.{{ .Values.baseDomain }}
        # Admin password loaded from existingSecret
        # Secret 'harbor-secrets' is created by scripts/cluster/08-5-registry.sh
        # Required key: HARBOR_ADMIN_PASSWORD
        existingSecretAdminPassword: harbor-secrets
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
        database:
          type: external
          external:
            host: harbor-db-rw
            port: 5432
            username: harbor
            # DB password loaded from existingSecret
            # Secret 'narwhal-db-credentials' created by scripts/cluster/07-cnpg.sh (CNPG)
            # Key must be 'password' per harbor chart requirement — see harbor chart values.yaml:971
            # Note: 07-cnpg.sh stores harbor DB password under key 'harbor-password' in
            # narwhal-db-credentials. A cross-namespace secret copy is required, or
            # scripts/cluster/08-5-registry.sh must create 'harbor-db-credentials' in devtools ns
            # with key 'password' copied from narwhal-db-credentials/harbor-password.
            existingSecret: harbor-db-credentials
            coreDatabase: harbor
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:
              storageClass: nfs-csi
              size: 20Gi
            jobservice:
              storageClass: nfs-csi
            trivy:
              storageClass: nfs-csi
        redis:
          type: internal
          internal:
            image:
              repository: ghcr.io/dasomel/goharbor/redis-photon
              tag: v2.15.1
        trivy:
          enabled: false
        # Pin shared secrets so Helm upgrades never regenerate divergent values.
        # A fresh install must supply these via 08-5-registry.sh before ArgoCD syncs harbor.
        # These are externalized to the harbor-shared-secrets Secret created by scripts/cluster/08-5-registry.sh
        # (keys: secretKey/secret/JOBSERVICE_SECRET).
        existingSecretSecretKey: harbor-shared-secrets
        core:
          existingSecret: harbor-shared-secrets
          image:
            repository: ghcr.io/dasomel/goharbor/harbor-core
            tag: v2.15.1
          podLabels:
            istio.io/dataplane-mode: "none"
          # OIDC config is set via Harbor API by 11-3-keycloak-clients.sh (stored in Harbor DB)
          # CONFIG_OVERWRITE_JSON env var is NOT set — API-based config survives restarts via DB
        jobservice:
          existingSecret: harbor-shared-secrets
          image:
            repository: ghcr.io/dasomel/goharbor/harbor-jobservice
            tag: v2.15.1
        registry:
          registry:
            image:
              repository: ghcr.io/dasomel/goharbor/registry-photon
              tag: v2.15.1
          controller:
            image:
              repository: ghcr.io/dasomel/goharbor/harbor-registryctl
              tag: v2.15.1
        portal:
          image:
            repository: ghcr.io/dasomel/goharbor/harbor-portal
            tag: v2.15.1
          podLabels:
            istio.io/dataplane-mode: "none"
        nginx:
          image:
            repository: ghcr.io/dasomel/goharbor/nginx-photon
            tag: v2.15.1
          podLabels:
            istio.io/dataplane-mode: "none"
        # Metrics/exporter kept OFF: harbor-exporter has NO clean multi-arch v2.15.x tag in
        # ghcr.io/dasomel/goharbor (only :latest + :v2.15.0-build.NN). :latest is the stale-amd64
        # trap that crashlooped every harbor pod on arm64 (exec format error) — see CLAUDE.md
        # mistakes log 2026-07-07. Disabling metrics means the exporter Deployment is never
        # created, so the arch issue can't bite. The override below is pinned to the newest
        # arm64 build purely for hygiene (not pulled while metrics.enabled=false).
        metrics:
          enabled: false
        exporter:
          image:
            repository: ghcr.io/dasomel/goharbor/harbor-exporter
            tag: v2.15.0-build.32
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  # Harbor renders NON-DETERMINISTIC Secrets every reconcile:
  #  - harbor-core: token-signing cert (tls.crt/tls.key, genSignedCert) + CSRF_KEY
  #    (randAlphaNum) — NOT covered by the pinned existingSecret (harbor-shared-secrets
  #    holds only secretKey/secret/JOBSERVICE_SECRET).
  #  - harbor-registry / harbor-registry-htpasswd: registry HTTP secret + basic-auth
  #    htpasswd, also regenerated per render.
  # Each render mutates the checksum/* annotations the Deployments embed:
  #  - harbor-core Deployment      → checksum/secret
  #  - harbor-registry Deployment  → checksum/secret + checksum/secret-core
  #  - harbor-jobservice Deployment→ checksum/secret-core (core hash propagates here)
  # → new pod templates → endless ~5min rollout (fresh ReplicaSets every reconcile) and
  # permanent OutOfSync. Excluding the churning annotations + the auto-generated Secret
  # data from diff/sync freezes them at their live values (core cert/CSRF and the
  # registry credential stay mutually consistent — safer than the churn), stopping the loop.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: harbor-core
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
    - group: apps
      kind: Deployment
      name: harbor-registry
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
        - '.spec.template.metadata.annotations."checksum/secret-core"'
    - group: apps
      kind: Deployment
      name: harbor-jobservice
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret-core"'
    - kind: Secret
      name: harbor-core
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-registry
      jsonPointers:
        - /data
    - kind: Secret
      name: harbor-registry-htpasswd
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
