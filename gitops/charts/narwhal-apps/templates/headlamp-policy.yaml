apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-policy
  namespace: devtools
  annotations:
    # Policy must exist before the headlamp Deployment is (re)admitted.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "headlamp-policy.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # Kyverno injects autogen rules — suppress ArgoCD drift on ClusterPolicy.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.rules[].match
        - .spec.rules[].exclude
        - .spec.rules[].validate
        - .spec.rules[].verifyImages
        - .spec.rules[].mutate
        - .spec.rules[].generate
        - .spec.rules[].skipBackgroundRequests
        - .spec.background
        - .spec.admission
        - .spec.emitWarning
        - .spec.failurePolicy
        - .spec.validationFailureAction
        - .metadata.annotations
        - .metadata.labels
