apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: headlamp
    targetRevision: 0.42.0
    helm:
      valuesObject:
        podLabels:
          istio.io/dataplane-mode: "none"
        # OIDC 모드: 사용자 요청은 사용자 토큰의 RBAC로 수행되므로
        # SA에는 chart 기본값 cluster-admin 대신 읽기 전용 view만 부여.
        clusterRoleBinding:
          clusterRoleName: view
        # No cpu limit on purpose: throttling makes the (chart-hardcoded) 1s
        # probe timeout trip under VM load. Probe tuning itself is applied by
        # the headlamp-probe-tuning Kyverno policy (headlamp-policy.yaml).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        config:
          oidc:
            clientID: headlamp
            issuerURL: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal
            scopes: openid,profile,email,groups
            # clientSecret loaded from externalSecret (Option 3)
            # Secret 'headlamp-oidc-secret' is created by scripts/cluster/11-keycloak.sh
            # The secret must contain the same keys as the default OIDC secret:
            #   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ISSUER_URL, OIDC_SCOPES
            secret:
              create: false
              name: headlamp-oidc-secret
            externalSecret:
              enabled: true
              name: headlamp-oidc-secret
        # Trivy KSV001/003/012/030/104: allowPrivilegeEscalation false, drop ALL caps,
        # seccomp RuntimeDefault. Deep-merges with chart default (runAsNonRoot: true,
        # privileged: false), which already satisfies KSV012 for the main container.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: ca-bundle
            image: ghcr.io/headlamp-k8s/headlamp:v0.42.0
            command: ['sh', '-c', 'cat /etc/ssl/certs/ca-certificates.crt /narwhal-ca/ca.crt > /combined/ca-certificates.crt']
            # Same image as the main container (verified uid=100 non-root live) — safe to
            # force runAsNonRoot here too (Trivy flagged this initContainer separately).
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 100
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: narwhal-ca
                mountPath: /narwhal-ca
                readOnly: true
              - name: combined-certs
                mountPath: /combined
        volumes:
          - name: narwhal-ca
            secret:
              secretName: narwhal-ca-cert
          - name: combined-certs
            emptyDir: {}
        volumeMounts:
          - name: combined-certs
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  # Probes are mutated at admission by the headlamp-probe-tuning Kyverno
  # policy (chart hardcodes them); keep ArgoCD from reverting the mutation.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: headlamp
      namespace: devtools
      jqPathExpressions:
        - '.spec.template.spec.containers[].livenessProbe'
        - '.spec.template.spec.containers[].readinessProbe'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
