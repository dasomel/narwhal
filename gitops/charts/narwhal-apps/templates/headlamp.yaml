apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        image:
          registry: ghcr.io
          repository: headlamp-k8s/headlamp
          tag: v0.46.0
        podLabels:
          istio.io/dataplane-mode: "none"
        # OIDC 모드: 사용자 요청은 사용자 토큰의 RBAC로 수행되므로
        # SA에는 chart 기본값 cluster-admin 대신 읽기 전용 view만 부여.
        clusterRoleBinding:
          clusterRoleName: view
        # No cpu limit on purpose: throttling makes the chart's default 1s
        # probe timeout trip under VM load. Probe tuning itself is applied by
        # the headlamp-probe-tuning Kyverno policy (headlamp-policy.yaml).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        config:
          oidc:
            clientID: headlamp
            issuerURL: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal
            scopes: openid,profile,email,groups
            autoLogin: true
            # clientSecret loaded from externalSecret (Option 3)
            # Secret 'headlamp-oidc-secret' is created by scripts/cluster/11-keycloak.sh
            # The secret must contain the same keys as the default OIDC secret:
            #   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ISSUER_URL, OIDC_SCOPES
            secret:
              create: false
              name: headlamp-oidc-secret
            externalSecret:
              enabled: true
              name: headlamp-oidc-secret
              # Chart >= 0.43.0 omits -oidc-scopes=$(OIDC_SCOPES) unless hasScopes is true.
              hasScopes: true
        # Trivy KSV001/003/012/030/104: allowPrivilegeEscalation false, drop ALL caps,
        # seccomp RuntimeDefault, readOnlyRootFilesystem true. Deep-merges with chart
        # default (runAsNonRoot: true, privileged: false), satisfying KSV012/014.
        # D-PSB-UID (2026-11-26, CIS 5.7.3 KSV020/KSV021 require > 10000): the image's headlamp user is
        # 100:101 but the process only reads world-readable /headlamp files and writes the chart's
        # headlamp-tmp emptyDir (0777), so a numeric 10100 is safe. Escape hatch: main container back to 100/101;
        # the ca-bundle init back to runAsUser 100 with no runAsGroup (it took GID 101 from the image).
        securityContext:
          runAsUser: 10100
          runAsGroup: 10100
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: ca-bundle
            image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
            command: ['sh', '-c', 'cat /etc/ssl/certs/ca-certificates.crt /narwhal-ca/ca.crt > /combined/ca-certificates.crt']
            # Same image as the main container (verified uid=100 non-root live) — safe to
            # force runAsNonRoot here too; UID/GID match the main container (D-PSB-UID) (Trivy flagged this initContainer separately).
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10100
              runAsGroup: 10100
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
              - name: narwhal-ca
                mountPath: /narwhal-ca
                readOnly: true
              - name: combined-certs
                mountPath: /combined
        volumes:
          - name: narwhal-ca
            secret:
              secretName: narwhal-ca-cert
          - name: combined-certs
            emptyDir: {}
        volumeMounts:
          - name: combined-certs
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  # Probes are mutated at admission by the headlamp-probe-tuning Kyverno
  # policy (chart hardcodes them); keep ArgoCD from reverting the mutation.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: headlamp
      namespace: devtools
      jqPathExpressions:
        - '.spec.template.spec.containers[].livenessProbe'
        - '.spec.template.spec.containers[].readinessProbe'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
