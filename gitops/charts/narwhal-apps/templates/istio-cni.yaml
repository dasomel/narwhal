apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: cni
    targetRevision: 1.30.1
    helm:
      valuesObject:
        profile: ambient
        cni:
          ambient:
            enabled: true
            # D-576-DETECTION-RETRY: after a node reboot kubelet recreates sandboxes before the
            # API server is reachable from the CNI plugin; with the default (false) the plugin
            # swallows the pod lookup error, treats the pod as non-ambient and never reports its
            # new IP, so the kubelet-probe ipset misses it and ztunnel STRICT rejects the probes
            # (#576). true makes the plugin retry (30 x 1s) and fail CNI ADD so kubelet retries.
            # Cost: pod start in a mesh namespace blocks up to 30s per attempt while the API server
            # is unreachable. Escape hatch: set false (the pre-#576 behavior).
            enableAmbientDetectionRetry: true
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule
          - key: node.cilium.io/agent-not-ready
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
