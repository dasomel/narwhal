apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: k8s-monitoring
    targetRevision: 4.2.0
    helm:
      valuesObject:
        cluster:
          name: "narwhal"
        destinations:
          loki:
            type: loki
            url: http://loki:3100/loki/api/v1/push
          # D-TRACE-K8S-ATTR (#691): forward OTLP traces enriched with k8s.* attributes
          # from the already-deployed alloy-logs collector to Tempo.
          tempo:
            type: otlp
            url: tempo.monitoring.svc.cluster.local:4317
            protocol: grpc
            tls:
              insecure: true
            metrics:
              enabled: false
            logs:
              enabled: false
            traces:
              enabled: true
        collectors:
          alloy-logs:
            presets: [small, daemonset, filesystem-log-reader]
            includeDestinations:
              - tempo
            service:
              internalTrafficPolicy: Local
            # D-TRACE-K8S-ATTR (#691): OTLP trace ingestion via extraConfig instead of
            # applicationObservability because feature-application-observability hardcodes
            # receiver -> [memory_limiter ->] resourcedetection -> k8sattributes -> transform
            # with no pre-k8sattributes hook to strip untrusted client k8s.*/service.namespace.
            # Pipeline: receiver(4317/4318) -> memory_limiter(384MiB of 512Mi container limit)
            # -> strip_client_k8s(error_mode=propagate, delete ^k8s[.] + service.namespace)
            # -> k8sattributes(ownNode filter, connection-only pod_association) -> tempo.
            # service.namespace is deleted (cost: no trace grouping by service.namespace,
            # and unassociated non-pod senders have no namespace so portal hides them, fail closed).
            extraConfig: |
              otelcol.receiver.otlp "otlp_traces" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                  include_metadata = false
                  max_recv_msg_size = "4MiB"
                  read_buffer_size = "512KiB"
                  write_buffer_size = "32KiB"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                  include_metadata = false
                  max_request_body_size = "20MiB"
                }
                debug_metrics {
                  disable_high_cardinality_metrics = true
                }
                output {
                  traces = [otelcol.processor.memory_limiter.otlp_traces.input]
                }
              }

              otelcol.processor.memory_limiter "otlp_traces" {
                check_interval = "1s"
                limit = "384MiB"
                output {
                  traces = [otelcol.processor.transform.strip_client_k8s.input]
                }
              }

              otelcol.processor.transform "strip_client_k8s" {
                error_mode = "propagate"
                trace_statements {
                  context = "resource"
                  statements = [
                    `delete_matching_keys(attributes, "^k8s[.]")`,
                    `delete_key(attributes, "service.namespace")`,
                  ]
                }
                output {
                  traces = [otelcol.processor.k8sattributes.otlp_traces.input]
                }
              }

              otelcol.processor.k8sattributes "otlp_traces" {
                passthrough = false
                filter {
                  node = sys.env("HOSTNAME")
                }
                extract {
                  metadata = ["k8s.namespace.name","k8s.pod.name","k8s.deployment.name","k8s.statefulset.name","k8s.daemonset.name","k8s.job.name","k8s.node.name"]
                }
                pod_association {
                  source {
                    from = "connection"
                  }
                }
                output {
                  traces = [otelcol.processor.attributes.tempo.input]
                }
              }
            # Trivy KSV014/022/119 on alloy container: readOnlyRootFilesystem requires
            # /tmp emptyDir for storagePath (/tmp/alloy); drop NET_RAW from default caps
            # as a log tailer has no raw packet socket requirements.
            # UID=0 (root) kept intentionally (KSV012 ACCEPT): reading host container
            # logs from /var/log/pods requires root privileges.
            alloy:
              extraPorts:
                - name: otlp-grpc
                  port: 4317
                  targetPort: 4317
                  protocol: TCP
                  appProtocol: grpc
                - name: otlp-http
                  port: 4318
                  targetPort: 4318
                  protocol: TCP
                  appProtocol: http
              mounts:
                extra:
                  - name: tmp
                    mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - DAC_OVERRIDE
                    - FOWNER
                    - FSETID
                    - KILL
                    - SETGID
                    - SETUID
                    - SETPCAP
                    - NET_BIND_SERVICE
                    - SYS_CHROOT
                    - MKNOD
                    - AUDIT_WRITE
                    - SETFCAP
                seccompProfile:
                  type: RuntimeDefault
              # Keep nested configReloader for chart compatibility
              configReloader:
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65534
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
            controller:
              volumes:
                extra:
                  - name: tmp
                    emptyDir: {}
            # Trivy KSV001/003/011/012/014/018/030/104/106 on the config-reloader sidecar
            # Top-level configReloader maps to Alloy CR spec.configReloader (read by alloy-operator).
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
          destinations: []
        # Disabled intentionally: feature-application-observability cannot strip client
        # k8s.*/service.namespace before k8sattributes; see collectors.alloy-logs.extraConfig.
        # Escape hatch: remove extraConfig + includeDestinations: [tempo] + alloy.extraPorts.
        applicationObservability:
          enabled: false
        # Trivy KSV011/015/016/018/030/104 on alloy-operator (verified container-level via helm
        # template). Direct podSecurityContext and securityContext (no intermediate .alloy wrapper).
        alloy-operator:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 4242
            runAsGroup: 4242
            fsGroup: 4242
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
