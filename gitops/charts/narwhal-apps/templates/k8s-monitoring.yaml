apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: k8s-monitoring
    targetRevision: 4.2.0
    helm:
      valuesObject:
        cluster:
          name: "narwhal"
        destinations:
          loki:
            type: loki
            url: http://loki:3100/loki/api/v1/push
          # D-TRACE-K8S-ATTR (#691): forward OTLP traces enriched with k8s.* attributes
          # from the already-deployed alloy-logs collector to Tempo.
          tempo:
            type: otlp
            url: tempo.monitoring.svc.cluster.local:4317
            protocol: grpc
            tls:
              insecure: true
            metrics:
              enabled: false
            logs:
              enabled: false
            traces:
              enabled: true
        collectors:
          alloy-logs:
            presets: [small, daemonset, filesystem-log-reader]
            # Trivy KSV014/022/119 on alloy container: readOnlyRootFilesystem requires
            # /tmp emptyDir for storagePath (/tmp/alloy); drop NET_RAW from default caps
            # as a log tailer has no raw packet socket requirements.
            # UID=0 (root) kept intentionally (KSV012 ACCEPT): reading host container
            # logs from /var/log/pods requires root privileges.
            alloy:
              mounts:
                extra:
                  - name: tmp
                    mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - DAC_OVERRIDE
                    - FOWNER
                    - FSETID
                    - KILL
                    - SETGID
                    - SETUID
                    - SETPCAP
                    - NET_BIND_SERVICE
                    - SYS_CHROOT
                    - MKNOD
                    - AUDIT_WRITE
                    - SETFCAP
                seccompProfile:
                  type: RuntimeDefault
              # Keep nested configReloader for chart compatibility
              configReloader:
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65534
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
            controller:
              volumes:
                extra:
                  - name: tmp
                    emptyDir: {}
            # Trivy KSV001/003/011/012/014/018/030/104/106 on the config-reloader sidecar
            # Top-level configReloader maps to Alloy CR spec.configReloader (read by alloy-operator).
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
          destinations: []
        # D-TRACE-K8S-ATTR (#691): enable OTLP ingestion (4317 gRPC / 4318 HTTP) and
        # otelcol.processor.k8sattributes on the existing alloy-logs collector so traces
        # carry k8s.namespace.name (plus pod/deployment/statefulset/daemonset/job/node)
        # for portal tenant scoping (#687). Uses only pods/namespaces/replicasets RBAC
        # already created by alloy-operator's default Alloy ClusterRole (k8s.cronjob.name
        # omitted to avoid an ungranted batch/jobs watch). Escape hatch: set enabled: false.
        applicationObservability:
          enabled: true
          collector: alloy-logs
          destinations:
            - tempo
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
          metrics:
            enabled: false
          logs:
            enabled: false
          traces:
            enabled: true
          processors:
            k8sattributes:
              metadata:
                - k8s.namespace.name
                - k8s.pod.name
                - k8s.deployment.name
                - k8s.statefulset.name
                - k8s.daemonset.name
                - k8s.job.name
                - k8s.node.name
        # Trivy KSV011/015/016/018/030/104 on alloy-operator (verified container-level via helm
        # template). Direct podSecurityContext and securityContext (no intermediate .alloy wrapper).
        alloy-operator:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 4242
            runAsGroup: 4242
            fsGroup: 4242
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
