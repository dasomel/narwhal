{{- if ne .Values.provider "kakao" }}
{{- /*
MetalLB is L2/ARP-based, which Kakao Cloud's network does not carry — the worker
LB fronts APISIX via NodePort there instead (see apisix.yaml). Rendering nothing
is what keeps ArgoCD from re-creating the app that 08-1-networking.sh skips.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        frrk8s:
          enabled: false
        speaker:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
        controller:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          tolerations:
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
          # Trivy KSV030/104 (pod-level, verified via helm template; deep-merges with
          # chart default runAsNonRoot/runAsUser/fsGroup).
          # D-PSA-BATCH-A (KSV021): runAsGroup 65534 = the image's own nobody group (passwd nobody:65534:65534);
          # the chart already sets runAsUser/fsGroup 65534. Pinned by R405.
          securityContext:
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
