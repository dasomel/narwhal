apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        speaker:
          tolerations:
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
        controller:
          tolerations:
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"
          # Trivy KSV030/104 (pod-level, verified via helm template; deep-merges with
          # chart default runAsNonRoot/runAsUser/fsGroup). speaker/frr-k8s
          # intentionally left untouched (need NET_ADMIN/NET_RAW + hostNetwork).
          securityContext:
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
