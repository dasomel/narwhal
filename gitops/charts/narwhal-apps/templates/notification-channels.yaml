apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-channels
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "notification-channels.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # D610-4: see resources/notification-channels.yaml; never ignore other Secrets/configs.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: narwhal-notification-channels
      namespace: monitoring
      jsonPointers: [/data]
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
      name: narwhal-notification-channels
      namespace: monitoring
      jsonPointers: [/spec]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
