apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-backup
  namespace: devtools
  annotations:
    # Deploy after OpenBao itself so the openbao-tls CA secret exists (the Kubernetes
    # auth role is created by 13-2-narwhal-portal-bindings.sh, before GitOps bootstrap).
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "openbao-backup.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
