apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.3
    helm:
      valuesObject:
        # Cilium runs in kube-proxy-replacement mode → there is NO kube-proxy to scrape,
        # so the default KubeProxyDown alert was a permanent false positive. And the kubeadm
        # etcd metrics endpoint isn't exposed to Prometheus on this cluster, so the etcd scrape
        # fails and etcdInsufficientMembers fires even though the 3-member etcd is healthy
        # (apiserver/quorum fine). Disable both component monitors to clear the noise.
        # (Real etcd monitoring can be re-enabled later with etcd client-cert plumbing.)
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 7d
            # k6 load-test results are pushed via Prometheus remote write
            # (tests/k6/run-k6.sh, -o experimental-prometheus-rw).
            enableRemoteWriteReceiver: true
            # No limit made prometheus the node OOM killer's first victim under
            # memory pressure (observed: 96 OOMKills in 10h on worker-1 @ 86%
            # mem). Requests lower its oom_score; the limit caps TSDB growth.
            # Steady-state usage is ~1-1.5Gi at 7d retention on this cluster.
            # No cpu limit on purpose (throttling trips probe timeouts on VM
            # load — same rationale as headlamp).
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            # Discover all PrometheusRules regardless of release label
            ruleSelector: {}
            ruleNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 10Gi
        grafana:
          assertNoLeakedSecrets: false
          # Admin credentials loaded from existingSecret
          # Secret 'grafana-secrets' is created by scripts/cluster/08-platform-apps.sh
          # Required keys: admin-user, admin-password
          admin:
            existingSecret: grafana-secrets
            userKey: admin-user
            passwordKey: admin-password
          podLabels:
            istio.io/dataplane-mode: "none"
          persistence:
            enabled: true
            storageClassName: nfs-csi
            size: 5Gi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              enabled: true
          # OIDC client_secret loaded from Secret via $__file{} Grafana file provider
          # Secret 'grafana-oauth-secret' is created by scripts/cluster/11-keycloak.sh
          # Required key: client_secret
          extraSecretMounts:
            - name: grafana-oidc-secret-mount
              secretName: grafana-oidc-secret
              defaultMode: 0440
              mountPath: /etc/secrets/auth_generic_oauth
              readOnly: true
          grafana.ini:
            server:
              root_url: https://grafana.{{ .Values.baseDomain }}
            tracing.opentelemetry.otlp:
              address: tempo.monitoring.svc.cluster.local:4317
            auth:
              disable_login_form: true
            auth.generic_oauth:
              enabled: true
              auto_login: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
              scopes: openid email profile groups
              auth_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/auth
              token_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/token
              api_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/userinfo
              groups_attribute_path: groups
              # self-signed cert 환경 (narwhal-ca). 실제 CA cert ca_file로 교체 가능
              tls_skip_verify_insecure: true
              allow_assign_grafana_admin: true
              role_attribute_path: contains(groups[*], 'cluster-admin') && 'Admin' || contains(groups[*], 'developer') && 'Editor' || 'Viewer'
        # Trivy KSV001/003/030/104 on node-exporter (verified container-level via
        # helm template). Not forcing runAsNonRoot: already non-root by chart default
        # (uid 65534, live-verified), so KSV012 isn't flagged. grafana's only
        # remaining finding (KSV001 on the init-chown-data initContainer) has no
        # values path in the grafana chart -- left as-is.
        prometheus-node-exporter:
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
