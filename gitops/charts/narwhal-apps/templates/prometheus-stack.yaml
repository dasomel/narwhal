apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: kube-prometheus-stack
    targetRevision: 86.2.3
    helm:
      valuesObject:
        # Cilium runs in kube-proxy-replacement mode → there is NO kube-proxy to scrape,
        # so the default KubeProxyDown alert was a permanent false positive. And the kubeadm
        # etcd metrics endpoint isn't exposed to Prometheus on this cluster, so the etcd scrape
        # fails and etcdInsufficientMembers fires even though the 3-member etcd is healthy
        # (apiserver/quorum fine). Disable both component monitors to clear the noise.
        # (Real etcd monitoring can be re-enabled later with etcd client-cert plumbing.)
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        # D-COST-LABELS: kube-state-metrics ships metricLabelsAllowlist: [] so kube_pod_labels had
        # no label_* series. The portal Cost page attributes pods by instance -> name -> app ->
        # k8s-app before falling back to the owner workload; export only those four pod labels
        # (low cardinality, 4 label keys on pods). Escape hatch: removing this restores the empty
        # allowlist and the portal silently uses the owner-workload fallback.
        kube-state-metrics:
          metricLabelsAllowlist:
            - pods=[app.kubernetes.io/instance,app.kubernetes.io/name,app,k8s-app]
        prometheus:
          prometheusSpec:
            podMetadata:
              labels:
                istio.io/dataplane-mode: "none"
            retention: 7d
            # k6 load-test results are pushed via Prometheus remote write
            # (tests/k6/run-k6.sh, -o experimental-prometheus-rw).
            enableRemoteWriteReceiver: true
            # No limit made prometheus the node OOM killer's first victim under
            # memory pressure (observed: 96 OOMKills in 10h on worker-1 @ 86%
            # mem). Requests lower its oom_score; the limit caps TSDB growth.
            # Steady-state usage is ~1-1.5Gi at 7d retention on this cluster.
            # No cpu limit on purpose (throttling trips probe timeouts on VM
            # load — same rationale as headlamp).
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            # D-MON-SPREAD: prometheus, loki and tempo each carry the same preferred (never required)
            # pod anti-affinity against the other two (one term each: name=prometheus,
            # name=loki + component=single-binary, name=tempo; the loki-canary DaemonSet also carries
            # name=loki, so a bare name=loki term would repel every node), topologyKey
            # kubernetes.io/hostname, so the scheduler prefers three different workers. 2026-11-06 all
            # three landed on worker-3 (~5.3GiB allocatable) and the kernel OOM killer took prometheus-0 16
            # times in ~3h. Preferred, not required: with fewer fit nodes they still schedule. Cost: none
            # at steady state. It only applies when a pod is (re)scheduled, so a running pod stays until
            # it is deleted. Escape hatch: delete this block.
            # The chart's own `podAntiAffinity: soft` only matches prometheus replicas, and it
            # renders a second podAntiAffinity key next to `affinity`, so it is disabled and the
            # whole rule lives under `affinity`.
            podAntiAffinity: ""
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchExpressions:
                          - key: app.kubernetes.io/name
                            operator: In
                            values: [prometheus]
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchExpressions:
                          - key: app.kubernetes.io/name
                            operator: In
                            values: [loki]
                          - key: app.kubernetes.io/component
                            operator: In
                            values: [single-binary]
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchExpressions:
                          - key: app.kubernetes.io/name
                            operator: In
                            values: [tempo]
            # Discover all PrometheusRules regardless of release label
            ruleSelector: {}
            ruleNamespaceSelector: {}
            # D-CNPG-MON (#600): Discover PodMonitors across all namespaces (e.g. CNPG in database)
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 10Gi
        grafana:
          assertNoLeakedSecrets: false
          # The NFS server's per-PV mode timer grants UID 472 write access; root_squash
          # rejects the chart's root init container chown, which is unnecessary here.
          initChownData:
            enabled: false
          # Admin credentials loaded from existingSecret
          # Secret 'grafana-secrets' is created by scripts/cluster/08-platform-apps.sh
          # Required keys: admin-user, admin-password
          admin:
            existingSecret: grafana-secrets
            userKey: admin-user
            passwordKey: admin-password
          podLabels:
            istio.io/dataplane-mode: "none"
          persistence:
            enabled: true
            storageClassName: nfs-csi
            size: 5Gi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              enabled: true
          # OIDC client_secret loaded from Secret via $__file{} Grafana file provider
          # Secret 'grafana-oauth-secret' is created by scripts/cluster/11-keycloak.sh
          # Required key: client_secret
          extraSecretMounts:
            - name: grafana-oidc-secret-mount
              secretName: grafana-oidc-secret
              defaultMode: 0440
              mountPath: /etc/secrets/auth_generic_oauth
              readOnly: true
          grafana.ini:
            server:
              root_url: https://grafana.{{ .Values.baseDomain }}
            tracing.opentelemetry.otlp:
              address: tempo.monitoring.svc.cluster.local:4317
            auth:
              disable_login_form: true
            auth.generic_oauth:
              enabled: true
              auto_login: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
              scopes: openid email profile groups
              auth_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/auth
              token_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/token
              api_url: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/userinfo
              groups_attribute_path: groups
              # self-signed cert 환경 (narwhal-ca). 실제 CA cert ca_file로 교체 가능
              tls_skip_verify_insecure: true
              allow_assign_grafana_admin: true
              # D-ADMIN-FULL: cluster-admin is a Grafana server admin (allow_assign_grafana_admin above), not just org Admin.
              role_attribute_path: contains(groups[*], 'cluster-admin') && 'GrafanaAdmin' || contains(groups[*], 'developer') && 'Editor' || 'Viewer'
        # Trivy KSV001/003/030/104 on node-exporter (verified container-level via
        # helm template). Not forcing runAsNonRoot: already non-root by chart default
        # (uid 65534, live-verified), so KSV012 isn't flagged.
        prometheus-node-exporter:
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  resources:
                    requests:
                      storage: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
