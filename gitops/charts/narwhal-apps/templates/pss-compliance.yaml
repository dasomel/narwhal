apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pss-compliance
  namespace: devtools
  annotations:
    # Wave 5: after trivy-operator (wave 4) installs the ClusterComplianceReport CRD
    # and prunes the chart-bundled lowercase PSS specs (D-PSS-SPEC-CASE).
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "pss-compliance.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
