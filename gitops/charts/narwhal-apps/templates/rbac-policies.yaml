apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac-policies
  namespace: devtools
  annotations:
    # RBAC must exist early so that subsequent deployments can bind to roles safely.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "rbac-policies.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
