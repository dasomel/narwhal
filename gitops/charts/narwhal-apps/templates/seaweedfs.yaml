apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: seaweedfs
    targetRevision: 4.34.0
    helm:
      valuesObject:
        global:
          storageClass: nfs-csi
        # Trivy KSV001/003/030/104 on all 4 components (verified container-level via
        # helm template; requires `enabled: true` INSIDE containerSecurityContext
        # itself — the chart gates the whole block on that flag, "enabled" is omitted
        # from final render). Not forcing runAsNonRoot (KSV012): all 4 containers
        # verified running as root (uid=0) live — SeaweedFS needs it, forcing non-root
        # would break the pods.
        master:
          enabled: true
          replicas: 1
          storage: 1Gi
          data:
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        volume:
          enabled: true
          replicas: 1
          # D-sw-pin: the volume server keeps its data on node-local hostPath
          # /ssd/object_store (the `data:` PVC keys below are ignored by chart 4.34.0), so a
          # reschedule to another worker starts with an empty store and breaks every S3 user
          # (Loki CrashLoop, 2026-10-16). Pin it to the node labelled
          # narwhal.io/seaweedfs-volume=true (set once by 08-4-storage.sh, never moved).
          # Live Kakao: the label belongs on host-172-17-0-22, where the 23G of data is.
          nodeSelector: |
            narwhal.io/seaweedfs-volume: "true"
          storage: 50Gi
          data:
            type: persistentVolumeClaim
            size: 50Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        filer:
          enabled: true
          replicas: 1
          storage: 5Gi
          data:
            type: persistentVolumeClaim
            size: 5Gi
            storageClass: nfs-csi
          s3:
            enabled: true
            port: 8333
            allowEmptyFolder: true
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        s3:
          enabled: true
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
