apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.34.0
    helm:
      valuesObject:
        global:
          storageClass: nfs-csi
        # Trivy KSV001/003/030/104 on all 4 components (verified container-level via
        # helm template; requires `enabled: true` INSIDE containerSecurityContext
        # itself — the chart gates the whole block on that flag, "enabled" is omitted
        # from final render). Not forcing runAsNonRoot (KSV012): all 4 containers
        # verified running as root (uid=0) live — SeaweedFS needs it, forcing non-root
        # would break the pods.
        master:
          enabled: true
          replicas: 1
          storage: 1Gi
          data:
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        volume:
          enabled: true
          replicas: 1
          storage: 50Gi
          data:
            type: persistentVolumeClaim
            size: 50Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        filer:
          enabled: true
          replicas: 1
          storage: 5Gi
          data:
            type: persistentVolumeClaim
            size: 5Gi
            storageClass: nfs-csi
          s3:
            enabled: true
            port: 8333
            allowEmptyFolder: true
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        s3:
          enabled: true
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
