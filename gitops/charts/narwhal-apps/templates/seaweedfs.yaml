apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: seaweedfs
    targetRevision: 4.34.0
    helm:
      valuesObject:
        global:
          storageClass: nfs-csi
        # Trivy KSV001/003/030/104 on all 4 components (verified container-level via
        # helm template; requires `enabled: true` INSIDE containerSecurityContext
        # itself — the chart gates the whole block on that flag, "enabled" is omitted
        # from final render). runAsNonRoot (KSV012) is not forced chart-wide: volume and
        # s3 keep the image default root (hostPath data, no NFS).
        #
        # D-sw-nonroot: master and filer keep state on nfs-csi PVCs, so they must survive a
        # root_squash export (uid 0 -> nobody; narwhal#224). The chart overrides the image
        # entrypoint, so they ran as root (the image USER) and left uid-0 files. They now
        # run as the image's `seaweed` user (uid/gid 1000, verified in chrislusf/seaweedfs:4.34
        # /etc/passwd). fsGroup is inert on NFS (nfs.csi.k8s.io sets no fsGroupPolicy), so
        # existing data must be chowned first: scripts/cluster/nfs-root-squash-align.sh.
        # Logs move from root-owned hostPath to emptyDir (fsGroup applies there; hostPath is
        # root:root 0755 and unwritable by uid 1000). Escape hatch: revert this block.
        master:
          enabled: true
          replicas: 1
          podSecurityContext:
            enabled: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          logs:
            type: emptyDir
          storage: 1Gi
          data:
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        volume:
          enabled: true
          replicas: 1
          # D-sw-pin: the volume server keeps its data on node-local hostPath
          # /ssd/object_store (the `data:` PVC keys below are ignored by chart 4.34.0), so a
          # reschedule to another worker starts with an empty store and breaks every S3 user
          # (Loki CrashLoop, 2026-10-16). Pin it to the node labelled
          # narwhal.io/seaweedfs-volume=true (set once by 08-4-storage.sh, never moved).
          # Live Kakao: the label belongs on host-172-17-0-22, where the 23G of data is.
          nodeSelector: |
            narwhal.io/seaweedfs-volume: "true"
          storage: 50Gi
          data:
            type: persistentVolumeClaim
            size: 50Gi
            storageClass: nfs-csi
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        filer:
          enabled: true
          replicas: 1
          podSecurityContext:
            enabled: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          logs:
            type: emptyDir
          storage: 5Gi
          data:
            type: persistentVolumeClaim
            size: 5Gi
            storageClass: nfs-csi
          # D-s3auth: the embedded filer S3 is off. Its port is published by the seaweedfs-filer
          # Service, so leaving it on would be a second :8333 endpoint outside the identities
          # file below. Nothing uses it (every client targets seaweedfs-s3:8333 = the s3 Deployment).
          s3:
            enabled: false
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        # D-s3auth: S3 authentication with per-client random identities (loki, tempo, velero,
        # cnpg), each limited to its own bucket. The Secret is created by
        # scripts/common/lib.sh ensure_s3_identities (07/08-4), never by Git. The server reads
        # the file once at start: a changed Secret needs `rollout restart deploy/seaweedfs-s3`
        # (docs/runbooks/seaweedfs-s3-auth.md). Rollback = enableAuth: false (anonymous again).
        s3:
          enabled: true
          enableAuth: true
          existingConfigSecret: seaweedfs-s3-config
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # D-s3ops-1: makes the ignoreDifferences entry below hold during sync too.
      - RespectIgnoreDifferences=true
  # D-s3ops-1 (#419): s3_sync_server_config (lib.sh) rolls seaweedfs-s3 by patching the pod
  # template annotation narwhal.io/s3-config-sha256; selfHeal reverted it within seconds (old
  # ReplicaSet came back). Why: the roll marker must survive self-heal. Cost: drift of exactly
  # this one field is not repaired. Escape hatch: remove this list and RespectIgnoreDifferences.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      namespace: storage
      name: seaweedfs-s3
      jsonPointers:
        - /spec/template/metadata/annotations/narwhal.io~1s3-config-sha256
