apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: tempo
    targetRevision: 2.2.3
    helm:
      valuesObject:
        tempo:
          # D-vparquet2: chart 2.2.3's default appVersion (2.10.7) removes
          # vParquet2 block-encoding support entirely. Pinned until a live
          # audit of the SeaweedFS `tempo` bucket confirms no vParquet2-
          # encoded blocks exist (see VERSIONS.md). Lift once confirmed safe.
          # NOTE: this chart nests the image tag under `tempo.tag`, NOT a
          # top-level `image.tag` (verified via `helm show values` — a
          # top-level override is silently accepted but never wired to the
          # StatefulSet's container image).
          tag: 2.9.0
          extraArgs:
            config.expand-env: "true"
          extraEnvFrom:
            - secretRef:
                name: tempo-s3-credentials
          # D-ballast (#420, HYPOTHESIS, not a confirmed root cause): the chart default
          # `-mem-ballast-size-mbs=1024` keeps a 1GiB Go ballast that raises the GC heap
          # target (GOGC=100 => ~2x(ballast+live)), possibly above the 1536Mi limit, so
          # compactor merges may be OOMKilled before GC runs. Ballast 0 + GOMEMLIMIT make GC
          # track the container limit. GOMEMLIMIT is a soft limit (GC CPU capped ~50%, heap
          # may still exceed it); 256Mi headroom is a starting value. Cost: extra GC CPU.
          # Verify: watch tempo-0 restartCount / last terminated reason for a few days; if
          # OOM persists collect compaction heap-live/goal, GC count/CPU, RSS, cgroup
          # memory.events/memory.stat, then revisit limit / compactor concurrency /
          # persistence. Revert: remove both keys.
          # Rollout: persistence=false, so /var/tempo is the writable layer and the restart
          # loses un-flushed WAL/local blocks (same loss as an OOM). selfHeal reverts manual
          # edits, so change this only through GitOps.
          memBallastSizeMbs: 0
          extraEnv:
            - name: GOMEMLIMIT
              value: 1280MiB
          # The chart ships `tempo.resources: {}`, which leaves the pod BestEffort — the
          # highest oom_score_adj on the node, so the kernel kills it first. tempo was the
          # last workload still OOM-looping (94 restarts) once the apiserver heap bound
          # relieved node-wide pressure and every other crashloop froze. Measured steady
          # state is ~827Mi, so the request covers the floor and the limit leaves room for
          # compaction spikes without letting it crowd out the node again.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          storage:
            trace:
              backend: s3
              s3:
                endpoint: seaweedfs-s3.storage.svc.cluster.local:8333
                bucket: tempo
                # D-s3auth: from Secret monitoring/tempo-s3-credentials (envFrom +
                # -config.expand-env below); nothing is inline. Env changes need a pod restart.
                access_key: ${S3_ACCESS_KEY_ID}
                secret_key: ${S3_SECRET_ACCESS_KEY}
                insecure: true
        persistence:
          enabled: false
        # Trivy KSV030/104 only. NOTE: despite the chart's values.yaml comment
        # ("securityContext for container"), this key actually renders at POD level
        # (verified via `helm template` + live StatefulSet diff) — PodSecurityContext
        # has no allowPrivilegeEscalation/capabilities fields, so those get silently
        # pruned by the API server on every apply, leaving ArgoCD permanently
        # OutOfSync. Only seccompProfile (valid at pod level) is set here; KSV001/003
        # have no working values path in this chart version and are left unfixed.
        securityContext:
          seccompProfile:
            type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
