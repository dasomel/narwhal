apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 2.2.3
    helm:
      valuesObject:
        tempo:
          # D-vparquet2: chart 2.2.3's default appVersion (2.10.7) removes
          # vParquet2 block-encoding support entirely. Pinned until a live
          # audit of the SeaweedFS `tempo` bucket confirms no vParquet2-
          # encoded blocks exist (see VERSIONS.md). Lift once confirmed safe.
          # NOTE: this chart nests the image tag under `tempo.tag`, NOT a
          # top-level `image.tag` (verified via `helm show values` — a
          # top-level override is silently accepted but never wired to the
          # StatefulSet's container image).
          tag: 2.9.0
          storage:
            trace:
              backend: s3
              s3:
                endpoint: seaweedfs-s3.storage.svc.cluster.local:8333
                bucket: tempo
                access_key: admin
                secret_key: admin
                insecure: true
        persistence:
          enabled: false
        # Trivy KSV001/003/030/104 (top-level key, sibling of `tempo:` — verified via
        # `helm show values`). Deep-merges with chart default container securityContext
        # (runAsUser/runAsGroup/fsGroup 10001, runAsNonRoot: true).
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
