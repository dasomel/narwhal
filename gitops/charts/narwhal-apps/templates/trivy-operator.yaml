apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.27.0
    helm:
      valuesObject:
        # Standalone mode — Trivy CLI runs inside scan Job pods, no shared server.
        # 자원 제약 환경(Worker 6GB)에서 Server 모드보다 가볍고 격리도 높음.
        trivy:
          mode: Standalone
          ignoreUnfixed: false
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          timeout: "10m0s"
          # Trivy DB는 ghcr.io/aquasecurity/trivy-db 에서 pull (레이트 리밋 영향 적음)
          dbRegistry: ghcr.io
          dbRepository: aquasecurity/trivy-db
          javaDbRegistry: ghcr.io
          javaDbRepository: aquasecurity/trivy-java-db
          resources:
            requests:
              cpu: 50m   # was 100m: a scan Job has 1 container per image in the target
                         # workload, so a multi-image workload (e.g. 9 × 100m = 900m) could
                         # not fit the CPU-committed 2-core workers (~600m free) → perpetual
                         # Pending/timeout churn. Scans still burst to the 300m limit.
              memory: 128Mi
            limits:
              cpu: 300m   # was 500m: cap per-scan CPU so scan Jobs don't starve co-located
              memory: 1Gi   # was 512Mi: large images (harbor/keycloak) OOMKilled the scan Job,
                            # leaving its VulnerabilityReport missing + ~15min retry churn.
                            # concurrentLimit=2 → 2Gi peak, fits worker 6GB headroom.

        # Compliance report generation (사용자 결정 2026-07-08).
        # reportType MUST be "all" (not the chart default "summary"): summary only fills
        # status.summary.passCount, leaving status.detailReport empty — the portal then
        # shows every control as "✓0 ✗0" (definitions only, per src/lib/compliance.ts).
        # "all" populates detailReport.controls so per-control pass/fail renders.
        compliance:
          reportType: all
          failEntriesLimit: 10
          cron: "0 */6 * * *"

        operator:
          # 모든 네임스페이스 스캔 (빈 문자열 = all)
          targetNamespaces: ""
          excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system"
          scanJobsConcurrentLimit: 2   # was 3: fewer concurrent scan Jobs => lower peak
                                       # node CPU (combined with 300m scan cap = ~600m peak
                                       # vs 1500m before) to protect co-located workloads
          scanJobTimeout: 10m
          # 빌트인 Trivy 서버 비활성 (Standalone 모드)
          builtInTrivyServer: false
          # 자동 스캔 활성
          vulnerabilityScannerEnabled: true
          # Compliance scanners ENABLED (사용자 결정 2026-07-08): feed the portal
          # /governance compliance page (CIS 1.23 / NSA 1.0 / PSS baseline+restricted).
          # config-audit + rbac run in-operator (no per-workload Job); infra spawns a
          # short node-collector Job per node (6h cron); compliance aggregates all three.
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          infraAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          clusterComplianceEnabled: true
          metricsVulnIdEnabled: true
          metricsExposedSecretInfo: true
          # 12시간 주기 재스캔 (Vagrant 환경 부하 고려)
          scanJobTTL: 12h
          # NOTE: chart 0.27.0 does NOT honor `operator.resources` (the operator container
          # runs with no resource limits — verified live), so this block is inert. Left as
          # documentation of intent; the operator is lightweight even with all scanners on.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # Prometheus 자동 수집 (prometheus-stack 의 ServiceMonitor selector 매칭됨)
        serviceMonitor:
          enabled: true
          namespace: security-system
          interval: 1m

        # Istio ambient mesh 제외 — Trivy operator는 K8s API + scan Job만 사용
        podLabels:
          istio.io/dataplane-mode: "none"

        nodeSelector: {}
        tolerations:
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule

        # node-collector: 노드 OS/패키지 인벤토리 수집 (CNI/kernel 정보)
        nodeCollector:
          # 비용/소음 줄이려면 비활성. 일단 활성 — Phase 2에서 노드 OS CVE에도 활용.
          enabled: true
          tolerations:
            - operator: Exists
              effect: NoSchedule

  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
