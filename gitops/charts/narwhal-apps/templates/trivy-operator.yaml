apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: trivy-operator
    targetRevision: 0.38.1
    helm:
      valuesObject:
        # D-SCAN-CONTROL-PLANE (2026-11-22): include kube-system and istio-system so Trivy's
        # in-operator ConfigAudit + InfraAssessment + RBAC scanners evaluate the control-plane
        # static pods (CIS 1.2.x/1.3.x/1.4.x/2.x, KISA-CP-01/ETCD-01) and ambient mesh workloads
        # instead of leaving those controls as empty-placeholder PASS. Keep zero-value namespaces
        # excluded (kube-public, kube-node-lease, unused trivy-system).
        # Live trial measured (orchestrator, single-node cluster): ConfigAuditReports rose 188->281,
        # VulnerabilityReports rose 108->110 (only kube-vip and istio-cni-node appeared, as unlisted
        # images), and node_load1 stayed within 0.56-1.66 (baseline ~0.5-0.9). In this ClientServer
        # deployment excludeImages suppressed listed images at runtime, while reviewer reading of
        # v0.25.0 source indicated Standalone-only (re-measure behavior on operator upgrade).
        # Cost: higher raw ConfigAudit/Infra/CIS/KISA failure counts (truthful findings; kube-system
        # High 54/Med 102/Low 142, istio-system High 6/Med 11/Low 18, Critical 0 in both).
        # Escape hatch: add kube-system,istio-system back to excludeNamespaces.
        targetNamespaces: ""
        excludeNamespaces: "kube-public,kube-node-lease,trivy-system"
        trivyOperator:
          # D-SCAN-SKIP-VELERO-EPHEMERAL (2026-11-06) + ghost-pod-reaper child Jobs (2026-11-22):
          # Velero and kube-system/ghost-pod-reaper (*/15 * * * *) create short-lived workloads
          # with unique names; the operator treats each one as a new workload and re-scans it.
          # Only child Jobs carrying narwhal.dasomel.io/skip-ephemeral-job-scan (or Velero keys)
          # are skipped; CronJob/ghost-pod-reaper, Deploy/velero, and DS/node-agent stay scanned.
          # Escape hatch: remove keys from skipResourceByLabels.
          skipResourceByLabels: velero.io/repo-name,velero.io/pod-volume-backup,velero.io/pod-volume-restore,narwhal.dasomel.io/skip-ephemeral-job-scan
          # D-SCAN-SYSTEM-EXCLUDE-IMAGES (2026-11-22): excludeImages (scanJob.excludeImages)
          # filters containers only out of vulnerability/exposed-secret scan Jobs (trivy-operator
          # v0.25.0 pkg/plugins/trivy/image.go:187, workload.go:355 skips 0-container Jobs) while
          # leaving in-operator ConfigAudit/InfraAssessment untouched. Patterns use Go
          # filepath.Match (* does not cross /) and are global across namespaces, so every entry
          # pins an exact repository running in kube-system or istio-system (no org/* wildcards
          # such as quay.io/cilium/* or sig-storage/*). Only the tag suffix (`:*`) remains
          # pattern-based so patch/minor upgrades in VERSIONS.md do not break exclusions.
          # Runtime trial confirmed listed images were suppressed in ClientServer mode, though v0.25.0
          # source inspection suggested Standalone-only (must re-measure on upgrade). The trial
          # observed two residual scans (pod-kube-vip and daemonset-istio-cni-node) because those
          # images were not in the list; decision: add exact repo entries for kube-vip and istio
          # install-cni (same control-plane/mesh class as listed ones; does not change hashed mounts).
          # Intentionally NOT excluded: registry.k8s.io/etcd (shared with platform-system/apisix-etcd
          # 3.5.31-0), docker.io/alpine/k8s (ghost-pod-reaper CronJob stays scanned; child Jobs
          # skipped by label), and registry.istio.io/release/proxyv2 (app waypoints stay scanned).
          # Cost: no Trivy CVE scan Jobs for these exact system image repos (if a tenant ever
          # deploys one of these exact repos it would also skip CVE scanning).
          # Escape hatch: set excludeImages: "" to scan all system images on the 168h TTL.
          excludeImages: "registry.k8s.io/kube-apiserver:*,registry.k8s.io/kube-controller-manager:*,registry.k8s.io/kube-scheduler:*,registry.k8s.io/coredns/coredns:*,registry.k8s.io/metrics-server/metrics-server:*,registry.k8s.io/sig-storage/csi-node-driver-registrar:*,registry.k8s.io/sig-storage/csi-provisioner:*,registry.k8s.io/sig-storage/csi-resizer:*,registry.k8s.io/sig-storage/csi-snapshotter:*,registry.k8s.io/sig-storage/livenessprobe:*,registry.k8s.io/sig-storage/nfsplugin:*,ghcr.io/kube-vip/kube-vip:*,docker.io/kube-vip/kube-vip:*,kube-vip/kube-vip:*,quay.io/cilium/cilium:*,quay.io/cilium/cilium-envoy:*,quay.io/cilium/hubble-relay:*,quay.io/cilium/hubble-ui:*,quay.io/cilium/hubble-ui-backend:*,quay.io/cilium/operator-generic:*,docker.io/istio/install-cni:*,istio/install-cni:*,registry.istio.io/release/install-cni:*,registry.istio.io/release/pilot:*,registry.istio.io/release/ztunnel:*"
          # D-TRIVY-PASS-RECORDS (2026-11-25): record passing checks (success: true) in per-resource
          # ConfigAudit/RbacAssessment/InfraAssessment reports so the portal (1.1.28+) shows real
          # tested-pass verdicts instead of failure-only inference. MUST be the YAML string "false"
          # (not boolean false): chart 0.38.1 templates/configmaps/operator.yaml guards this key with
          # a Helm `with` block on .Values.trivyOperator.reportRecordFailedChecksOnly, where boolean
          # false is falsy and silently omitted (falling back to Go default "true").
          reportRecordFailedChecksOnly: "false"
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
        # D-TRIVY-SERVER: ClientServer via the chart's built-in server. Standalone made
        # every scan Job download the ~1GB trivy-db into its own emptyDir (500+ GiB of
        # writes on one worker in a day, plus harbor pull bursts); the single trivy-server
        # pod now holds the DB once and scan Jobs only upload layer metadata to it.
        # builtInTrivyServer forces mode=ClientServer + serverURL (see operator: below).
        # Escape hatch: builtInTrivyServer=false, mode=Standalone.
        trivy:
          mode: ClientServer
          # D-TRIVY-SERVER-CACHE-PVC (2026-11-06): the emptyDir of D-TRIVY-SERVER made every
          # trivy-server restart re-download the DB (two restarts in ~1h while Harbor was still
          # starting = ~7 GiB of container writes in 3h). A nfs-csi PVC keeps the DB across
          # restarts. It stays a cache, so Velero must not back it up (the pod annotation under
          # operator.serverAdditionalAnnotations; the schedules use defaultVolumesToFsBackup).
          # Escape hatch: storageClassEnabled=false. The StatefulSet volumeClaimTemplates field
          # is immutable, so flipping this needs `kubectl delete sts trivy-server` (cache only).
          storageClassEnabled: true
          storageClassName: nfs-csi
          storageSize: 5Gi
          server:
            # D-PSA-BATCH-A (KSV021): runAsGroup 65534 = nobody's group in the trivy image (passwd nobody:65534:65534);
            # chart default runAsUser/fsGroup 65534 deep-merge in. Pinned by R405.
            podSecurityContext:
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1536Mi
          ignoreUnfixed: false
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          timeout: "10m0s"
          # Trivy DB는 ghcr.io/aquasecurity/trivy-db 에서 pull (레이트 리밋 영향 적음)
          dbRegistry: harbor.devtools.svc.cluster.local
          dbRepository: trivy-db/aquasecurity/trivy-db
          javaDbRegistry: harbor.devtools.svc.cluster.local
          javaDbRepository: trivy-db/aquasecurity/trivy-java-db
          resources:
            requests:
              cpu: 50m # was 100m: a scan Job has 1 container per image in the target
              # workload, so a multi-image workload (e.g. 9 × 100m = 900m) could
              # not fit the CPU-committed 2-core workers (~600m free) → perpetual
              # Pending/timeout churn. Scans still burst to the 300m limit.
              memory: 128Mi
            limits:
              cpu: 300m # was 500m: cap per-scan CPU so scan Jobs don't starve co-located
              memory: 1Gi # was 512Mi: large images (harbor/keycloak) OOMKilled the scan Job,
              # leaving its VulnerabilityReport missing + ~15min retry churn.
              # concurrentLimit=2 → 2Gi peak, fits worker 8GB headroom.
          dbRepositoryInsecure: "true"
          # D-SCAN-BINDINGS (2026-11-22): add RoleBinding and ClusterRoleBinding so KSV111
          # (CIS 5.1.1, cluster-admin/admin/edit bindings) is actually evaluated. Verified in
          # trivy-operator v0.25.0 (pkg/configauditreport/controller/resource.go:108,123): both
          # controllers are wired and ClusterRole/trivy-operator already grants get/list/watch.
          # Note: v0.25.0 writes RoleBinding -> ConfigAuditReport (included in CIS 5.1.1 / KISA)
          # and ClusterRoleBinding -> ClusterConfigAuditReport (visible via kubectl; not yet
          # aggregated by v0.25.0 pkg/compliance/io.go).
          # Cost: ~64 RoleBinding ConfigAuditReports + ~121 ClusterRoleBinding
          # ClusterConfigAuditReports computed in-operator (no scan Jobs).
          # Escape hatch: remove RoleBinding,ClusterRoleBinding to restore chart default.
          supportedConfigAuditKinds: "Workload,Service,Role,ClusterRole,RoleBinding,ClusterRoleBinding,NetworkPolicy,Ingress,LimitRange,ResourceQuota"
        # D-CCR-SUMMARY (2026-11-25): switch ClusterComplianceReport reportType to "summary" while
        # keeping CCRs deployed so portal 1.1.28+ still reads spec.compliance.controls for control->check
        # mapping. Reason: trivy-operator v0.36.1 FromDetailReport hardcodes Success: false on every
        # check and TotalsCheckCount counts passes as failures, and with reportRecordFailedChecksOnly:
        # "false" a detail CCR (especially k8s-cis-1.23) can exceed the 1.5 MiB etcd object size limit.
        # Cost: status.detailReport is omitted from CCRs (portal 1.1.28+ ignores status.detailReport
        # and status.summary counts and evaluates per-resource report.checks[].success instead).
        # Escape hatch: set reportType: all with reportRecordFailedChecksOnly: "true".
        # D-PSS-SPEC-CASE (2026-11-22): chart 0.27.0/0.38.1's bundled k8s-pss-baseline-0.1 (controls
        # 6-11) and k8s-pss-restricted-0.1 (controls 6-17) templates still hardcode lowercase
        # `avd-ksv-*` check IDs while trivy-operator emits uppercase `AVD-KSV-*`, so failing
        # checks never link. Restrict chart-rendered specs to CIS+NSA and
        # own the uppercase PSS ClusterComplianceReports in gitops/resources/pss-compliance.yaml
        # (Application/pss-compliance). Escape hatch: re-add both names here and remove that App.
        compliance:
          reportType: summary
          failEntriesLimit: 10
          cron: "0 */6 * * *"
          specs:
            - k8s-cis-1.23
            - k8s-nsa-1.0
        operator:
          builtInTrivyServer: true
          # D-TRIVY-SERVER-INSECURE (2026-11-26): chart 0.38.1 renders the built-in server's TRIVY_INSECURE
          # from this key (default false), while in-cluster Harbor (harbor.devtools.svc) serves plain
          # HTTP on :80 only. Without it the server retried https://harbor...:443 and crash-looped once
          # its PVC DB copy was due for an update (measured 2026-11-26). Same trust boundary as
          # trivy.dbRepositoryInsecure above. Escape hatch: serve Harbor over TLS and drop this key.
          builtInServerRegistryInsecure: true
          scanJobsConcurrentLimit: 2 # was 3: fewer concurrent scan Jobs => lower peak
          # node CPU (combined with 300m scan cap = ~600m peak
          # vs 1500m before) to protect co-located workloads
          scanJobTimeout: 10m
          # D-SCAN-RETRY (2026-11-06): chart default scanJobsRetryDelay=30s retries a failed scan
          # Job every 30s. Failures here are not transient on that scale: docker.io images hit the
          # anonymous Hub rate limit (TOOMANYREQUESTS/UNAUTHORIZED, per-IP 6h window) and Harbor
          # 502s at startup. A scan Job has one container per workload image, so every retry also
          # re-pulls and re-writes the layers of the siblings that succeeded (loki + loki-sc-rules,
          # grafana + 2 sidecars) and burns more of the Hub quota. 6h matches the Hub window; a
          # missing report is delayed at most 6h, well inside scannerReportTTL (168h).
          # Escape hatch: delete the line (30s default).
          scanJobsRetryDelay: 6h
          # 자동 스캔 활성
          vulnerabilityScannerEnabled: true
          # Compliance scanners ENABLED (사용자 결정 2026-07-08): feed the portal
          # /governance compliance page (CIS 1.23 / NSA 1.0 / PSS baseline+restricted).
          # config-audit + rbac run in-operator (no per-workload Job); infra spawns a
          # short node-collector Job per node (6h cron); compliance aggregates all three.
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          infraAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          clusterComplianceEnabled: true
          metricsVulnIdEnabled: true
          metricsExposedSecretInfo: true
          # 12시간 주기 재스캔 (Vagrant 환경 부하 고려)
          scanJobTTL: 12h
          # D-SCAN-REPORT-TTL (2026-11-05): chart default scannerReportTTL=24h expires every
          # VulnerabilityReport daily, so ~114 reports were rescanned ~3x in 3 days and each Standalone
          # scan Job re-downloads the ~1GB Trivy DB onto node disk (worker-3: ~300 scan pods, ~517GiB
          # written in 3d while guest usage never exceeded ~47GiB; the sparse vmdk grew to 292G and
          # never shrinks). 168h cuts that rewrite ~7x. Cost: a report can be up to 7d stale; the DB
          # is mirrored via Harbor (airgap) so it rarely changes faster than that. Escape hatch: set
          # back to 24h. Reports are still regenerated on any workload revision change.
          scannerReportTTL: 168h
          # The trivy-server pod is a cache: keep Velero fs-backup off its PVC (see trivy.storageClassEnabled).
          serverAdditionalAnnotations:
            backup.velero.io/backup-volumes-excludes: data
            # D-TRIVY-SERVER-ROLL: the chart pins checksum/config on the server pod template to a fixed
            # hash, so TRIVY_* ConfigMap changes never restart the server (review MAJOR, 2026-11-26).
            # Bump this value whenever a server-affecting trivy/operator value changes.
            narwhal.io/trivy-server-config-rev: "2026-11-26-registry-insecure"
        # D-TRIVY-OPERATOR-MEM: the operator ran BestEffort (no requests/limits) and was
        # OOMKilled 33x/22h under node memory pressure (workers 5.4GB, 53-71% used). The
        # chart reads the TOP-LEVEL `resources` (templates/deployment.yaml); the old
        # `operator.resources` block was inert. Steady state is ~330Mi, so a 384Mi
        # request makes it Burstable and the 1Gi limit contains it.
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 1Gi
        # Prometheus 자동 수집 (prometheus-stack 의 ServiceMonitor selector 매칭됨)
        serviceMonitor:
          enabled: true
          namespace: security-system
          interval: 1m
        # Istio ambient mesh 제외 — Trivy operator는 K8s API + scan Job만 사용
        podLabels:
          istio.io/dataplane-mode: "none"
        # D-NODE-COLLECTOR-PASSWD-ROLLOUT: trivy-operator v0.25.0 (chart 0.27.0) reads
        # nodeCollector.volumes/volumeMounts from its ConfigMap only at startup and omits a
        # ConfigMap checksum on the Deployment, so ArgoCD sync alone leaves old mounts active.
        # Chart 0.27.0 renders top-level podAnnotations on deploy/trivy-operator; pinning the
        # sha256 of nodeCollector.volumes+volumeMounts here forces a rollout on mount changes
        # (verified by R385). Cost: one operator pod recreate when nodeCollector mounts change.
        # Escape hatch: remove podAnnotations and run `kubectl -n security-system rollout restart deploy/trivy-operator`.
        podAnnotations:
          checksum/node-collector-mounts: "eca6d129ecc1594eb2d9bcc63e2d5b2ea63cc89909a235fa591134bc555d4a70"
        nodeSelector: {}
        tolerations:
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule
        # node-collector: 노드 OS/패키지 인벤토리 수집 (CNI/kernel 정보)
        nodeCollector:
          # 비용/소음 줄이려면 비활성. 일단 활성 — Phase 2에서 노드 OS CVE에도 활용.
          enabled: true
          tolerations:
            - operator: Exists
              effect: NoSchedule
          # D-NODE-COLLECTOR-PASSWD: node-collector:0.3.1 runs `stat -c %U:%G /var/lib/etcd`
          # inside its own container rootfs, which lacks the host `etcd` user/group (uid 995/
          # gid 984) and reports `UNKNOWN:UNKNOWN` (false KCV0059 fail). Setting Helm list keys
          # replaces the chart defaults, so all 8 chart 0.27.0 hostPath mounts stay intact
          # alongside read-only host /etc/passwd and /etc/group (no /etc/shadow). Cost: mounts
          # host account names (world-readable 0644) into the short-lived node-collector Job.
          # Escape hatch: remove volumeMounts/volumes to revert to chart defaults.
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: var-lib-kube-scheduler
              mountPath: /var/lib/kube-scheduler
              readOnly: true
            - name: var-lib-kube-controller-manager
              mountPath: /var/lib/kube-controller-manager
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd/
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            # D-NODE-COLLECTOR-CNI-MOUNT: trivy-checks CMD-0009/CMD-0010 (nodeType: master only)
            # run `stat -c ... /*/cni/*`. Chart default mountPath `/etc/cni/net.d/` matches the
            # directory (700) instead of files inside it; mounting host `/etc/cni/net.d/` at
            # `/etc/cni` lets `/*/cni/*` glob the real CNI files (e.g. 05-cilium.conflist 600
            # root:root) so KCV0056/KCV0057 pass/fail truthfully on control-plane nodes.
            # Cost: non-net.d entries under host `/etc/cni` are omitted (unused by any collector
            # command); workers are not evaluated by CMD-0009/KCV0056 (sp.type == "master") and
            # empty `values: []` passes the upstream Rego, so workers and missing-CNI-file states
            # remain covered by harden-node-files.sh and verify_node_file_hardening where run.
            # Escape hatch: restore mountPath `/etc/cni/net.d/` and update checksum/node-collector-mounts.
            - name: etc-cni-netd
              mountPath: /etc/cni
              readOnly: true
            - name: etc-passwd
              mountPath: /etc/passwd
              readOnly: true
            - name: etc-group
              mountPath: /etc/group
              readOnly: true
          volumes:
            - name: var-lib-etcd
              hostPath:
                path: /var/lib/etcd
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
            - name: var-lib-kube-scheduler
              hostPath:
                path: /var/lib/kube-scheduler
            - name: var-lib-kube-controller-manager
              hostPath:
                path: /var/lib/kube-controller-manager
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
            - name: lib-systemd
              hostPath:
                path: /lib/systemd
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
            - name: etc-cni-netd
              hostPath:
                path: /etc/cni/net.d/
            - name: etc-passwd
              hostPath:
                path: /etc/passwd
                type: File
            - name: etc-group
              hostPath:
                path: /etc/group
                type: File
        policiesBundle:
          registry: harbor.devtools.svc.cluster.local
          repository: trivy-db/aquasecurity/trivy-checks
          tag: "1"
          insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
