apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: trivy-operator
    targetRevision: 0.27.0
    helm:
      valuesObject:
        # 차트 0.27.0에서 targetNamespaces/excludeNamespaces는 최상위 키다.
        # operator: 아래에 두면 조용히 무시되어 kube-system까지 스캔된다(2026-07-10 발견 —
        # config audit 실패 1219건 중 479건이 시스템 ns). kyverno 제외·PSA privileged와
        # 동일한 스코핑 원칙으로 istio-system도 제외.
        targetNamespaces: ""
        excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system,istio-system"
        trivyOperator:
          # D-SCAN-SKIP-VELERO-EPHEMERAL (2026-11-06): Velero creates short-lived workloads with
          # unique names, and the operator treats each one as a new workload and scans the velero
          # image again: a kopia maintenance Job per repository about every 5 min
          # (`velero.io/repo-name`, 23 scan Jobs in 24h) and a velero-data-mover Pod per
          # PodVolumeBackup/Restore (`velero.io/pod-volume-backup`, `velero.io/pod-volume-restore`,
          # container named by a UUID; ~10 scan Jobs in 24h, 2-4 GiB of writes each). The same
          # image is still scanned through the velero Deployment and the node-agent DaemonSet,
          # so no deployed image loses coverage. Only resources carrying one of these label keys
          # are skipped. Escape hatch: delete the line.
          skipResourceByLabels: velero.io/repo-name,velero.io/pod-volume-backup,velero.io/pod-volume-restore
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
        # D-TRIVY-SERVER: ClientServer via the chart's built-in server. Standalone made
        # every scan Job download the ~1GB trivy-db into its own emptyDir (500+ GiB of
        # writes on one worker in a day, plus harbor pull bursts); the single trivy-server
        # pod now holds the DB once and scan Jobs only upload layer metadata to it.
        # builtInTrivyServer forces mode=ClientServer + serverURL (see operator: below).
        # Escape hatch: builtInTrivyServer=false, mode=Standalone.
        trivy:
          mode: ClientServer
          # D-TRIVY-SERVER-CACHE-PVC (2026-11-06): the emptyDir of D-TRIVY-SERVER made every
          # trivy-server restart re-download the DB (two restarts in ~1h while Harbor was still
          # starting = ~7 GiB of container writes in 3h). A nfs-csi PVC keeps the DB across
          # restarts. It stays a cache, so Velero must not back it up (the pod annotation under
          # operator.serverAdditionalAnnotations; the schedules use defaultVolumesToFsBackup).
          # Escape hatch: storageClassEnabled=false. The StatefulSet volumeClaimTemplates field
          # is immutable, so flipping this needs `kubectl delete sts trivy-server` (cache only).
          storageClassEnabled: true
          storageClassName: nfs-csi
          storageSize: 5Gi
          server:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1536Mi
          ignoreUnfixed: false
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          timeout: "10m0s"
          # Trivy DB는 ghcr.io/aquasecurity/trivy-db 에서 pull (레이트 리밋 영향 적음)
          dbRegistry: harbor.devtools.svc.cluster.local
          dbRepository: trivy-db/aquasecurity/trivy-db
          javaDbRegistry: harbor.devtools.svc.cluster.local
          javaDbRepository: trivy-db/aquasecurity/trivy-java-db
          resources:
            requests:
              cpu: 50m # was 100m: a scan Job has 1 container per image in the target
              # workload, so a multi-image workload (e.g. 9 × 100m = 900m) could
              # not fit the CPU-committed 2-core workers (~600m free) → perpetual
              # Pending/timeout churn. Scans still burst to the 300m limit.
              memory: 128Mi
            limits:
              cpu: 300m # was 500m: cap per-scan CPU so scan Jobs don't starve co-located
              memory: 1Gi # was 512Mi: large images (harbor/keycloak) OOMKilled the scan Job,
              # leaving its VulnerabilityReport missing + ~15min retry churn.
              # concurrentLimit=2 → 2Gi peak, fits worker 6GB headroom.
          dbRepositoryInsecure: "true"
        # Compliance report generation (사용자 결정 2026-07-08).
        # reportType MUST be "all" (not the chart default "summary"): summary only fills
        # status.summary.passCount, leaving status.detailReport empty — the portal then
        # shows every control as "✓0 ✗0" (definitions only, per src/lib/compliance.ts).
        # "all" populates detailReport.controls so per-control pass/fail renders.
        compliance:
          reportType: all
          failEntriesLimit: 10
          cron: "0 */6 * * *"
        operator:
          builtInTrivyServer: true
          scanJobsConcurrentLimit: 2 # was 3: fewer concurrent scan Jobs => lower peak
          # node CPU (combined with 300m scan cap = ~600m peak
          # vs 1500m before) to protect co-located workloads
          scanJobTimeout: 10m
          # D-SCAN-RETRY (2026-11-06): chart default scanJobsRetryDelay=30s retries a failed scan
          # Job every 30s. Failures here are not transient on that scale: docker.io images hit the
          # anonymous Hub rate limit (TOOMANYREQUESTS/UNAUTHORIZED, per-IP 6h window) and Harbor
          # 502s at startup. A scan Job has one container per workload image, so every retry also
          # re-pulls and re-writes the layers of the siblings that succeeded (loki + loki-sc-rules,
          # grafana + 2 sidecars) and burns more of the Hub quota. 6h matches the Hub window; a
          # missing report is delayed at most 6h, well inside scannerReportTTL (168h).
          # Escape hatch: delete the line (30s default).
          scanJobsRetryDelay: 6h
          # 자동 스캔 활성
          vulnerabilityScannerEnabled: true
          # Compliance scanners ENABLED (사용자 결정 2026-07-08): feed the portal
          # /governance compliance page (CIS 1.23 / NSA 1.0 / PSS baseline+restricted).
          # config-audit + rbac run in-operator (no per-workload Job); infra spawns a
          # short node-collector Job per node (6h cron); compliance aggregates all three.
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          infraAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          clusterComplianceEnabled: true
          metricsVulnIdEnabled: true
          metricsExposedSecretInfo: true
          # 12시간 주기 재스캔 (Vagrant 환경 부하 고려)
          scanJobTTL: 12h
          # D-SCAN-REPORT-TTL (2026-11-05): chart default scannerReportTTL=24h expires every
          # VulnerabilityReport daily, so ~114 reports were rescanned ~3x in 3 days and each Standalone
          # scan Job re-downloads the ~1GB Trivy DB onto node disk (worker-3: ~300 scan pods, ~517GiB
          # written in 3d while guest usage never exceeded ~47GiB; the sparse vmdk grew to 292G and
          # never shrinks). 168h cuts that rewrite ~7x. Cost: a report can be up to 7d stale; the DB
          # is mirrored via Harbor (airgap) so it rarely changes faster than that. Escape hatch: set
          # back to 24h. Reports are still regenerated on any workload revision change.
          scannerReportTTL: 168h
          # The trivy-server pod is a cache: keep Velero fs-backup off its PVC (see trivy.storageClassEnabled).
          serverAdditionalAnnotations:
            backup.velero.io/backup-volumes-excludes: data
        # D-TRIVY-OPERATOR-MEM: the operator ran BestEffort (no requests/limits) and was
        # OOMKilled 33x/22h under node memory pressure (workers 5.4GB, 53-71% used). The
        # chart reads the TOP-LEVEL `resources` (templates/deployment.yaml); the old
        # `operator.resources` block was inert. Steady state is ~330Mi, so a 384Mi
        # request makes it Burstable and the 1Gi limit contains it.
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi
        # Prometheus 자동 수집 (prometheus-stack 의 ServiceMonitor selector 매칭됨)
        serviceMonitor:
          enabled: true
          namespace: security-system
          interval: 1m
        # Istio ambient mesh 제외 — Trivy operator는 K8s API + scan Job만 사용
        podLabels:
          istio.io/dataplane-mode: "none"
        nodeSelector: {}
        tolerations:
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule
        # node-collector: 노드 OS/패키지 인벤토리 수집 (CNI/kernel 정보)
        nodeCollector:
          # 비용/소음 줄이려면 비활성. 일단 활성 — Phase 2에서 노드 OS CVE에도 활용.
          enabled: true
          tolerations:
            - operator: Exists
              effect: NoSchedule
        policiesBundle:
          registry: harbor.devtools.svc.cluster.local
          repository: trivy-db/aquasecurity/trivy-checks
          tag: "1"
          insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: security-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
