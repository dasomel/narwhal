apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-server-rbac
  namespace: devtools
  annotations:
    # D2: install reviewed RBAC before Velero starts with its bound ServiceAccount.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: resources
    directory:
      include: "velero-server-rbac.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
