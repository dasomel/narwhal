apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui
  namespace: devtools
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/otwld/velero-ui
    targetRevision: v0.10.1
    path: kubernetes/chart
    helm:
      releaseName: velero-ui
      values: |
        replicaCount: 1

        image:
          # kyverno restrict-image-registries는 명시적 레지스트리 접두어를 요구.
          # docker.io 사용 사유: otwld/velero-ui는 Docker Hub에만 게시됨 (ghcr 미제공).
          repository: docker.io/otwld/velero-ui
          pullPolicy: IfNotPresent
          tag: "0.10.1"

        configuration:
          logLevel: "info"
          general:
            veleroNamespace: "storage"
            grafanaUrl: "https://grafana.{{ .Values.baseDomain }}"
            secretPassPhrase:
              existingSecret: "velero-ui-oauth"
              key: "passphrase"

        # privileged 명시 + kyverno add-default-securitycontext가 주입하는
        # runAsNonRoot: true에 대응해 숫자 UID 명시 (이미지 USER가 'node'라
        # 비숫자 유저는 kubelet이 non-root 검증 불가 → CreateContainerConfigError).
        # Trivy KSV001/003 added to the existing block above (allowPrivilegeEscalation,
        # capabilities.drop) -- verified container-level via helm template.
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        serviceAccount:
          create: true
          automount: true

        rbac:
          create: false
          clusterAdministrator: false

        service:
          type: ClusterIP
          port: 3000

        # Native Keycloak OAuth (no APISIX openid-connect layer — see apisix-routes.yaml).
        # NODE_EXTRA_CA_CERTS: velero-api(Node)가 Keycloak 토큰 엔드포인트(사설 CA TLS)에
        # server-to-server 호출 시 UNABLE_TO_VERIFY_LEAF_SIGNATURE 방지.
        volumes:
          - name: narwhal-ca
            secret:
              secretName: narwhal-ca-cert
        volumeMounts:
          - name: narwhal-ca
            mountPath: /etc/narwhal-ca
            readOnly: true
        env:
          - name: NODE_EXTRA_CA_CERTS
            value: "/etc/narwhal-ca/ca.crt"
          - name: BASIC_AUTH_ENABLED
            value: "false"
          - name: OAUTH_AUTH_ENABLED
            value: "true"
          - name: OAUTH_NAME
            value: "Keycloak"
          - name: OAUTH_AUTHORIZATION_URL
            value: "https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/auth"
          - name: OAUTH_TOKEN_URL
            value: "https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/token"
          - name: OAUTH_USER_INFO_URL
            value: "https://keycloak.{{ .Values.baseDomain }}/realms/narwhal/protocol/openid-connect/userinfo"
          - name: OAUTH_CLIENT_ID
            value: "velero-ui"
          - name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: velero-ui-oauth
                key: client_secret
          - name: OAUTH_OAUTH_SCOPE
            value: "openid profile email groups"
          - name: OAUTH_GROUP_CLAIM
            value: "groups"
          - name: OAUTH_REDIRECT_URI
            value: "https://velero-ui.{{ .Values.baseDomain }}/login"
          - name: BASE_URL
            value: "https://velero-ui.{{ .Values.baseDomain }}"

        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        podLabels:
          istio.io/dataplane-mode: none

  destination:
    server: https://kubernetes.default.svc
    namespace: storage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
