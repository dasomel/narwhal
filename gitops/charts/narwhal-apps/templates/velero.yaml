apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: devtools
  annotations:
    # The RBAC Application is wave 0; create its binding before Velero's wave 1
    # Application can start a server that depends on it.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/api/packages/gitea-admin/helm
    chart: velero
    targetRevision: 12.0.3
    helm:
      valuesObject:
        # INCIDENT WORKAROUND (not part of the Trivy hardening pass): the cluster-wide
        # kyverno add-default-securitycontext mutate policy injects pod-level
        # runAsNonRoot:true on any pod lacking an explicit value. The velero image's
        # default USER is 'cnb' (non-numeric, Cloud Native Buildpacks) so kubelet can't
        # verify non-root -> CreateContainerConfigError on every new velero/node-agent
        # pod (hit on rollout/reschedule, unrelated to any values here). Explicitly
        # opt out so kyverno's mutation is a no-op, matching the documented fix pattern
        # (mistakes log 2026-07-10) until a real fix lands in kyverno-policies
        # (out of this chart's scope).
        podSecurityContext:
          runAsNonRoot: false
        # Trivy KSV001/003 (verified container-level via helm template, retried now
        # that the kyverno runAsNonRoot auto-injection is gone -- see the incident
        # workaround above). No seccompProfile here: kyverno's add-default-seccomp
        # mutate now injects it cluster-wide for the storage namespace (not
        # excluded), so setting it here would just duplicate. Not forcing
        # runAsNonRoot (KSV012): image USER is 'cnb' (non-numeric), still unverifiable.
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.1
            # Trivy also flags this initContainer (KSV001/003) separately.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://seaweedfs-s3.storage.svc.cluster.local:8333
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: us-east-1
          defaultBackupStorageLocation: default
          defaultVolumeSnapshotLocations: aws:default
          uploaderType: kopia
          # Enable file-system backup by default for all pods with PVCs
          defaultVolumesToFsBackup: true
        credentials:
          useSecret: true
          # Reference secret created by 08-platform-apps.sh (velero-s3-credentials in storage ns)
          # Secret key 'cloud' contains AWS credentials file format with actual SeaweedFS S3 keys
          existingSecret: velero-s3-credentials
        snapshotsEnabled: false
        # Disable CRD upgrade hook - alpine/k8s musl binaries can't exec in velero glibc container
        upgradeCRDs: false
        kubectl:
          image:
            # docker.io: shell 포함 kubectl 이미지, ghcr.io/registry.k8s.io 대안 없음 (distroless)
            repository: docker.io/alpine/k8s
            tag: "1.31.4"
        deployNodeAgent: true
        nodeAgent:
          podVolumePath: /var/lib/kubelet/pods
          # REQUIRED: kopia/restic이 hostPath volume 백업을 위해 privileged 필요
          # Kyverno disallow-privileged-containers 정책에서 velero nodeAgent 예외 처리됨
          privileged: true
          # See INCIDENT WORKAROUND comment above podSecurityContext at the top of this
          # file — same kyverno non-root-injection issue hits node-agent pods too.
          podSecurityContext:
            runAsNonRoot: false
        # Narwhal#226: least-privilege RBAC for velero-server.
        # rbac.create=false makes the chart render no server ClusterRoleBinding;
        # Argo prune removes the legacy cluster-admin binding on upgrade.
        # Dedicated least-privilege ClusterRole and ClusterRoleBinding are managed
        # via gitops/resources/velero-server-rbac.yaml.
        rbac:
          # The chart's rbac.create=true Role grants every resource/verb in storage.
          # A separately managed explicit ClusterRole below supplies restore access.
          create: false
          clusterAdministrator: false
        # D2: Keep each schedule's includedResources equal to the generated READ inventory;
        # D3: events and coordination Leases stay excluded from that inventory.
        schedules:
          # Daily full backup (all namespaces with PVCs)
          daily-full:
            disabled: false
            schedule: "0 2 * * *"
            template:
              ttl: 168h
              includedResources: &velero_included
                - alertmanagerconfigs.monitoring.coreos.com
                - alertmanagers.monitoring.coreos.com
                - alloys.collectors.grafana.com
                - apiservices.apiregistration.k8s.io
                - apisixclusterconfigs.apisix.apache.org
                - apisixconsumers.apisix.apache.org
                - apisixglobalrules.apisix.apache.org
                - apisixpluginconfigs.apisix.apache.org
                - apisixroutes.apisix.apache.org
                - apisixtlses.apisix.apache.org
                - apisixupstreams.apisix.apache.org
                - applications.argoproj.io
                - applicationsets.argoproj.io
                - appprojects.argoproj.io
                - authorizationpolicies.security.istio.io
                - backups.postgresql.cnpg.io
                - bfdprofiles.metallb.io
                - bgpadvertisements.metallb.io
                - bgppeers.metallb.io
                - bgpsessionstates.frrk8s.metallb.io
                - certificaterequests.cert-manager.io
                - certificates.cert-manager.io
                - challenges.acme.cert-manager.io
                - ciliumcidrgroups.cilium.io
                - ciliumclusterwideenvoyconfigs.cilium.io
                - ciliumclusterwidenetworkpolicies.cilium.io
                - ciliumendpoints.cilium.io
                - ciliumenvoyconfigs.cilium.io
                - ciliumgatewayclassconfigs.cilium.io
                - ciliumidentities.cilium.io
                - ciliuml2announcementpolicies.cilium.io
                - ciliumloadbalancerippools.cilium.io
                - ciliumnetworkpolicies.cilium.io
                - ciliumnodeconfigs.cilium.io
                - ciliumnodes.cilium.io
                - ciliumpodippools.cilium.io
                - cleanuppolicies.kyverno.io
                - clustercleanuppolicies.kyverno.io
                - clusterephemeralreports.reports.kyverno.io
                - clusterimagecatalogs.postgresql.cnpg.io
                - clusterissuers.cert-manager.io
                - clusterpolicies.kyverno.io
                - clusterpolicyreports.wgpolicyk8s.io
                - clusterrolebindings.rbac.authorization.k8s.io
                - clusterroles.rbac.authorization.k8s.io
                - clusters.postgresql.cnpg.io
                - communities.metallb.io
                - configmaps
                - configurationstates.metallb.io
                - controllerrevisions.apps
                - cronjobs.batch
                - csidrivers.storage.k8s.io
                - csinodes.storage.k8s.io
                - csistoragecapacities.storage.k8s.io
                - customresourcedefinitions.apiextensions.k8s.io
                - daemonsets.apps
                - databases.postgresql.cnpg.io
                - deletingpolicies.policies.kyverno.io
                - deployments.apps
                - destinationrules.networking.istio.io
                - deviceclasses.resource.k8s.io
                - endpoints
                - endpointslices.discovery.k8s.io
                - envoyfilters.networking.istio.io
                - ephemeralreports.reports.kyverno.io
                - failoverquorums.postgresql.cnpg.io
                - flowschemas.flowcontrol.apiserver.k8s.io
                - frrconfigurations.frrk8s.metallb.io
                - frrk8sconfigurations.frrk8s.metallb.io
                - frrnodestates.frrk8s.metallb.io
                - gatewayclasses.gateway.networking.k8s.io
                - gateways.gateway.networking.k8s.io
                - gateways.networking.istio.io
                - generatingpolicies.policies.kyverno.io
                - globalcontextentries.kyverno.io
                - grpcroutes.gateway.networking.k8s.io
                - horizontalpodautoscalers.autoscaling
                - httproutes.gateway.networking.k8s.io
                - imagecatalogs.postgresql.cnpg.io
                - imagevalidatingpolicies.policies.kyverno.io
                - ingressclasses.networking.k8s.io
                - ingresses.networking.k8s.io
                - ipaddresses.networking.k8s.io
                - ipaddresspools.metallb.io
                - issuers.cert-manager.io
                - jobs.batch
                - keycloakrealmimports.k8s.keycloak.org
                - keycloaks.k8s.keycloak.org
                - l2advertisements.metallb.io
                - limitranges
                - mutatingpolicies.policies.kyverno.io
                - mutatingwebhookconfigurations.admissionregistration.k8s.io
                - namespaceddeletingpolicies.policies.kyverno.io
                - namespacedgeneratingpolicies.policies.kyverno.io
                - namespacedimagevalidatingpolicies.policies.kyverno.io
                - namespacedmutatingpolicies.policies.kyverno.io
                - namespacedvalidatingpolicies.policies.kyverno.io
                - namespaces
                - networkpolicies.networking.k8s.io
                - orders.acme.cert-manager.io
                - peerauthentications.security.istio.io
                - persistentvolumeclaims
                - persistentvolumes
                - poddisruptionbudgets.policy
                - podmonitors.monitoring.coreos.com
                - pods
                - podtemplates
                - policies.kyverno.io
                - policyexceptions.kyverno.io
                - policyexceptions.policies.kyverno.io
                - policyreports.wgpolicyk8s.io
                - poolers.postgresql.cnpg.io
                - priorityclasses.scheduling.k8s.io
                - prioritylevelconfigurations.flowcontrol.apiserver.k8s.io
                - probes.monitoring.coreos.com
                - prometheusagents.monitoring.coreos.com
                - prometheuses.monitoring.coreos.com
                - prometheusrules.monitoring.coreos.com
                - proxyconfigs.networking.istio.io
                - publications.postgresql.cnpg.io
                - quotapolicies.quota.nfs.io
                - referencegrants.gateway.networking.k8s.io
                - replicasets.apps
                - replicationcontrollers
                - requestauthentications.security.istio.io
                - resourceclaims.resource.k8s.io
                - resourceclaimtemplates.resource.k8s.io
                - resourcequotas
                - resourceslices.resource.k8s.io
                - rolebindings.rbac.authorization.k8s.io
                - roles.rbac.authorization.k8s.io
                - runtimeclasses.node.k8s.io
                - scheduledbackups.postgresql.cnpg.io
                - scrapeconfigs.monitoring.coreos.com
                - secrets
                - serviceaccounts
                - servicebgpstatuses.metallb.io
                - servicecidrs.networking.k8s.io
                - serviceentries.networking.istio.io
                - servicel2statuses.metallb.io
                - servicemonitors.monitoring.coreos.com
                - services
                - sidecars.networking.istio.io
                - statefulsets.apps
                - storageclasses.storage.k8s.io
                - subscriptions.postgresql.cnpg.io
                - telemetries.telemetry.istio.io
                - thanosrulers.monitoring.coreos.com
                - trafficextensions.extensions.istio.io
                - updaterequests.kyverno.io
                - validatingadmissionpolicies.admissionregistration.k8s.io
                - validatingadmissionpolicybindings.admissionregistration.k8s.io
                - validatingpolicies.policies.kyverno.io
                - validatingwebhookconfigurations.admissionregistration.k8s.io
                - virtualservices.networking.istio.io
                - volumeattachments.storage.k8s.io
                - volumeattributesclasses.storage.k8s.io
                - wasmplugins.extensions.istio.io
                - workloadentries.networking.istio.io
                - workloadgroups.networking.istio.io
              includedNamespaces:
                - "*"
              excludedNamespaces:
                - kube-system
                - storage
                - monitoring
              includeClusterResources: true
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Database backup (PostgreSQL - CNPG)
          daily-databases:
            disabled: false
            schedule: "0 1 * * *"
            template:
              ttl: 336h  # 14 days
              includedResources: *velero_included
              includedNamespaces:
                - iam
                - devtools
              labelSelector:
                matchLabels:
                  cnpg.io/cluster: ""
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Gitea backup
          daily-gitea:
            disabled: false
            schedule: "0 3 * * *"
            template:
              ttl: 336h  # 14 days
              includedResources: *velero_included
              includedNamespaces:
                - devtools
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # Harbor backup
          daily-harbor:
            disabled: false
            schedule: "0 4 * * *"
            template:
              ttl: 168h  # 7 days
              includedResources: *velero_included
              includedNamespaces:
                - devtools
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
          # OpenBao backup
          daily-openbao:
            disabled: false
            schedule: "0 5 * * *"
            template:
              ttl: 336h  # 14 days
              includedResources: *velero_included
              includedNamespaces:
                - storage
              includeClusterResources: false
              storageLocation: default
              defaultVolumesToFsBackup: true
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
