# Narwhal IDP admin console theme: branding only.
# Extends keycloak.v2 (the admin console app and index.ftl ship with Keycloak); this theme only
# sets the properties that index.ftl and the console bundle read, plus one stylesheet that remaps
# PatternFly tokens. No template, bundle or component is replaced, so Keycloak upgrades keep working.
#   logo / logoUrl : masthead brand image (path under this theme's resources) and its link target
#   favIcon        : tab icon, favIconType its MIME type
#   title          : browser tab title
#   styles         : extra stylesheet loaded after the console CSS
# Source: keycloak.v2 admin index.ftl and console bundle in Keycloak 26.5.7; theme model in
# https://www.keycloak.org/ui-customization/themes
parent=keycloak.v2
logo=/img/logo.svg
favIcon=/img/favicon.svg
favIconType=image/svg+xml
title=Narwhal IDP Administration Console
description=Narwhal IDP administration console
styles=css/narwhal-admin.css
