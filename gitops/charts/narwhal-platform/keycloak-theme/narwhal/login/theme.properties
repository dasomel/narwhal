# Narwhal IDP login theme: Portal-unified skin over keycloak.v2.
# Only the skin is overridden (css/js/messages + info.ftl). Every page template, field/button
# macro and the PatternFly v5 vendor CSS are inherited from keycloak.v2, so pages this theme
# does not list (error, page-expired, update-password/profile, OTP, WebAuthn, ...) are styled
# through the CSS tokens in narwhal.css and keep working across Keycloak upgrades.
parent=keycloak.v2
import=common/keycloak
# keycloak.v2's own sheet first (tooltip, recovery-code columns, ...), then the skin.
styles=css/styles.css css/narwhal.css
# Synchronous head script: reads the Portal's narwhal-theme cookie before first paint.
scripts=js/narwhal.js
# Disable the stock prefers-color-scheme switch; narwhal.js owns light/dark (cookie, default light).
darkMode=false
locales=en,ko
# keycloak.v2 defines no alert icon classes, so alerts rendered an empty icon slot. These use the
# Font Awesome classes already shipped with the v2 vendor CSS (the field error icon uses the same).
kcFeedbackSuccessIcon=fas fa-check-circle
kcFeedbackWarningIcon=fas fa-exclamation-triangle
kcFeedbackErrorIcon=fas fa-exclamation-circle
kcFeedbackInfoIcon=fas fa-info-circle
