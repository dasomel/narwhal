---
# etcd Deployment (registry.k8s.io/etcd — no Bitnami)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-etcd
  namespace: platform-system
spec:
  replicas: 1
  # D-apisix-etcd-pvc (#714): single-writer etcd on a PVC must terminate the old pod before
  # mounting /var/etcd/data so two etcd processes never race on the same directory lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
        istio.io/dataplane-mode: "none"
      annotations:
        # etcd writes 0700 files as uid 10001, unreadable to root_squashed Velero kopia;
        # APISIX CRs remain backed up by Velero and are the source of truth for resync.
        backup.velero.io/backup-volumes-excludes: data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcd
          # registry.k8s.io: K8s 공식 레지스트리, ARM64 지원, no Bitnami
          image: registry.k8s.io/etcd:3.5.31-0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - etcd
            - --data-dir=/var/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://apisix-etcd.platform-system.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://apisix-etcd.platform-system.svc.cluster.local:2380
            - --initial-cluster=default=http://apisix-etcd.platform-system.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --auto-compaction-mode=revision
            - --auto-compaction-retention=1000
          env:
            - name: ETCDCTL_API
              value: "3"
          ports:
            - containerPort: 2379
            - containerPort: 2380
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/etcd/data
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 10
            periodSeconds: 5
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: apisix-etcd-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apisix-etcd-data
  namespace: platform-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: platform-system
spec:
  selector:
    app: apisix-etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# Wildcard TLS Certificate (cert-manager, narwhal-ca-issuer)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: narwhal-wildcard-tls
  namespace: platform-system
spec:
  secretName: narwhal-wildcard-tls
  issuerRef:
    name: narwhal-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.{{ .Values.baseDomain }}"
  duration: 8760h
  renewBefore: 720h
---
# ApisixTls: APISIX가 와일드카드 인증서로 TLS 종료
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: narwhal-wildcard
  namespace: platform-system
spec:
  hosts:
    - "*.{{ .Values.baseDomain }}"
  secret:
    name: narwhal-wildcard-tls
    namespace: platform-system
