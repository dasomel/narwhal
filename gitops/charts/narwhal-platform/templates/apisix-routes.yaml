      # Live dev (skaffold dev) HMR: Next.js dev WebSocket (/_next/webpack-hmr)
      # needs upgrade support, otherwise the dev client falls back to plain GET
      # (404) and the portal UI never hydrates. Harmless for prod standalone.
      # NOTE: IC sync for this route aborts (cross-ns endpoints), so the serving
