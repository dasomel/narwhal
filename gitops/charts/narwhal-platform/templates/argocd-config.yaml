apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: devtools
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: devtools
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  accounts.narwhal-portal: apiKey,login
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.{{ .Values.baseDomain }}/realms/narwhal
    clientID: argocd
    clientSecret: $oidc.keycloak.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
  # Kyverno admission webhook injects defaulted fields (admission, emitWarning,
  # per-rule skipBackgroundRequests, validate.allowExistingViolations) into live
  # ClusterPolicy objects. Without ignoring them ArgoCD marks the owning app
  # (e.g. narwhal-portal -> narwhal-portal-job-restrictions) permanently OutOfSync.
  resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
    jqPathExpressions:
    - .spec.admission
    - .spec.emitWarning
    - .spec.rules[].skipBackgroundRequests
    - .spec.rules[].validate.allowExistingViolations
  # ArgoCD itself adds pre-delete finalizers to child Application objects whose
  # chart ships PreDelete hooks (e.g. kyverno), making the app-of-apps
  # (narwhal-apps -> Application/kyverno) flap OutOfSync against gitea.
  resource.customizations.ignoreDifferences.argoproj.io_Application: |
    jqPathExpressions:
    - .metadata.finalizers[] | select(. == "pre-delete-finalizer.argocd.argoproj.io" or . == "pre-delete-finalizer.argocd.argoproj.io/cleanup")
    - .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
  # Live dev (skaffold dev) support: skaffold deploys the portal with a dev
  # image (dev-m-*), raised resources, and skaffold-injected labels. Ignoring
  # these fields stops selfHeal from instantly reverting the dev deployment
  # (which silently killed HMR). CONDITIONAL on the live image being a :dev-*
  # tag: the original unconditional image ignore made every GitOps SemVer pin
  # bump invisible (app stayed Synced on a stale image; bumps only landed by
  # piggybacking on unrelated syncs — see CLAUDE.md 2026-07-13). With the
  # select() guard the paths only exist while a dev image is actually running,
  # so prod pin bumps diff normally and dev sessions stay protected.
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jqPathExpressions:
    - .spec.template.spec.containers[] | select(.name == "narwhal-portal") | select(.image | test(":dev-")) | .image
    - .spec.template.spec.containers[] | select(.name == "narwhal-portal") | select(.image | test(":dev-")) | .resources
  resource.customizations.ignoreDifferences.all: |
    jqPathExpressions:
    - .metadata.labels."skaffold.dev/run-id"
    - .metadata.labels."app.kubernetes.io/managed-by"
    - .spec.template.metadata.labels."skaffold.dev/run-id"
  # Self-ignore: these keys were hot-patched into the live argocd-cm before
  # this file reached gitea. The jq paths only match argocd-cm itself (no other
  # ConfigMap carries these keys), keeping argocd-config Synced either way.
  resource.customizations.ignoreDifferences.ConfigMap: |
    jqPathExpressions:
    - .data["resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy"]
    - .data["resource.customizations.ignoreDifferences.ConfigMap"]
    - .data["resource.customizations.ignoreDifferences.argoproj.io_Application"]
    - .data["resource.customizations.ignoreDifferences.apps_Deployment"]
    - .data["resource.customizations.ignoreDifferences.all"]
  resource.customizations.ignoreResourceUpdates.ConfigMap: |
    jqPathExpressions:
      # Ignore the cluster-autoscaler status
      - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
      # Ignore the annotation of the legacy Leases election
      - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
  resource.customizations.ignoreResourceUpdates.Endpoints: |
    jsonPointers:
      - /metadata
      - /subsets
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers:
      - /status
  resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
    jqPathExpressions:
      - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
      - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
      - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
      - '.metadata.annotations."argocd.argoproj.io/refresh"'
      - '.metadata.annotations."argocd.argoproj.io/hydrate"'
      - '.operation'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
  resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
    jqPathExpressions:
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
  resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
    jsonPointers:
      - /metadata
      - /endpoints
      - /ports
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
  server.insecure: "true"
  url: https://argocd.{{ .Values.baseDomain }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: devtools
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, get, */*, allow
    p, role:developer, logs, get, */*, allow
    p, role:none, applications, get, */*, deny
    p, role:portal-reader, applications, get, */*, allow
    p, role:portal-reader, applications, list, */*, allow
    p, role:portal-reader, logs, get, */*, allow
    g, narwhal-portal, role:portal-reader
    g, cluster-admin, role:admin
    g, developer, role:developer
    g, viewer, role:readonly
    g, guest, role:none
  policy.default: role:readonly
  scopes: '[groups]'
