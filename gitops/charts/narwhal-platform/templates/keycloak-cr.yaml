# Keycloak CR - Keycloak Operator가 관리
# Operator CRD+RBAC는 11-keycloak.sh에서 설치됨
# DB secret (keycloak-db-secret)은 11-keycloak.sh에서 생성됨
---
apiVersion: v1
data:
  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password'); section>
        <#if section = "header">
            ${msg("loginAccountTitle")}
        <#elseif section = "form">
            <#if realm.password>
            <form id="kc-form-login" class="nw-form" action="${url.loginAction}" method="post">
                <div class="nw-field">
                    <label class="nw-label" for="username"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
                    <input id="username" class="nw-input" name="username" type="text" value="${(login.username!'')}" autofocus autocomplete="username"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <div class="nw-field">
                    <label class="nw-label" for="password">${msg("password")}</label>
                    <input id="password" class="nw-input" name="password" type="password" autocomplete="current-password"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <#if messagesPerField.existsError('username','password')>
                    <div class="nw-err" aria-live="polite">${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}</div>
                </#if>
                <#if (realm.rememberMe && !usernameHidden??) || realm.resetPasswordAllowed>
                <div class="nw-row">
                    <#if realm.rememberMe && !usernameHidden??>
                        <label class="nw-check"><input name="rememberMe" type="checkbox" <#if login.rememberMe??>checked</#if>/> ${msg("rememberMe")}</label>
                    <#else><span></span></#if>
                    <#if realm.resetPasswordAllowed>
                        <a class="nw-link" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                    </#if>
                </div>
                </#if>
                <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>
                <button class="nw-btn" name="login" id="kc-login" type="submit">${msg("doLogIn")}</button>
            </form>
            </#if>
        <#elseif section = "info">
            <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
                <span>${msg("noAccount")} <a class="nw-link" href="${url.registrationUrl}">${msg("doRegister")}</a></span>
            </#if>
        </#if>
    </@layout.registrationLayout>
  messages_en.properties: |
    # Narwhal IDP Theme - English Messages
    loginAccountTitle=Sign in to your account
    loginTitle=Narwhal IDP
    doLogIn=Sign In
    usernameOrEmail=Username or email
    password=Password
    doForgotPassword=Forgot password?
    rememberMe=Remember me
    invalidUserMessage=Invalid username or password.
  messages_ko.properties: |
    # Narwhal IDP Theme - Korean Messages
    loginAccountTitle=계정에 로그인하세요
    loginTitle=Narwhal IDP
    doLogIn=로그인
    usernameOrEmail=사용자명 또는 이메일
    password=비밀번호
    doForgotPassword=비밀번호를 잊으셨나요?
    rememberMe=로그인 유지
    invalidUserMessage=잘못된 사용자명 또는 비밀번호입니다.
  narwhal.css: |
    /* ==========================================================================
       Narwhal IDP — "Aurora Glacial" Keycloak login theme.
       Deep arctic-night backdrop + aurora borealis ribbons (teal→emerald→violet)
       + frosted-glass card + narwhal (외뿔고래) branding.
       Renders against custom template.ftl / login.ftl / logout-confirm.ftl
       (no PatternFly). Airgap/CSP-safe: system font stacks only, no external assets.
       ========================================================================== */
    :root {
      --nw-fg: #eaf1fb;
      --nw-muted: #8ea2be;
      --nw-faint: #5f739a;
      --nw-border: rgba(148, 176, 214, 0.16);
      --nw-border-strong: rgba(148, 176, 214, 0.28);
      --nw-teal: #2dd4bf;
      --nw-cyan: #22d3ee;
      --nw-emerald: #34d399;
      --nw-violet: #a78bfa;
      --nw-ring: rgba(45, 212, 191, 0.30);
      --nw-radius: 12px;
      --nw-sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Display",
        "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --nw-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Cascadia Code",
        "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }

    .nw-body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--nw-fg);
      background: #060a14;
      font-family: var(--nw-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Aurora field: drifting luminous ribbons across the arctic night sky. */
    .nw-body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 78%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(46rem 30rem at 22% 0%, rgba(45, 212, 191, 0.26) 0%, rgba(45, 212, 191, 0) 60%),
        radial-gradient(40rem 28rem at 70% 6%, rgba(52, 211, 153, 0.22) 0%, rgba(52, 211, 153, 0) 58%),
        radial-gradient(52rem 34rem at 92% 0%, rgba(167, 139, 250, 0.24) 0%, rgba(167, 139, 250, 0) 62%);
      filter: blur(6px) saturate(115%);
      animation: nw-aurora 22s ease-in-out infinite alternate;
    }

    /* Deep-ocean glow anchoring the composition at the bottom. */
    .nw-body::after {
      content: "";
      position: fixed;
      inset: auto -10% -25% -10%;
      height: 55%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60rem 26rem at 50% 100%, rgba(8, 47, 73, 0.9) 0%, rgba(8, 47, 73, 0) 70%),
        linear-gradient(180deg, rgba(6, 10, 20, 0) 0%, #05080f 92%);
    }

    @keyframes nw-aurora {
      0%   { transform: translateX(-3%) translateY(0) scale(1.02); opacity: 0.9; }
      50%  { transform: translateX(3%)  translateY(-2%) scale(1.06); opacity: 1; }
      100% { transform: translateX(-2%) translateY(1%) scale(1.03); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nw-body::before { animation: none; }
    }

    /* faint far-north ice shelf near the bottom (SVG in template.ftl) */
    .nw-waves {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 190px;
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }

    .nw-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 396px;
      padding: 40px 34px 26px;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(18, 27, 45, 0.72) 0%, rgba(11, 18, 32, 0.78) 100%);
      border: 1px solid var(--nw-border);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
      backdrop-filter: blur(22px) saturate(130%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 30px 70px -20px rgba(2, 6, 16, 0.85),
        0 0 60px -30px rgba(45, 212, 191, 0.35);
      animation: nw-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes nw-rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    /* aurora hairline across the top of the card */
    .nw-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg,
        transparent 0%, var(--nw-teal) 22%, var(--nw-emerald) 50%, var(--nw-violet) 78%, transparent 100%);
      opacity: 0.85;
    }

    .nw-head { text-align: center; margin-bottom: 28px; }

    .nw-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 66px;
      margin-bottom: 18px;
      color: #04121a;
      background: linear-gradient(135deg, var(--nw-teal) 0%, var(--nw-cyan) 55%, var(--nw-emerald) 100%);
      border-radius: 21px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 12px 30px -8px rgba(45, 212, 191, 0.55);
    }
    .nw-whale { width: 42px; height: 31px; display: block; }

    .nw-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #f4f8ff;
    }

    .nw-sub {
      margin: 8px 0 0;
      font-size: 13.5px;
      color: var(--nw-muted);
    }

    .nw-form { display: flex; flex-direction: column; gap: 17px; }

    .nw-field { display: flex; flex-direction: column; gap: 7px; }

    .nw-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #a7bad6;
      font-family: var(--nw-mono);
    }

    .nw-input {
      height: 46px;
      width: 100%;
      padding: 0 15px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--nw-fg);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--nw-border-strong);
      border-radius: var(--nw-radius);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }
    .nw-input::placeholder { color: #566b8c; }
    .nw-input:hover { border-color: rgba(148, 176, 214, 0.4); }
    .nw-input:focus {
      border-color: var(--nw-teal);
      background: rgba(45, 212, 191, 0.05);
      box-shadow: 0 0 0 3px var(--nw-ring);
    }

    .nw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--nw-muted);
      margin-top: -3px;
    }
    .nw-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .nw-check input { width: 15px; height: 15px; accent-color: var(--nw-teal); }

    .nw-link {
      color: var(--nw-teal);
      text-decoration: none;
      font-weight: 600;
    }
    .nw-link:hover { color: var(--nw-emerald); text-decoration: underline; text-underline-offset: 2px; }

    /* Primary action — used by BOTH the login and logout-confirm buttons. */
    .nw-btn {
      height: 46px;
      width: 100%;
      margin-top: 4px;
      border: none;
      border-radius: var(--nw-radius);
      cursor: pointer;
      color: #04121a;
      background: linear-gradient(135deg, var(--nw-teal) 0%, var(--nw-cyan) 100%);
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 26px -10px rgba(34, 211, 238, 0.6);
      transition: transform 0.05s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .nw-btn:hover { filter: brightness(1.06); box-shadow: 0 14px 32px -10px rgba(34, 211, 238, 0.78); }
    .nw-btn:active { transform: translateY(1px); }
    .nw-btn:focus-visible { outline: 2px solid var(--nw-emerald); outline-offset: 2px; }

    /* Secondary action — quieter, glassy (e.g. "cancel" on logout). */
    .nw-btn-ghost {
      height: 46px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--nw-radius);
      cursor: pointer;
      color: var(--nw-fg);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--nw-border-strong);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: border-color 0.16s ease, background 0.16s ease;
    }
    .nw-btn-ghost:hover { border-color: rgba(148, 176, 214, 0.45); background: rgba(255, 255, 255, 0.07); }

    .nw-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

    .nw-alert {
      font-size: 13px;
      line-height: 1.45;
      padding: 11px 13px;
      border-radius: var(--nw-radius);
      margin-bottom: 18px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
    }
    .nw-alert-error   { background: rgba(244, 63, 94, 0.12);  border-color: rgba(244, 63, 94, 0.4);  color: #fda4af; }
    .nw-alert-success { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.4); color: #6ee7b7; }
    .nw-alert-warning { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.4); color: #fcd34d; }
    .nw-alert-info    { background: rgba(45, 212, 191, 0.12); border-color: rgba(45, 212, 191, 0.4); color: #5eead4; }

    .nw-err { font-size: 12px; color: #fda4af; margin-top: -8px; }

    .nw-info {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--nw-border);
      text-align: center;
      font-size: 13px;
      color: var(--nw-muted);
    }

    .nw-foot {
      margin: 24px 0 0;
      text-align: center;
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--nw-faint);
      font-family: var(--nw-mono);
    }
  template.ftl: |
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false>
    <!DOCTYPE html>
    <html lang="${(locale.currentLanguageTag)!'en'}">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <meta name="robots" content="noindex, nofollow"/>
      <title>Narwhal IDP</title>
      <#if properties.styles?has_content>
        <#list properties.styles?split(' ') as style>
          <link href="${url.resourcesPath}/${style}" rel="stylesheet"/>
        </#list>
      </#if>
    </head>
    <body class="nw-body">
      <#-- deep arctic-ocean horizon under the aurora -->
      <svg class="nw-waves" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path fill="#0e7490" fill-opacity="0.28" d="M0 96 C240 140 480 52 720 84 C960 116 1200 150 1440 92 L1440 200 L0 200 Z"/>
        <path fill="#155e75" fill-opacity="0.34" d="M0 128 C240 104 480 158 720 124 C960 92 1200 138 1440 124 L1440 200 L0 200 Z"/>
        <path fill="#083344" fill-opacity="0.5" d="M0 158 C260 138 520 176 760 158 C1000 140 1220 168 1440 156 L1440 200 L0 200 Z"/>
      </svg>

      <main class="nw-card">
        <header class="nw-head">
          <span class="nw-logo" aria-hidden="true">
            <svg class="nw-whale" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <#-- spiral tusk -->
              <line x1="42" y1="19" x2="62" y2="3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.7">
                <line x1="45" y1="16.5" x2="47.6" y2="18.4"/>
                <line x1="49" y1="13.5" x2="51.6" y2="15.4"/>
                <line x1="53" y1="10.5" x2="55.6" y2="12.4"/>
                <line x1="57" y1="7.5" x2="59.6" y2="9.4"/>
              </g>
              <#-- water spout -->
              <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
                <line x1="13" y1="14" x2="13" y2="9"/>
                <line x1="10" y1="15" x2="8.5" y2="11"/>
                <line x1="16" y1="15" x2="17.5" y2="11"/>
              </g>
              <#-- body -->
              <path d="M7 29 C7 19 19 15 31 17 C41 18.6 47 23 46 30 C45.3 35 39 37.6 31 37.2 C21 36.6 13 36.6 9 33.6 C7.6 32.5 7 31 7 29 Z" fill="currentColor"/>
              <#-- tail fluke -->
              <path d="M7 29 L0 23 L3.5 29 L0 35 Z" fill="currentColor"/>
              <#-- pectoral fin -->
              <path d="M23 36.8 C24 41.6 26 43.6 27 43.6 C27 40.6 27 38.6 28 36.6 Z" fill="currentColor" opacity="0.85"/>
              <#-- eye -->
              <circle cx="17" cy="27" r="1.8" fill="#0b1220"/>
            </svg>
          </span>
          <h1 class="nw-title">Narwhal IDP</h1>
          <p class="nw-sub"><#nested "header"></p>
        </header>

        <#if displayMessage && message?? && message.summary?has_content>
          <div class="nw-alert nw-alert-${message.type}">
            <span>${kcSanitize(message.summary)?no_esc}</span>
          </div>
        </#if>

        <#nested "form">

        <#if displayInfo>
          <div class="nw-info"><#nested "info"></div>
        </#if>

        <p class="nw-foot">Internal Developer Platform</p>
      </main>
    </body>
    </html>
    </#macro>
  theme.properties: |
    # Narwhal IDP — clean shadcn login theme (custom templates, no PatternFly)
    parent=keycloak.v2
    import=common/keycloak
    styles=css/narwhal.css
    locales=en,ko
  logout-confirm.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout; section>
        <#if section = "header">
            ${msg("logoutConfirmTitle")}
        <#elseif section = "form">
            <div id="kc-logout-confirm" class="nw-form">
                <p style="text-align:center;margin:0 0 6px;font-size:15px;color:var(--nw-fg);">${msg("logoutConfirmHeader")}</p>
                <form class="nw-form" action="${url.logoutConfirmAction}" method="POST">
                    <input type="hidden" name="session_code" value="${logoutConfirm.code}"/>
                    <div class="nw-actions">
                        <button class="nw-btn" name="confirmLogout" id="kc-logout" type="submit">${msg("doLogout")}</button>
                        <#if (!logoutConfirm.skipLink) && client?? && client.baseUrl?has_content>
                            <a class="nw-btn-ghost" href="${client.baseUrl}">${msg("backToApplication")}</a>
                        </#if>
                    </div>
                </form>
            </div>
        </#if>
    </@layout.registrationLayout>
kind: ConfigMap
metadata:
  name: keycloak-theme-narwhal
  namespace: iam
  labels:
    app: keycloak
    component: theme
    theme: narwhal
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: iam
spec:
  instances: 1
  db:
    vendor: postgres
    host: narwhal-db-rw.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.{{ .Values.baseDomain }}
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  # First-class resources — the operator HONORS spec.resources but IGNORES resources set
  # under unsupported.podTemplate. The old config (podTemplate cpu 200m) was silently
  # dropped, so Keycloak ran with NO CPU request and got starved under node contention:
  # its 9000 health endpoint missed the 1s probe timeout -> liveness SIGKILL crash loop
  # -> keycloak-service endpoints emptied -> APISIX 502 on all SSO. A real CPU request fixes it.
  resources:
    requests:
      cpu: "600m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  unsupported:
    podTemplate:
      metadata:
        labels:
          istio.io/dataplane-mode: "none"
      spec:
        containers:
          - name: keycloak
            # Relaxed health probes (timeoutSeconds 1->5, failureThreshold 3->5) tolerate
            # transient GC/CPU spikes instead of false-positive killing under contention.
            # (Operator HONORS these podTemplate probes; CPU/memory go in spec.resources
            # above because podTemplate resources are ignored by the operator.)
            livenessProbe:
              httpGet:
                path: /health/live
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 15
              failureThreshold: 5
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 10
              failureThreshold: 5
            startupProbe:
              httpGet:
                path: /health/started
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 5
              failureThreshold: 120
            volumeMounts:
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/theme.properties
                subPath: theme.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/template.ftl
                subPath: template.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/login.ftl
                subPath: login.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/resources/css/narwhal.css
                subPath: narwhal.css
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/logout-confirm.ftl
                subPath: logout-confirm.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_en.properties
                subPath: messages_en.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_ko.properties
                subPath: messages_ko.properties
        volumes:
          - name: keycloak-theme-narwhal
            configMap:
              name: keycloak-theme-narwhal
