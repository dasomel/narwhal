# Keycloak CR - Keycloak Operator가 관리
# Operator CRD+RBAC는 11-keycloak.sh에서 설치됨
# DB secret (keycloak-db-secret)은 11-keycloak.sh에서 생성됨
# 테마(login/admin) ConfigMap은 keycloak-theme.yaml, 소스는 chart의 keycloak-theme/ 디렉터리.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: iam
spec:
  instances: 1
  db:
    vendor: postgres
    host: narwhal-db-rw.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.{{ .Values.baseDomain }}
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  # First-class resources — the operator HONORS spec.resources but IGNORES resources set
  # under unsupported.podTemplate. The old config (podTemplate cpu 200m) was silently
  # dropped, so Keycloak ran with NO CPU request and got starved under node contention:
  # its 9000 health endpoint missed the 1s probe timeout -> liveness SIGKILL crash loop
  # -> keycloak-service endpoints emptied -> APISIX 502 on all SSO. A real CPU request fixes it.
  resources:
    requests:
      cpu: "600m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  unsupported:
    podTemplate:
      metadata:
        labels:
          istio.io/dataplane-mode: "none"
        annotations:
          # Keycloak caches theme files (templates, CSS, messages) for the life of the process, so a
          # theme change needs a restart. Any content change alters this hash and rolls the pod.
          checksum/keycloak-theme: '{{ include "narwhal-platform.keycloakThemeSum" . }}'
      spec:
        containers:
          - name: keycloak
            # Relaxed health probes (timeoutSeconds 1->5, failureThreshold 3->5) tolerate
            # transient GC/CPU spikes instead of false-positive killing under contention.
            # (Operator HONORS these podTemplate probes; CPU/memory go in spec.resources
            # above because podTemplate resources are ignored by the operator.)
            livenessProbe:
              httpGet:
                path: /health/live
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 15
              failureThreshold: 5
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 10
              failureThreshold: 5
            startupProbe:
              httpGet:
                path: /health/started
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 5
              failureThreshold: 120
            # The whole theme tree is one read-only mount (projected from two ConfigMaps, see
            # keycloak-theme.yaml). Directory mounts, unlike subPath mounts, follow ConfigMap updates.
            volumeMounts:
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal
                readOnly: true
        volumes:
          # The items list is literal on purpose: this file must stay valid YAML for the T2 mutation
          # check (yq edits the raw template). scripts/test/lib/check-keycloak-theme.py (R306) fails
          # if the list and the files under keycloak-theme/narwhal/ ever diverge.
          - name: keycloak-theme-narwhal
            projected:
              sources:
                - configMap:
                    name: keycloak-theme-narwhal
                    items:
                      - key: "narwhal__admin__resources__css__narwhal-admin.css"
                        path: "admin/resources/css/narwhal-admin.css"
                      - key: "narwhal__admin__resources__img__favicon.svg"
                        path: "admin/resources/img/favicon.svg"
                      - key: "narwhal__admin__resources__img__logo.svg"
                        path: "admin/resources/img/logo.svg"
                      - key: "narwhal__admin__theme.properties"
                        path: "admin/theme.properties"
                      - key: "narwhal__login__info.ftl"
                        path: "login/info.ftl"
                      - key: "narwhal__login__messages__messages_en.properties"
                        path: "login/messages/messages_en.properties"
                      - key: "narwhal__login__messages__messages_ko.properties"
                        path: "login/messages/messages_ko.properties"
                      - key: "narwhal__login__resources__css__narwhal.css"
                        path: "login/resources/css/narwhal.css"
                      - key: "narwhal__login__resources__fonts__OFL.txt"
                        path: "login/resources/fonts/OFL.txt"
                      - key: "narwhal__login__resources__img__narwhal-dark.svg"
                        path: "login/resources/img/narwhal-dark.svg"
                      - key: "narwhal__login__resources__img__narwhal-light.svg"
                        path: "login/resources/img/narwhal-light.svg"
                      - key: "narwhal__login__resources__js__narwhal.js"
                        path: "login/resources/js/narwhal.js"
                      - key: "narwhal__login__theme.properties"
                        path: "login/theme.properties"
                - configMap:
                    name: keycloak-theme-narwhal-assets
                    items:
                      - key: "narwhal__login__resources__fonts__Pretendard-Bold.subset.woff2"
                        path: "login/resources/fonts/Pretendard-Bold.subset.woff2"
                      - key: "narwhal__login__resources__fonts__Pretendard-Regular.subset.woff2"
                        path: "login/resources/fonts/Pretendard-Regular.subset.woff2"
                      - key: "narwhal__login__resources__img__favicon.ico"
                        path: "login/resources/img/favicon.ico"
