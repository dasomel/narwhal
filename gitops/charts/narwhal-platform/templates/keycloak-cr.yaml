# Keycloak CR - Keycloak Operator가 관리
# Operator CRD+RBAC는 11-keycloak.sh에서 설치됨
# DB secret (keycloak-db-secret)은 11-keycloak.sh에서 생성됨
---
apiVersion: v1
data:
  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password'); section>
        <#if section = "header">
            ${msg("loginAccountTitle")}
        <#elseif section = "form">
            <#if realm.password>
            <form id="kc-form-login" class="nw-form" action="${url.loginAction}" method="post">
                <div class="nw-field">
                    <label class="nw-label" for="username"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
                    <input id="username" class="nw-input" name="username" type="text" value="${(login.username!'')}" autofocus autocomplete="username"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <div class="nw-field">
                    <label class="nw-label" for="password">${msg("password")}</label>
                    <input id="password" class="nw-input" name="password" type="password" autocomplete="current-password"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <#if messagesPerField.existsError('username','password')>
                    <div class="nw-err" aria-live="polite">${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}</div>
                </#if>
                <#if (realm.rememberMe && !usernameHidden??) || realm.resetPasswordAllowed>
                <div class="nw-row">
                    <#if realm.rememberMe && !usernameHidden??>
                        <label class="nw-check"><input name="rememberMe" type="checkbox" <#if login.rememberMe??>checked</#if>/> ${msg("rememberMe")}</label>
                    <#else><span></span></#if>
                    <#if realm.resetPasswordAllowed>
                        <a class="nw-link" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                    </#if>
                </div>
                </#if>
                <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>
                <button class="nw-btn" name="login" id="kc-login" type="submit">${msg("doLogIn")}</button>
            </form>
            <script>
              // Explicit Enter handling. Implicit form submission exists, but the
              // first Enter is routinely swallowed by password-manager overlays and
              // by IME composition (isComposing / legacy keyCode 229 on Korean
              // input) — so wire it up deterministically: Enter on username moves
              // to password; Enter on password clicks the submit button (a real
              // click, so the button's name=login pair is included like a tap).
              (function () {
                var u = document.getElementById("username");
                var p = document.getElementById("password");
                var b = document.getElementById("kc-login");
                if (!u || !p || !b) return;
                function onEnter(e, act) {
                  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
                  e.preventDefault();
                  act();
                }
                u.addEventListener("keydown", function (e) { onEnter(e, function () { p.focus(); }); });
                p.addEventListener("keydown", function (e) { onEnter(e, function () { b.click(); }); });
              })();
            </script>
            </#if>
        <#elseif section = "info">
            <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
                <span>${msg("noAccount")} <a class="nw-link" href="${url.registrationUrl}">${msg("doRegister")}</a></span>
            </#if>
        </#if>
    </@layout.registrationLayout>
  messages_en.properties: |
    # Narwhal IDP Theme - English Messages
    loginAccountTitle=Sign in to your account
    loginTitle=Narwhal IDP
    doLogIn=Sign In
    usernameOrEmail=Username or email
    password=Password
    doForgotPassword=Forgot password?
    rememberMe=Remember me
    invalidUserMessage=Invalid username or password.
  messages_ko.properties: |
    # Narwhal IDP Theme - Korean Messages
    loginAccountTitle=계정에 로그인하세요
    loginTitle=Narwhal IDP
    doLogIn=로그인
    usernameOrEmail=사용자명 또는 이메일
    password=비밀번호
    doForgotPassword=비밀번호를 잊으셨나요?
    rememberMe=로그인 유지
    invalidUserMessage=잘못된 사용자명 또는 비밀번호입니다.
  narwhal.css: |
    /* ==========================================================================
       Narwhal IDP — "Aurora Glacial" Keycloak login theme, dual-mode.
       Theme follows the portal: template.ftl reads the shared `narwhal-theme`
       cookie (domain=.local.narwhal.internal) and sets html.nw-dark; no cookie →
       light, matching the portal default.
         :root        = Glacial Day  (pale ice sky, pastel aurora, white frost card)
         html.nw-dark = Aurora Glacial (arctic night, luminous aurora, dark frost)
       Every color lives in a custom property — templates use .nw-* hooks only.
       Renders against custom template.ftl / login.ftl / logout-confirm.ftl /
       info.ftl (no PatternFly). Airgap/CSP-safe: system fonts, no external assets.
       ========================================================================== */
    :root {
      /* Glacial Day */
      --nw-bg: #eef3fa;
      --nw-fg: #10233f;
      --nw-muted: #5b6c87;
      --nw-faint: #8598b5;
      --nw-border: rgba(13, 38, 76, 0.10);
      --nw-border-strong: rgba(13, 38, 76, 0.18);
      --nw-teal: #0d9488;
      --nw-cyan: #0891b2;
      --nw-emerald: #059669;
      --nw-violet: #7c3aed;
      --nw-ring: rgba(13, 148, 136, 0.25);
      --nw-radius: 12px;
      --nw-sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Display",
        "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --nw-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Cascadia Code",
        "Roboto Mono", monospace;

      --nw-aurora-1: rgba(13, 148, 136, 0.16);
      --nw-aurora-2: rgba(5, 150, 105, 0.12);
      --nw-aurora-3: rgba(124, 58, 237, 0.12);
      --nw-ocean-glow: rgba(186, 215, 247, 0.85);
      --nw-ocean-fade: rgba(238, 243, 250, 0);
      --nw-ocean-deep: #e3ecf8;

      --nw-card-bg-top: rgba(255, 255, 255, 0.82);
      --nw-card-bg-bot: rgba(250, 253, 255, 0.72);
      --nw-card-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 30px 70px -25px rgba(30, 64, 120, 0.35),
        0 0 60px -30px rgba(13, 148, 136, 0.25);

      --nw-title: #0b1c33;
      --nw-label: #47607f;
      --nw-logo-fg: #04121a;
      --nw-logo-eye: #eef3fa;
      --nw-btn-grad-a: #14b8a6;
      --nw-btn-grad-b: #06b6d4;
      --nw-btn-fg: #04121a;
      --nw-btn-shadow: rgba(8, 145, 178, 0.45);
      --nw-input-bg: rgba(13, 38, 76, 0.03);
      --nw-input-bg-focus: rgba(13, 148, 136, 0.05);
      --nw-input-border-hover: rgba(13, 38, 76, 0.30);
      --nw-placeholder: #93a5be;
      --nw-ghost-bg: rgba(13, 38, 76, 0.04);
      --nw-ghost-bg-hover: rgba(13, 38, 76, 0.08);

      --nw-err: #be123c;
      --nw-alert-bg: rgba(13, 38, 76, 0.03);
      --nw-alert-error-bg: rgba(225, 29, 72, 0.08);
      --nw-alert-error-bd: rgba(225, 29, 72, 0.35);
      --nw-alert-error-fg: #be123c;
      --nw-alert-success-bg: rgba(5, 150, 105, 0.10);
      --nw-alert-success-bd: rgba(5, 150, 105, 0.35);
      --nw-alert-success-fg: #047857;
      --nw-alert-warning-bg: rgba(217, 119, 6, 0.10);
      --nw-alert-warning-bd: rgba(217, 119, 6, 0.35);
      --nw-alert-warning-fg: #b45309;
      --nw-alert-info-bg: rgba(13, 148, 136, 0.08);
      --nw-alert-info-bd: rgba(13, 148, 136, 0.35);
      --nw-alert-info-fg: #0f766e;

      --nw-wave-1: #93c5fd;
      --nw-wave-2: #bfdbfe;
      --nw-wave-3: #dbeafe;
    }

    html.nw-dark {
      /* Aurora Glacial */
      --nw-bg: #060a14;
      --nw-fg: #eaf1fb;
      --nw-muted: #8ea2be;
      --nw-faint: #5f739a;
      --nw-border: rgba(148, 176, 214, 0.16);
      --nw-border-strong: rgba(148, 176, 214, 0.28);
      --nw-teal: #2dd4bf;
      --nw-cyan: #22d3ee;
      --nw-emerald: #34d399;
      --nw-violet: #a78bfa;
      --nw-ring: rgba(45, 212, 191, 0.30);

      --nw-aurora-1: rgba(45, 212, 191, 0.26);
      --nw-aurora-2: rgba(52, 211, 153, 0.22);
      --nw-aurora-3: rgba(167, 139, 250, 0.24);
      --nw-ocean-glow: rgba(8, 47, 73, 0.9);
      --nw-ocean-fade: rgba(6, 10, 20, 0);
      --nw-ocean-deep: #05080f;

      --nw-card-bg-top: rgba(18, 27, 45, 0.72);
      --nw-card-bg-bot: rgba(11, 18, 32, 0.78);
      --nw-card-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 30px 70px -20px rgba(2, 6, 16, 0.85),
        0 0 60px -30px rgba(45, 212, 191, 0.35);

      --nw-title: #f4f8ff;
      --nw-label: #a7bad6;
      --nw-logo-fg: #04121a;
      --nw-logo-eye: #0b1220;
      --nw-btn-grad-a: #2dd4bf;
      --nw-btn-grad-b: #22d3ee;
      --nw-btn-fg: #04121a;
      --nw-btn-shadow: rgba(34, 211, 238, 0.6);
      --nw-input-bg: rgba(255, 255, 255, 0.035);
      --nw-input-bg-focus: rgba(45, 212, 191, 0.05);
      --nw-input-border-hover: rgba(148, 176, 214, 0.4);
      --nw-placeholder: #566b8c;
      --nw-ghost-bg: rgba(255, 255, 255, 0.04);
      --nw-ghost-bg-hover: rgba(255, 255, 255, 0.07);

      --nw-err: #fda4af;
      --nw-alert-bg: rgba(255, 255, 255, 0.03);
      --nw-alert-error-bg: rgba(244, 63, 94, 0.12);
      --nw-alert-error-bd: rgba(244, 63, 94, 0.4);
      --nw-alert-error-fg: #fda4af;
      --nw-alert-success-bg: rgba(52, 211, 153, 0.12);
      --nw-alert-success-bd: rgba(52, 211, 153, 0.4);
      --nw-alert-success-fg: #6ee7b7;
      --nw-alert-warning-bg: rgba(251, 191, 36, 0.12);
      --nw-alert-warning-bd: rgba(251, 191, 36, 0.4);
      --nw-alert-warning-fg: #fcd34d;
      --nw-alert-info-bg: rgba(45, 212, 191, 0.12);
      --nw-alert-info-bd: rgba(45, 212, 191, 0.4);
      --nw-alert-info-fg: #5eead4;

      --nw-wave-1: #0e7490;
      --nw-wave-2: #155e75;
      --nw-wave-3: #083344;
    }

    * { box-sizing: border-box; }

    .nw-body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--nw-fg);
      background: var(--nw-bg);
      font-family: var(--nw-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Aurora field: drifting luminous ribbons across the sky. */
    .nw-body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 78%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(46rem 30rem at 22% 0%, var(--nw-aurora-1) 0%, transparent 60%),
        radial-gradient(40rem 28rem at 70% 6%, var(--nw-aurora-2) 0%, transparent 58%),
        radial-gradient(52rem 34rem at 92% 0%, var(--nw-aurora-3) 0%, transparent 62%);
      filter: blur(6px) saturate(115%);
      animation: nw-aurora 22s ease-in-out infinite alternate;
    }

    /* Ocean glow anchoring the composition at the bottom. */
    .nw-body::after {
      content: "";
      position: fixed;
      inset: auto -10% -25% -10%;
      height: 55%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60rem 26rem at 50% 100%, var(--nw-ocean-glow) 0%, transparent 70%),
        linear-gradient(180deg, var(--nw-ocean-fade) 0%, var(--nw-ocean-deep) 92%);
    }

    @keyframes nw-aurora {
      0%   { transform: translateX(-3%) translateY(0) scale(1.02); opacity: 0.9; }
      50%  { transform: translateX(3%)  translateY(-2%) scale(1.06); opacity: 1; }
      100% { transform: translateX(-2%) translateY(1%) scale(1.03); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nw-body::before { animation: none; }
    }

    /* far-north ice shelf near the bottom (SVG in template.ftl, fills below) */
    .nw-waves {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 190px;
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }
    .nw-wave-1 { fill: var(--nw-wave-1); fill-opacity: 0.28; }
    .nw-wave-2 { fill: var(--nw-wave-2); fill-opacity: 0.34; }
    .nw-wave-3 { fill: var(--nw-wave-3); fill-opacity: 0.5; }

    .nw-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 396px;
      padding: 40px 34px 26px;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--nw-card-bg-top) 0%, var(--nw-card-bg-bot) 100%);
      border: 1px solid var(--nw-border);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
      backdrop-filter: blur(22px) saturate(130%);
      box-shadow: var(--nw-card-shadow);
      animation: nw-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes nw-rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    /* aurora hairline across the top of the card */
    .nw-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg,
        transparent 0%, var(--nw-teal) 22%, var(--nw-emerald) 50%, var(--nw-violet) 78%, transparent 100%);
      opacity: 0.85;
    }

    .nw-head { text-align: center; margin-bottom: 28px; }

    .nw-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 66px;
      margin-bottom: 18px;
      color: var(--nw-logo-fg);
      background: linear-gradient(135deg, var(--nw-btn-grad-a) 0%, var(--nw-btn-grad-b) 55%, var(--nw-emerald) 100%);
      border-radius: 21px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 12px 30px -8px var(--nw-btn-shadow);
    }
    .nw-whale { width: 42px; height: 31px; display: block; }
    .nw-whale .nw-eye { fill: var(--nw-logo-eye); }

    .nw-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--nw-title);
    }

    .nw-sub {
      margin: 8px 0 0;
      font-size: 13.5px;
      color: var(--nw-muted);
    }

    .nw-form { display: flex; flex-direction: column; gap: 17px; }

    .nw-field { display: flex; flex-direction: column; gap: 7px; }

    .nw-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--nw-label);
      font-family: var(--nw-mono);
    }

    .nw-input {
      height: 46px;
      width: 100%;
      padding: 0 15px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--nw-fg);
      background: var(--nw-input-bg);
      border: 1px solid var(--nw-border-strong);
      border-radius: var(--nw-radius);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }
    .nw-input::placeholder { color: var(--nw-placeholder); }
    .nw-input:hover { border-color: var(--nw-input-border-hover); }
    .nw-input:focus {
      border-color: var(--nw-teal);
      background: var(--nw-input-bg-focus);
      box-shadow: 0 0 0 3px var(--nw-ring);
    }

    .nw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--nw-muted);
      margin-top: -3px;
    }
    .nw-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .nw-check input { width: 15px; height: 15px; accent-color: var(--nw-teal); }

    .nw-link {
      color: var(--nw-teal);
      text-decoration: none;
      font-weight: 600;
    }
    .nw-link:hover { color: var(--nw-emerald); text-decoration: underline; text-underline-offset: 2px; }

    /* Primary action — used by BOTH the login and logout-confirm buttons. */
    .nw-btn {
      height: 46px;
      width: 100%;
      margin-top: 4px;
      border: none;
      border-radius: var(--nw-radius);
      cursor: pointer;
      color: var(--nw-btn-fg);
      background: linear-gradient(135deg, var(--nw-btn-grad-a) 0%, var(--nw-btn-grad-b) 100%);
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 26px -10px var(--nw-btn-shadow);
      transition: transform 0.05s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .nw-btn:hover { filter: brightness(1.06); box-shadow: 0 14px 32px -8px var(--nw-btn-shadow); }
    .nw-btn:active { transform: translateY(1px); }
    .nw-btn:focus-visible { outline: 2px solid var(--nw-emerald); outline-offset: 2px; }

    /* Secondary action — quieter, glassy (e.g. "cancel" on logout). */
    .nw-btn-ghost {
      height: 46px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--nw-radius);
      cursor: pointer;
      color: var(--nw-fg);
      text-decoration: none;
      background: var(--nw-ghost-bg);
      border: 1px solid var(--nw-border-strong);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: border-color 0.16s ease, background 0.16s ease;
    }
    .nw-btn-ghost:hover { border-color: var(--nw-input-border-hover); background: var(--nw-ghost-bg-hover); }

    .nw-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

    .nw-alert {
      font-size: 13px;
      line-height: 1.45;
      padding: 11px 13px;
      border-radius: var(--nw-radius);
      margin-bottom: 18px;
      border: 1px solid transparent;
      background: var(--nw-alert-bg);
    }
    .nw-alert-error   { background: var(--nw-alert-error-bg);   border-color: var(--nw-alert-error-bd);   color: var(--nw-alert-error-fg); }
    .nw-alert-success { background: var(--nw-alert-success-bg); border-color: var(--nw-alert-success-bd); color: var(--nw-alert-success-fg); }
    .nw-alert-warning { background: var(--nw-alert-warning-bg); border-color: var(--nw-alert-warning-bd); color: var(--nw-alert-warning-fg); }
    .nw-alert-info    { background: var(--nw-alert-info-bg);    border-color: var(--nw-alert-info-bd);    color: var(--nw-alert-info-fg); }

    .nw-err { font-size: 12px; color: var(--nw-err); margin-top: -8px; }

    .nw-info {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--nw-border);
      text-align: center;
      font-size: 13px;
      color: var(--nw-muted);
    }

    /* Centered body copy on info/logout pages. */
    .nw-note {
      margin: 0 0 6px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: var(--nw-fg);
    }
    .nw-note-sub {
      margin: 2px 0 10px;
      text-align: center;
      font-size: 12.5px;
      color: var(--nw-muted);
    }

    .nw-foot {
      margin: 24px 0 0;
      text-align: center;
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--nw-faint);
      font-family: var(--nw-mono);
    }
  template.ftl: |
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false>
    <!DOCTYPE html>
    <html lang="${(locale.currentLanguageTag)!'en'}">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <meta name="robots" content="noindex, nofollow"/>
      <title>Narwhal IDP</title>
      <script>
        // Follow the portal's theme: the portal writes `narwhal-theme` on the shared
        // parent domain (.local.narwhal.internal). No cookie -> light (portal default).
        // Runs synchronously before first paint, so there is no theme flash.
        (function () {
          var m = document.cookie.match(/(?:^|;\s*)narwhal-theme=(dark|light)/);
          if (m && m[1] === "dark") document.documentElement.classList.add("nw-dark");
        })();
      </script>
      <#if properties.styles?has_content>
        <#list properties.styles?split(' ') as style>
          <link href="${url.resourcesPath}/${style}" rel="stylesheet"/>
        </#list>
      </#if>
    </head>
    <body class="nw-body">
      <#-- arctic-ocean horizon under the aurora; fills are themed via CSS classes -->
      <svg class="nw-waves" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path class="nw-wave-1" d="M0 96 C240 140 480 52 720 84 C960 116 1200 150 1440 92 L1440 200 L0 200 Z"/>
        <path class="nw-wave-2" d="M0 128 C240 104 480 158 720 124 C960 92 1200 138 1440 124 L1440 200 L0 200 Z"/>
        <path class="nw-wave-3" d="M0 158 C260 138 520 176 760 158 C1000 140 1220 168 1440 156 L1440 200 L0 200 Z"/>
      </svg>

      <main class="nw-card">
        <header class="nw-head">
          <span class="nw-logo" aria-hidden="true">
            <svg class="nw-whale" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <#-- spiral tusk -->
              <line x1="42" y1="19" x2="62" y2="3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.7">
                <line x1="45" y1="16.5" x2="47.6" y2="18.4"/>
                <line x1="49" y1="13.5" x2="51.6" y2="15.4"/>
                <line x1="53" y1="10.5" x2="55.6" y2="12.4"/>
                <line x1="57" y1="7.5" x2="59.6" y2="9.4"/>
              </g>
              <#-- water spout -->
              <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
                <line x1="13" y1="14" x2="13" y2="9"/>
                <line x1="10" y1="15" x2="8.5" y2="11"/>
                <line x1="16" y1="15" x2="17.5" y2="11"/>
              </g>
              <#-- body -->
              <path d="M7 29 C7 19 19 15 31 17 C41 18.6 47 23 46 30 C45.3 35 39 37.6 31 37.2 C21 36.6 13 36.6 9 33.6 C7.6 32.5 7 31 7 29 Z" fill="currentColor"/>
              <#-- tail fluke -->
              <path d="M7 29 L0 23 L3.5 29 L0 35 Z" fill="currentColor"/>
              <#-- pectoral fin -->
              <path d="M23 36.8 C24 41.6 26 43.6 27 43.6 C27 40.6 27 38.6 28 36.6 Z" fill="currentColor" opacity="0.85"/>
              <#-- eye (fill themed via CSS) -->
              <circle class="nw-eye" cx="17" cy="27" r="1.8"/>
            </svg>
          </span>
          <h1 class="nw-title">Narwhal IDP</h1>
          <p class="nw-sub"><#nested "header"></p>
        </header>

        <#if displayMessage && message?? && message.summary?has_content>
          <div class="nw-alert nw-alert-${message.type}">
            <span>${kcSanitize(message.summary)?no_esc}</span>
          </div>
        </#if>

        <#nested "form">

        <#if displayInfo>
          <div class="nw-info"><#nested "info"></div>
        </#if>

        <p class="nw-foot">Internal Developer Platform</p>
      </main>
    </body>
    </html>
    </#macro>
  theme.properties: |
    # Narwhal IDP — clean shadcn login theme (custom templates, no PatternFly)
    parent=keycloak.v2
    import=common/keycloak
    styles=css/narwhal.css
    locales=en,ko
  logout-confirm.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout; section>
        <#if section = "header">
            ${msg("logoutConfirmTitle")}
        <#elseif section = "form">
            <div id="kc-logout-confirm" class="nw-form">
                <p class="nw-note">${msg("logoutConfirmHeader")}</p>
                <form class="nw-form" action="${url.logoutConfirmAction}" method="POST">
                    <input type="hidden" name="session_code" value="${logoutConfirm.code}"/>
                    <div class="nw-actions">
                        <button class="nw-btn" name="confirmLogout" id="kc-logout" type="submit">${msg("doLogout")}</button>
                        <#if (!logoutConfirm.skipLink) && client?? && client.baseUrl?has_content>
                            <a class="nw-btn-ghost" href="${client.baseUrl}">${msg("backToApplication")}</a>
                        </#if>
                    </div>
                </form>
            </div>
        </#if>
    </@layout.registrationLayout>
  info.ftl: |
    <#import "template.ftl" as layout>
    <#-- Themed info page. For the logout-success case Keycloak lands here with no
         redirect target and the stock page is a dead end — detect it (localized
         message comparison works for both en/ko) and auto-continue to the portal
         login after a short pause, deriving the portal host from this host so the
         template stays domain-agnostic. Other info pages (required actions, email
         verification, …) keep their links and are never auto-redirected. -->
    <#assign isLogoutSuccess = message?? && message.summary?has_content
      && (message.summary == msg("successLogout")
          || message.summary?contains("로그아웃")
          || message.summary?lower_case?contains("logged out"))>
    <@layout.registrationLayout displayMessage=false; section>
        <#if section = "header">
            <#if messageHeader??>${kcSanitize(messageHeader)?no_esc}<#elseif message??>${kcSanitize(message.summary)?no_esc}</#if>
        <#elseif section = "form">
            <div id="kc-info-message" class="nw-form">
                <#if message?? && message.summary?has_content && messageHeader??>
                  <p class="nw-note">${kcSanitize(message.summary)?no_esc}<#if requiredActions??><#list requiredActions><b><#items as reqActionItem>${kcSanitize(msg("requiredAction.${reqActionItem}"))?no_esc}<#sep>, </#items></b></#list></#if></p>
                </#if>
                <div class="nw-actions">
                  <#if pageRedirectUri?has_content>
                    <a class="nw-btn" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;" href="${pageRedirectUri}">${kcSanitize(msg("backToApplication"))?no_esc}</a>
                  <#elseif actionUri?has_content>
                    <a class="nw-btn" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;" href="${actionUri}">${kcSanitize(msg("proceedWithAction"))?no_esc}</a>
                  <#elseif (client.baseUrl)?has_content>
                    <a class="nw-btn-ghost" href="${client.baseUrl}">${kcSanitize(msg("backToApplication"))?no_esc}</a>
                  </#if>
                  <#if isLogoutSuccess && !(actionUri?has_content)>
                    <p class="nw-note-sub" id="nw-auto-note" aria-live="polite"></p>
                    <script>
                      // Logged out with nowhere to go — continue to the portal login
                      // automatically (portal /login self-starts the Keycloak flow).
                      (function () {
                        var portal = "https://" + location.hostname.replace(/^[^.]+/, "portal") + "/login";
                        var note = document.getElementById("nw-auto-note");
                        if (note) note.textContent = "Redirecting to portal login…";
                        setTimeout(function () { location.replace(portal); }, 1500);
                      })();
                    </script>
                  </#if>
                </div>
            </div>
        </#if>
    </@layout.registrationLayout>
kind: ConfigMap
metadata:
  name: keycloak-theme-narwhal
  namespace: iam
  labels:
    app: keycloak
    component: theme
    theme: narwhal
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: iam
spec:
  instances: 1
  db:
    vendor: postgres
    host: narwhal-db-rw.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.{{ .Values.baseDomain }}
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  # First-class resources — the operator HONORS spec.resources but IGNORES resources set
  # under unsupported.podTemplate. The old config (podTemplate cpu 200m) was silently
  # dropped, so Keycloak ran with NO CPU request and got starved under node contention:
  # its 9000 health endpoint missed the 1s probe timeout -> liveness SIGKILL crash loop
  # -> keycloak-service endpoints emptied -> APISIX 502 on all SSO. A real CPU request fixes it.
  resources:
    requests:
      cpu: "600m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  unsupported:
    podTemplate:
      metadata:
        labels:
          istio.io/dataplane-mode: "none"
      spec:
        containers:
          - name: keycloak
            # Relaxed health probes (timeoutSeconds 1->5, failureThreshold 3->5) tolerate
            # transient GC/CPU spikes instead of false-positive killing under contention.
            # (Operator HONORS these podTemplate probes; CPU/memory go in spec.resources
            # above because podTemplate resources are ignored by the operator.)
            livenessProbe:
              httpGet:
                path: /health/live
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 15
              failureThreshold: 5
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 10
              failureThreshold: 5
            startupProbe:
              httpGet:
                path: /health/started
                port: 9000
              timeoutSeconds: 5
              periodSeconds: 5
              failureThreshold: 120
            volumeMounts:
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/theme.properties
                subPath: theme.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/template.ftl
                subPath: template.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/login.ftl
                subPath: login.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/resources/css/narwhal.css
                subPath: narwhal.css
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/logout-confirm.ftl
                subPath: logout-confirm.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/info.ftl
                subPath: info.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_en.properties
                subPath: messages_en.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_ko.properties
                subPath: messages_ko.properties
        volumes:
          - name: keycloak-theme-narwhal
            configMap:
              name: keycloak-theme-narwhal
