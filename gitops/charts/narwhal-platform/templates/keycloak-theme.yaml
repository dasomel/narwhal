# Keycloak themes "narwhal" (login + admin), delivered as ConfigMaps and mounted by the Keycloak CR
# (keycloak-cr.yaml) at /opt/keycloak/themes/narwhal. Source of truth is the chart's
# keycloak-theme/narwhal/ tree; nothing here is hand-maintained.
#   keycloak-theme-narwhal         text files (theme.properties, ftl, css, js, svg, messages)
#   keycloak-theme-narwhal-assets  binary files (Pretendard subset woff2, favicon.ico)
# Split in two so each stays under the 1 MiB object limit with room to grow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-narwhal
  namespace: iam
  labels:
    app: keycloak
    component: theme
    theme: narwhal
data:
{{- range $path, $_ := .Files.Glob "keycloak-theme/narwhal/**" }}
{{- if not (include "narwhal-platform.keycloakThemeIsBinary" $path) }}
  {{ include "narwhal-platform.keycloakThemeKey" $path | quote }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-narwhal-assets
  namespace: iam
  labels:
    app: keycloak
    component: theme
    theme: narwhal
binaryData:
{{- range $path, $_ := .Files.Glob "keycloak-theme/narwhal/**" }}
{{- if include "narwhal-platform.keycloakThemeIsBinary" $path }}
  {{ include "narwhal-platform.keycloakThemeKey" $path | quote }}: {{ $.Files.Get $path | b64enc }}
{{- end }}
{{- end }}
