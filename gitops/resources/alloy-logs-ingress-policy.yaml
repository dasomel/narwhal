---
# D-ALLOY-OTLP-INGRESS (#735): restrict alloy-logs OTLP trace ingest (4317/4318) to
# Grafana (self-tracing) and namespaces explicitly opted in via narwhal.io/otlp-ingest: "true",
# while preserving Prometheus metrics scraping (:12345).
#   - 08-2-monitoring.sh applies this policy before installing k8s-monitoring so the
#     collector's receivers never open unguarded during bootstrap; ArgoCD later adopts it
#     via the alloy-logs-ingress-policy Application.
#   - k8s-monitoring-alloy-logs Service sets istio.io/use-waypoint: none and monitoring/waypoint
#     is NOT allowed here.
#   - Grafana and Prometheus (platform components inside ambient-enrolled monitoring) keep
#     TCP 15008 (HBONE); note that HBONE grants those two peers access to every port of the
#     alloy-logs pod (acceptable for Grafana and Prometheus).
#   - Opted-in namespaces (narwhal.io/otlp-ingest: "true") intentionally omit TCP 15008
#     (narrow R200 exception): admitting HBONE 15008 there would let ambient-enrolled tenant
#     pods tunnel to :12345 (/metrics). Tenant namespaces sending traces must stay
#     non-ambient (istio.io/dataplane-mode: none, like dev) until an L4 AuthorizationPolicy
#     scoped to OTLP ports is added and sender pod IP visibility is verified.
#   - Kubelet /-/ready probes (:12345) arrive via 169.254.7.127/32 CCNP (allow-ambient-kubelet-probes);
#     config-reloader runs as a sidecar inside the same Pod (localhost:12345); alloy-operator
#     watches only the Kubernetes API.
#   - Escape hatch: add label narwhal.io/otlp-ingest: "true" on an opted-in non-ambient
#     Namespace, or delete this policy to restore cluster-wide OTLP access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-logs-ingress-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
      app.kubernetes.io/instance: k8s-monitoring-alloy-logs
  policyTypes:
    - Ingress
  ingress:
    # 1. Grafana (monitoring) -> alloy-logs OTLP gRPC self-tracing (4317).
    #    HBONE 15008 is kept for this ambient platform peer (grants every port of the pod).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: prometheus-stack
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 15008
    # 2. Explicitly opted-in non-ambient namespaces -> alloy-logs plain-TCP OTLP ingest (4317/4318).
    #    TCP 15008 is omitted so HBONE cannot bypass port scoping to reach :12345.
    - from:
        - namespaceSelector:
            matchLabels:
              narwhal.io/otlp-ingest: "true"
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # 3. Prometheus (monitoring) -> alloy-logs HTTP metrics scrape (12345).
    #    HBONE 15008 is kept for this ambient platform peer (grants every port of the pod).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 12345
        - protocol: TCP
          port: 15008
