---
# ExternalName services in platform-system for APISIX cross-namespace routing
# ApisixRoute v2 does not support serviceNamespace in backends —
# all backend services must be in the same namespace as the ApisixRoute (platform-system).
# These ExternalName services proxy to the actual services in their respective namespaces.

# Authentik (iam namespace)
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: platform-system
spec:
  type: ExternalName
  externalName: authentik-server.iam.svc.cluster.local
  ports:
    - port: 9000
---
# ArgoCD (devtools namespace)
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: platform-system
spec:
  type: ExternalName
  externalName: argocd-server.devtools.svc.cluster.local
  ports:
    - port: 80
---
