---
# ExternalName services in platform-system for APISIX cross-namespace routing
# ApisixRoute v2 does not support serviceNamespace in backends —
# all backend services must be in the same namespace as the ApisixRoute (platform-system).
# These ExternalName services proxy to the actual services in their respective namespaces.

# Authentik (iam namespace)
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: platform-system
spec:
  type: ExternalName
  externalName: authentik-server.iam.svc.cluster.local
  ports:
    - port: 9000
---
# ArgoCD (devtools namespace)
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: platform-system
spec:
  type: ExternalName
  externalName: argocd-server.devtools.svc.cluster.local
  ports:
    - port: 80
---
# Grafana (monitoring namespace)
apiVersion: v1
kind: Service
metadata:
  name: prometheus-stack-grafana
  namespace: platform-system
spec:
  type: ExternalName
  externalName: prometheus-stack-grafana.monitoring.svc.cluster.local
  ports:
    - port: 80
---
# Gitea (devtools namespace)
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: platform-system
spec:
  type: ExternalName
  externalName: gitea-http.devtools.svc.cluster.local
  ports:
    - port: 3000
---
# Harbor (devtools namespace)
apiVersion: v1
kind: Service
metadata:
  name: harbor-nginx
  namespace: platform-system
spec:
  type: ExternalName
  externalName: harbor-nginx.devtools.svc.cluster.local
  ports:
    - port: 80
---
# Headlamp (devtools namespace)
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: platform-system
spec:
  type: ExternalName
  externalName: headlamp.devtools.svc.cluster.local
  ports:
    - port: 80
---
# OpenBao (storage namespace)
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: platform-system
spec:
  type: ExternalName
  externalName: openbao.storage.svc.cluster.local
  ports:
    - port: 8200
---
# Hubble UI (kube-system namespace)
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui
  namespace: platform-system
spec:
  type: ExternalName
  externalName: hubble-ui.kube-system.svc.cluster.local
  ports:
    - port: 80
---
# Velero UI (storage namespace)
apiVersion: v1
kind: Service
metadata:
  name: velero-ui
  namespace: platform-system
spec:
  type: ExternalName
  externalName: velero-ui.storage.svc.cluster.local
  ports:
    - port: 3000
