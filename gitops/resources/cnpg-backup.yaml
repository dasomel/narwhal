# CNPG Scheduled Backup Configuration
# Backup storage is configured in each Cluster spec (barmanObjectStore → SeaweedFS S3)
---
# Keycloak DB Scheduled Backup
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
  namespace: keycloak
spec:
  schedule: "0 0 * * *"  # Daily at midnight
  backupOwnerReference: self
  cluster:
    name: keycloak-db
  method: barmanObjectStore
  target: prefer-standby
---
# Gitea DB Scheduled Backup
apiVersion: postgresql.cnpg.io/v1
