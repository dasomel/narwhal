# CNPG Scheduled Backup Configuration
# Unified narwhal-db cluster backup (replaces individual DB backups)
# Backup storage is configured in Cluster spec (barmanObjectStore -> SeaweedFS S3)
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: narwhal-db-daily
  namespace: database
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  backupOwnerReference: self
  cluster:
    name: narwhal-db
  method: barmanObjectStore
  target: prefer-standby
