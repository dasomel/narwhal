# NetworkPolicy: default-deny ingress for the `database` namespace (CloudNative-PG),
# with an explicit allow-list for every verified caller.
#
# Part of narwhal#190 (OpenForge Zero Trust Baseline, dasomel/openforge#77): the
# baseline's own checklist calls for "namespace/workload default-deny ingress and
# egress with explicit DNS/service/dependency allows". `database` is the highest-value
# first target — it holds every platform app's PostgreSQL data (authentik/keycloak,
# harbor, gitea) — and, unlike `iam`/`devtools`/`monitoring`/`storage`
# (network-policies.yaml), it had NO NetworkPolicy at all before this change: any pod
# anywhere in the cluster could open a TCP connection to narwhal-db. This closes that
# gap for ingress; egress is intentionally left alone (see network-policies.yaml's own
# header: default-deny egress previously conflicted with Cilium in this cluster, so
# re-tightening egress is tracked as separate, later work, not bundled in here).
#
# Callers, each verified against this repo rather than assumed (git grep for
# `narwhal-db` / `database.svc` / `narwhal-db-rw`):
#   1. CNPG instances (same namespace) - `narwhal-db` Cluster (gitops/resources/narwhal-db.yaml,
#      scripts/cluster/07-cnpg.sh) - 2-instance HA cluster; streaming replication (5432)
#      and the CNPG instance manager's status/leader-election API (8000) both run
#      pod-to-pod within this namespace.
#   2. CNPG operator - platform-system, app.kubernetes.io/name=cloudnative-pg
#      (scripts/cluster/07-cnpg.sh helm install --namespace platform-system) - the
#      operator calls each instance's instance-manager REST API (8000) directly for
#      reconciliation/status/promotion, separately from the kube-apiserver watch path.
#   3. Keycloak - iam namespace, via the `authentik-db-rw` ExternalName Service
#      (narwhal-db.yaml) which resolves to narwhal-db-rw.database.svc; the actual pod
#      selector is the CNPG-operator-managed Keycloak StatefulSet
#      (app.kubernetes.io/instance=keycloak) (scripts/cluster/11-keycloak.sh).
#   4. Harbor DB - devtools namespace, via `harbor-db-rw` ExternalName Service
#      (narwhal-db.yaml, scripts/cluster/08-5-registry.sh) - matches Harbor's core/jobservice
#      pods (app=harbor).
#   5. Gitea - devtools namespace, via `gitea-db-rw` ExternalName Service
#      (narwhal-db.yaml, scripts/cluster/12-gitea.sh) - matches
#      app.kubernetes.io/name=gitea (same selector gitea-ingress-policy.yaml already uses).
#   6. Prometheus - monitoring namespace, app.kubernetes.io/name=prometheus
#      (scripts/cluster/08-2-monitoring.sh, gitops/charts/narwhal-apps/templates/prometheus-stack.yaml) -
#      scrapes CNPG metrics exporter on TCP 9187 on narwhal-db pods (cnpg.io/cluster=narwhal-db).
#
# NOT allowed here (checked, not assumed): narwhal-portal does not talk to Postgres
# directly (no narwhal-db/DATABASE_URL reference in gitops/charts/narwhal-platform's
# portal manifest). Backups go outward over the barman S3 endpoint (egress, not
# covered here), so no ingress rule from `storage` is needed either.
#
# Live verification (2026-09-28, narwhal#235): with the ambient probe CCNP and the
# per-rule TCP 15008 allowances applied, and every mitigation removed, CNPG reported
# "Cluster in healthy state" and kubelet probes on :8000 passed; Keycloak (which needs the
# DB to start) came up, and the Keycloak/Gitea/Harbor/ArgoCD web endpoints answered 302.
# Per-caller DB connections were not traced individually. Roll back by deleting this
# NetworkPolicy (`kubectl delete -n database networkpolicy database-default-deny-ingress`)
# if instances go NotReady or a caller starts failing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-default-deny-ingress
  namespace: database
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Same-namespace CNPG instance-to-instance traffic (replication + instance manager).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 15008
    # 2. CNPG operator (platform-system) - instance manager status/reconciliation API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 15008
    # 3. Keycloak (iam) - authentik-db-rw -> narwhal-db-rw.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iam
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    # 4. Harbor (devtools) - harbor-db-rw -> narwhal-db-rw.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devtools
          podSelector:
            matchLabels:
              app: harbor
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    # 5. Gitea (devtools) - gitea-db-rw -> narwhal-db-rw.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devtools
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
---
# 6. Prometheus (monitoring) - scrape CNPG metrics exporter (:9187).
# D-CNPG-MON-INGRESS (#600, PR #602): Prometheus scrapes CNPG metrics exporter.
# Narrowly scoped: from namespace monitoring (app.kubernetes.io/name=prometheus),
# to narwhal-db pods (cnpg.io/cluster=narwhal-db), TCP 9187 only (+ ambient HBONE 15008 per R200).
# Cost: exposes exporter port 9187 to Prometheus pods in monitoring namespace.
# Escape hatch: remove this rule or disable enablePodMonitor in narwhal-db.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-prometheus-ingress
  namespace: database
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: narwhal-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 15008
