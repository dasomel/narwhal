apiVersion: v1
kind: ConfigMap
metadata:
  name: narwhal-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  narwhal-overview.json: |
    {
      "title": "Narwhal IDP Overview",
      "uid": "narwhal-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "클러스터 노드 상태",
          "description": "Ready 상태인 노드 수 / 전체 노드 수",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 4 },
                  { "color": "green", "value": 6 }
                ]
              },
              "unit": "short",
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1)",
              "legendFormat": "Ready 노드",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "노드 CPU 사용률",
          "description": "전체 노드 평균 CPU 사용률 (%)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU 사용률",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "노드 메모리 사용률",
          "description": "전체 노드 평균 메모리 사용률 (%)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - (avg(node_memory_MemAvailable_bytes) / avg(node_memory_MemTotal_bytes)))",
              "legendFormat": "메모리 사용률",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "노드 디스크 사용률",
          "description": "루트 파티션 평균 디스크 사용률 (%)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - (avg(node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"}) / avg(node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"})))",
              "legendFormat": "디스크 사용률",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "플랫폼 앱 Pod 상태",
          "description": "주요 플랫폼 앱의 Ready Pod 수",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short",
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"monitoring\",condition=\"true\"} == 1)",
              "legendFormat": "Monitoring",
              "refId": "A"
            },
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"devtools\",condition=\"true\"} == 1)",
              "legendFormat": "DevTools",
              "refId": "B"
            },
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"harbor\",condition=\"true\"} == 1)",
              "legendFormat": "Harbor",
              "refId": "C"
            },
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"keycloak\",condition=\"true\"} == 1)",
              "legendFormat": "Keycloak",
              "refId": "D"
            },
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"gitea\",condition=\"true\"} == 1)",
              "legendFormat": "Gitea",
              "refId": "E"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CNPG DB 연결 수 및 트랜잭션",
          "description": "CloudNative-PG DB 활성 연결 수와 초당 트랜잭션",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "트랜잭션/s" },
                "properties": [
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "unit", "value": "reqps" }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total) by (cluster)",
              "legendFormat": "연결 수 ({{ cluster }})",
              "refId": "A"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_database_xact_commit_total[5m]) + rate(cnpg_pg_stat_database_xact_rollback_total[5m])) by (cluster)",
              "legendFormat": "트랜잭션/s ({{ cluster }})",
              "refId": "B"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "인증서 만료까지 남은 시간",
          "description": "cert-manager가 관리하는 인증서 만료 잔여 시간",
          "gridPos": { "x": 0, "y": 9, "w": 8, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 604800 },
                  { "color": "green", "value": 2592000 }
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "(certmanager_certificate_expiration_timestamp_seconds - time()) > 0",
              "legendFormat": "{{ name }} ({{ namespace }})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "ArgoCD 앱 동기화 상태",
          "description": "ArgoCD Application 동기화 상태 (Synced/OutOfSync/Unknown)",
          "gridPos": { "x": 8, "y": 9, "w": 8, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(argocd_app_info{sync_status=\"Synced\"}) or vector(0)",
              "legendFormat": "Synced",
              "refId": "A"
            },
            {
              "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"}) or vector(0)",
              "legendFormat": "OutOfSync",
              "refId": "B"
            },
            {
              "expr": "sum(argocd_app_info{sync_status=\"Unknown\"}) or vector(0)",
              "legendFormat": "Unknown",
              "refId": "C"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Istio Ambient mTLS 요청 지연 (p99)",
          "description": "Istio ambient mesh를 통한 서비스 간 요청 지연 (99th percentile)",
          "gridPos": { "x": 16, "y": 9, "w": 8, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 5,
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le, destination_service_name)) / 1000",
              "legendFormat": "{{ destination_service_name }}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-test-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k6-load-test.json: |
    {
      "title": "k6 Load Test",
      "uid": "k6-load-test",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Virtual Users",
          "description": "현재 활성 VU 수",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(k6_vus)",
              "legendFormat": "VUs",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Active Test IDs",
          "description": "testid별 활성 VU 수",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count by (testid) (k6_vus)",
              "legendFormat": "{{ testid }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request Rate",
          "description": "초당 HTTP 요청 수",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              }
            }
          },
          "targets": [
            {
              "expr": "rate(k6_http_reqs_total[1m])",
              "legendFormat": "{{ testid }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "p95 Request Duration",
          "description": "요청 소요시간 95th percentile",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 1000 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "k6_http_req_duration_p95",
              "legendFormat": "{{ testid }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Error Rate",
          "description": "실패한 HTTP 요청 비율",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "k6_http_req_failed_rate",
              "legendFormat": "{{ testid }}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-rightsizing-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  resource-rightsizing.json: |
    {
      "title": "Resource Rightsizing (Dr.Pym)",
      "uid": "resource-rightsizing",
      "description": "CPU/메모리 요청 대비 7일 사용량 기반 권장값 (KakaoPay Dr.Pym 방식). CPU는 request만 권장(limit 미권장 - throttling이 probe를 끊음), 메모리는 max*1.2를 request=limit로 권장.",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "네임스페이스/파드별 현재값 vs 권장값",
          "description": "현재 request/limit과 7일 p99(CPU)/max*1.2(메모리) 기반 권장값 비교. '메모리 Limit(현재)'가 비어있으면 limit 미설정(OOM 위험).",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "auto" } },
              "mappings": []
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "CPU 요청(현재)" }, "properties": [ { "id": "unit", "value": "short" } ] },
              { "matcher": { "id": "byName", "options": "CPU 요청(권장 p99 7d)" }, "properties": [ { "id": "unit", "value": "short" } ] },
              { "matcher": { "id": "byName", "options": "메모리 요청(현재)" }, "properties": [ { "id": "unit", "value": "bytes" } ] },
              {
                "matcher": { "id": "byName", "options": "메모리 Limit(현재)" },
                "properties": [
                  { "id": "unit", "value": "bytes" },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "special", "options": { "match": "null", "result": { "text": "LIMIT 없음", "color": "red", "index": 0 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "transparent", "value": 1 } ] } }
                ]
              },
              { "matcher": { "id": "byName", "options": "메모리 요청(권장 max*1.2 7d)" }, "properties": [ { "id": "unit", "value": "bytes" } ] },
              {
                "matcher": { "id": "byName", "options": "CPU 갭(권장-현재)" },
                "properties": [
                  { "id": "unit", "value": "short" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "transparent", "value": null },
                        { "color": "yellow", "value": 0.2 },
                        { "color": "red", "value": 0.5 }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "renameByName": {
                  "namespace": "네임스페이스",
                  "pod": "파드",
                  "Value #A": "CPU 요청(현재)",
                  "Value #B": "CPU 요청(권장 p99 7d)",
                  "Value #C": "메모리 요청(현재)",
                  "Value #D": "메모리 Limit(현재)",
                  "Value #E": "메모리 요청(권장 max*1.2 7d)",
                  "Value #F": "CPU 갭(권장-현재)"
                }
              }
            }
          ],
          "targets": [
            { "expr": "namespace_workload_pod:current_cpu_request:kube_state", "format": "table", "instant": true, "refId": "A" },
            { "expr": "namespace_workload_pod:recommended_cpu_request:quantile99_7d", "format": "table", "instant": true, "refId": "B" },
            { "expr": "namespace_workload_pod:current_memory_request:kube_state", "format": "table", "instant": true, "refId": "C" },
