---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idp-portal
  namespace: devtools
  # OpenBao Agent Injector는 Pod 어노테이션으로만 동작 (SA 어노테이션 불필요)
---
# ClusterRole: 읽기 전용
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idp-portal
rules:
  - apiGroups: [""]
    resources: [nodes, pods, persistentvolumeclaims, namespaces, services, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create]
  - apiGroups: [cert-manager.io]
    resources: [certificates, clusterissuers]
    verbs: [get, list, watch, patch]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies, policies]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, rolebindings, clusterroles, roles]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-portal
subjects:
  - kind: ServiceAccount
    name: idp-portal
    namespace: devtools
---
# Valkey (포털 전용 캐시)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-portal-valkey
  namespace: devtools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp-portal-valkey
  template:
    metadata:
      labels:
        app: idp-portal-valkey
        istio.io/dataplane-mode: "none"
    spec:
      containers:
        - name: valkey
          # docker.io: Valkey 공식 이미지, ghcr.io 대안 없음
          image: docker.io/valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: [valkey-server, --save, "", --appendonly, "no"]
---
apiVersion: v1
kind: Service
metadata:
  name: idp-portal-valkey
  namespace: devtools
spec:
  selector:
    app: idp-portal-valkey
  ports:
    - port: 6379
      targetPort: 6379
---
# IDP Portal Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-portal
  namespace: devtools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp-portal
  template:
    metadata:
      labels:
        app: idp-portal
        istio.io/dataplane-mode: "none"
    spec:
      serviceAccountName: idp-portal
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: idp-portal
          image: harbor.local.narwhal.io/library/idp-portal:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: idp-portal-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/auth/session
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: idp-portal
  namespace: devtools
spec:
  selector:
    app: idp-portal
  ports:
    - port: 3000
      targetPort: 3000
