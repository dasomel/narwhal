---
# PeerAuthentication 1/2: mesh-wide mTLS mode — STRICT.
#
# Enforces mutual TLS for all workloads in the mesh. External clients that
# do not speak mTLS cannot directly reach mesh-enrolled services; they must
# go through an ingress gateway that terminates the external plaintext
# connection and initiates mTLS toward the backend.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# PeerAuthentication 2/2: platform-system infra plane — PERMISSIVE exception.
#
# WHY THIS EXCEPTION EXISTS (namespace-wide, not just APISIX):
#   platform-system holds the infra plane that talks to NON-mesh clients, which
#   cannot speak Istio mTLS. Under mesh-wide STRICT, ztunnel rejects their
#   non-mTLS inbound, breaking the cluster. Concretely:
#     - APISIX gateway: external clients (MetalLB VIP 192.168.56.200 → host →
#       APISIX) arrive in plaintext → STRICT made all *.local.narwhal.internal ingress
#       unreachable.
#     - Kyverno / cert-manager admission webhooks: the kube-apiserver (host
#       network, NOT mesh-enrolled) calls https://kyverno-svc.platform-system.svc
#       → STRICT rejected it (EOF). Kyverno is fail-closed, so this BLOCKED all
#       new pod admission cluster-wide.
#   PERMISSIVE on the whole platform-system namespace lets ztunnel accept both
#   mTLS (inside-mesh callers) and plaintext (external / apiserver / host) for
#   the infra plane, while the app plane (devtools, iam, storage, monitoring, …)
#   stays STRICT. To tighten later, scope per-workload + per-port instead.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: platform-system-permissive
  namespace: platform-system
spec:
  mtls:
    mode: PERMISSIVE
---
# PeerAuthentication 3/3: database namespace — PERMISSIVE exception.
#
# WHY THIS EXCEPTION EXISTS:
#   The `database` namespace is ambient-enrolled (istio.io/dataplane-mode=ambient
#   applied by 09-istio-ambient.sh) and narwhal-db (CNPG) runs here. However,
#   Keycloak lives in the `iam` namespace which is intentionally NOT enrolled in
#   the ambient mesh (excluded from AMBIENT_NAMESPACES in 09-istio-ambient.sh so
#   that the Keycloak Operator-managed NetworkPolicy / probe paths are unaffected).
#   Under mesh-wide STRICT, ztunnel drops plain-TCP Postgres connections arriving
#   from non-HBONE clients — Keycloak→narwhal-db breaks on every clean install.
#   A live fix (removing the ambient label from `database`) was applied to the
#   cluster but was not codified, causing the break to reappear after each rebuild.
#
#   PERMISSIVE on `database` lets ztunnel accept both:
#     - mTLS / HBONE  (mesh-enrolled callers: devtools gitea, harbor, etc.)
#     - plain TCP     (non-enrolled callers: Keycloak in `iam`)
#   All other namespaces remain under the mesh-wide STRICT policy (doc 1/3).
#   To tighten later, scope per-workload (selector on narwhal-db pods) instead.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: database-permissive
  namespace: database
spec:
  mtls:
    mode: PERMISSIVE
---
# PeerAuthentication 4/4: Harbor — PERMISSIVE exception (workload-scoped).
#
# WHY: Harbor has INCONSISTENT mesh enrollment across its own components —
# harbor-core / harbor-nginx / harbor-portal carry istio.io/dataplane-mode=none
# (opted OUT, plain TCP), while harbor-redis / harbor-registry / harbor-jobservice
# inherit the devtools=ambient namespace (mesh-enrolled). Under mesh-wide STRICT,
# ztunnel rejected the opted-out harbor-core -> enrolled harbor-redis:6379 plain
# connection ("policy rejection: istio_converted_static_strict"), so harbor-core
# CrashLoopBackOff'd on "failed to initialize cache: redis ping EOF".
# Scoping PERMISSIVE to the harbor workloads (selector app=harbor) lets the
# enrolled harbor components accept plain TCP from the opted-out ones, while
# the rest of devtools (gitea, argocd, headlamp) stays STRICT.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: harbor-permissive
  namespace: devtools
spec:
  selector:
    matchLabels:
      app: harbor
  mtls:
    mode: PERMISSIVE
