---
# PeerAuthentication 1/2: mesh-wide mTLS mode — STRICT.
#
# Enforces mutual TLS for all workloads in the mesh. External clients that
# do not speak mTLS cannot directly reach mesh-enrolled services; they must
# go through an ingress gateway that terminates the external plaintext
# connection and initiates mTLS toward the backend.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# PeerAuthentication 2/2: platform-system infra plane — PERMISSIVE exception.
#
# WHY THIS EXCEPTION EXISTS (namespace-wide, not just APISIX):
#   platform-system holds the infra plane that talks to NON-mesh clients, which
#   cannot speak Istio mTLS. Under mesh-wide STRICT, ztunnel rejects their
#   non-mTLS inbound, breaking the cluster. Concretely:
#     - APISIX gateway: external clients (MetalLB VIP 192.168.56.200 → host →
#       APISIX) arrive in plaintext → STRICT made all *.local.narwhal.internal ingress
#       unreachable.
#     - Kyverno / cert-manager admission webhooks: the kube-apiserver (host
#       network, NOT mesh-enrolled) calls https://kyverno-svc.platform-system.svc
#       → STRICT rejected it (EOF). Kyverno is fail-closed, so this BLOCKED all
#       new pod admission cluster-wide.
#   PERMISSIVE on the whole platform-system namespace lets ztunnel accept both
#   mTLS (inside-mesh callers) and plaintext (external / apiserver / host) for
#   the infra plane, while the app plane (devtools, iam, storage, monitoring, …)
#   stays STRICT. To tighten later, scope per-workload + per-port instead.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: platform-system-permissive
  namespace: platform-system
spec:
  mtls:
    mode: PERMISSIVE
