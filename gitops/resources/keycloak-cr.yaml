# Keycloak CR - Keycloak Operator가 관리
# Operator CRD+RBAC는 11-keycloak.sh에서 설치됨
# DB secret (keycloak-db-secret)은 11-keycloak.sh에서 생성됨
---
apiVersion: v1
data:
  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password'); section>
        <#if section = "header">
            ${msg("loginAccountTitle")}
        <#elseif section = "form">
            <#if realm.password>
            <form id="kc-form-login" class="nw-form" action="${url.loginAction}" method="post">
                <div class="nw-field">
                    <label class="nw-label" for="username"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
                    <input id="username" class="nw-input" name="username" type="text" value="${(login.username!'')}" autofocus autocomplete="username"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <div class="nw-field">
                    <label class="nw-label" for="password">${msg("password")}</label>
                    <input id="password" class="nw-input" name="password" type="password" autocomplete="current-password"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
                </div>
                <#if messagesPerField.existsError('username','password')>
                    <div class="nw-err" aria-live="polite">${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}</div>
                </#if>
                <#if (realm.rememberMe && !usernameHidden??) || realm.resetPasswordAllowed>
                <div class="nw-row">
                    <#if realm.rememberMe && !usernameHidden??>
                        <label class="nw-check"><input name="rememberMe" type="checkbox" <#if login.rememberMe??>checked</#if>/> ${msg("rememberMe")}</label>
                    <#else><span></span></#if>
                    <#if realm.resetPasswordAllowed>
                        <a class="nw-link" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                    </#if>
                </div>
                </#if>
                <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>
                <button class="nw-btn" name="login" id="kc-login" type="submit">${msg("doLogIn")}</button>
            </form>
            </#if>
        <#elseif section = "info">
            <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
                <span>${msg("noAccount")} <a class="nw-link" href="${url.registrationUrl}">${msg("doRegister")}</a></span>
            </#if>
        </#if>
    </@layout.registrationLayout>
  messages_en.properties: |
    # Narwhal IDP Theme - English Messages
    loginAccountTitle=Sign in to your account
    loginTitle=Narwhal IDP
    doLogIn=Sign In
    usernameOrEmail=Username or email
    password=Password
    doForgotPassword=Forgot password?
    rememberMe=Remember me
    invalidUserMessage=Invalid username or password.
  messages_ko.properties: |
    # Narwhal IDP Theme - Korean Messages
    loginAccountTitle=계정에 로그인하세요
    loginTitle=Narwhal IDP
    doLogIn=로그인
    usernameOrEmail=사용자명 또는 이메일
    password=비밀번호
    doForgotPassword=비밀번호를 잊으셨나요?
    rememberMe=로그인 유지
    invalidUserMessage=잘못된 사용자명 또는 비밀번호입니다.
  narwhal.css: |
    /* ==========================================================================
       Narwhal IDP — custom Keycloak login theme (clean monochrome shadcn).
       Renders against custom template.ftl / login.ftl (no PatternFly).
       ========================================================================== */
    :root {
      --nw-bg: #f4f4f5;
      --nw-card: #ffffff;
      --nw-fg: #0a0a0a;
      --nw-muted: #71717a;
      --nw-border: #e4e4e7;
      --nw-primary: #18181b;
      --nw-primary-fg: #fafafa;
      --nw-ring: rgba(24, 24, 27, 0.12);
      --nw-radius: 10px;
    }

    * { box-sizing: border-box; }

    .nw-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(60rem 60rem at 50% -20rem, #ffffff 0%, var(--nw-bg) 60%);
      color: var(--nw-fg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .nw-card {
      width: 100%;
      max-width: 384px;
      background: var(--nw-card);
      border: 1px solid var(--nw-border);
      border-radius: 16px;
      padding: 36px 32px 32px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    .nw-head { text-align: center; margin-bottom: 28px; }

    .nw-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--nw-primary);
      color: var(--nw-primary-fg);
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .nw-title {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .nw-sub {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--nw-muted);
    }

    .nw-form { display: flex; flex-direction: column; gap: 18px; }

    .nw-field { display: flex; flex-direction: column; gap: 7px; }

    .nw-label { font-size: 13px; font-weight: 500; color: var(--nw-fg); }

    .nw-input {
      height: 42px;
      width: 100%;
      padding: 0 13px;
      font-size: 14px;
      font-family: inherit;
      color: var(--nw-fg);
      background: var(--nw-card);
      border: 1px solid var(--nw-border);
      border-radius: var(--nw-radius);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .nw-input::placeholder { color: var(--nw-muted); }

    .nw-input:focus {
      border-color: var(--nw-primary);
      box-shadow: 0 0 0 3px var(--nw-ring);
    }

    .nw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--nw-muted);
      margin-top: -4px;
    }

    .nw-check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .nw-check input { width: 15px; height: 15px; accent-color: var(--nw-primary); }

    .nw-link { color: var(--nw-fg); text-decoration: none; font-weight: 500; }
    .nw-link:hover { text-decoration: underline; }

    .nw-btn {
      height: 42px;
      width: 100%;
      margin-top: 2px;
      border: none;
      border-radius: var(--nw-radius);
      cursor: pointer;
      background: var(--nw-primary);
      color: var(--nw-primary-fg);
      font-size: 14px;
      font-weight: 550;
      font-family: inherit;
      transition: opacity 0.15s ease, transform 0.02s ease;
    }
    .nw-btn:hover { opacity: 0.9; }
    .nw-btn:active { transform: translateY(1px); }

    .nw-alert {
      font-size: 13px;
      line-height: 1.4;
      padding: 11px 13px;
      border-radius: var(--nw-radius);
      margin-bottom: 18px;
      border: 1px solid transparent;
    }
    .nw-alert-error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .nw-alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .nw-alert-warning { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .nw-alert-info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

    .nw-err { font-size: 12px; color: #b91c1c; margin-top: -8px; }

    .nw-info {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--nw-border);
      text-align: center;
      font-size: 13px;
      color: var(--nw-muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --nw-bg: #09090b;
        --nw-card: #18181b;
        --nw-fg: #fafafa;
        --nw-muted: #a1a1aa;
        --nw-border: #27272a;
        --nw-primary: #fafafa;
        --nw-primary-fg: #18181b;
        --nw-ring: rgba(250, 250, 250, 0.14);
      }
      .nw-body { background: radial-gradient(60rem 60rem at 50% -20rem, #1c1c1f 0%, var(--nw-bg) 60%); }
    }
  template.ftl: |
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false>
    <!DOCTYPE html>
    <html lang="${(locale.currentLanguageTag)!'en'}">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <meta name="robots" content="noindex, nofollow"/>
      <title>Narwhal IDP</title>
      <#if properties.styles?has_content>
        <#list properties.styles?split(' ') as style>
          <link href="${url.resourcesPath}/${style}" rel="stylesheet"/>
        </#list>
      </#if>
    </head>
    <body class="nw-body">
      <main class="nw-card">
        <header class="nw-head">
          <div class="nw-logo">N</div>
          <h1 class="nw-title">Narwhal IDP</h1>
          <p class="nw-sub"><#nested "header"></p>
        </header>

        <#if displayMessage && message?? && message.summary?has_content>
          <div class="nw-alert nw-alert-${message.type}">
            <span>${kcSanitize(message.summary)?no_esc}</span>
          </div>
        </#if>

        <#nested "form">

        <#if displayInfo>
          <div class="nw-info"><#nested "info"></div>
        </#if>
      </main>
    </body>
    </html>
    </#macro>
  theme.properties: |
    # Narwhal IDP — clean shadcn login theme (custom templates, no PatternFly)
    parent=keycloak.v2
    import=common/keycloak
    styles=css/narwhal.css
    locales=en,ko
kind: ConfigMap
metadata:
  name: keycloak-theme-narwhal
  namespace: iam
  labels:
    app: keycloak
    component: theme
    theme: narwhal
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: iam
spec:
  instances: 1
  db:
    vendor: postgres
    host: narwhal-db-rw.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.local.narwhal.io
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  unsupported:
    podTemplate:
      metadata:
        labels:
          istio.io/dataplane-mode: "none"
      spec:
        containers:
          - name: keycloak
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "1"
            volumeMounts:
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/theme.properties
                subPath: theme.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/template.ftl
                subPath: template.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/login.ftl
                subPath: login.ftl
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/resources/css/narwhal.css
                subPath: narwhal.css
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_en.properties
                subPath: messages_en.properties
              - name: keycloak-theme-narwhal
                mountPath: /opt/keycloak/themes/narwhal/login/messages/messages_ko.properties
                subPath: messages_ko.properties
        volumes:
          - name: keycloak-theme-narwhal
            configMap:
              name: keycloak-theme-narwhal
