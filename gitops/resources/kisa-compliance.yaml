apiVersion: aquasecurity.github.io/v1alpha1
kind: ClusterComplianceReport
metadata:
  name: k8s-kisa-1.0
  labels:
    app.kubernetes.io/instance: trivy-operator
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/version: 0.25.0
spec:
  cron: "0 */6 * * *"
  reportType: all
  compliance:
    id: k8s-kisa-1.0
    title: KISA Kubernetes Security Controls v1.0
    description: KISA (한국인터넷진흥원) 주요정보통신기반시설 및 K8s 보안 가이드라인 기준 점검
    version: "1.0"
    platform: k8s
    type: kisa
    relatedResources:
      - https://www.kisa.or.kr
    controls:
      - id: KISA-CP-01
        name: API 서버 감사 로그 활성화
        description: kube-apiserver 감사 로그 설정 (--audit-log-path, --audit-policy-file 등) 검증
        severity: CRITICAL
        checks:
          - id: AVD-KCV-0019
          - id: AVD-KCV-0020
          - id: AVD-KCV-0021
          - id: AVD-KCV-0022
          - id: AVD-KCV-0002
      - id: KISA-ETCD-01
        name: etcd 저장 데이터 암호화
        description: etcd 저장 시크릿 암호화 및 etcd 통신 TLS 적용 검증
        severity: CRITICAL
        checks:
          - id: AVD-KCV-0029
          - id: AVD-KCV-0004
          - id: AVD-KCV-0030
      # KISA-SEC-01: Omitted - OpenBao Shamir secret contents in K8s Secret is an application-level secret content audit, not a K8s object spec check supported by Trivy scanner.
      # KISA-ETCD-02: Omitted - APISIX internal etcd transport security is an application process/connection setting, not observable via K8s manifest spec scanner.
      # KISA-IMG-01: Omitted - containerd registry skip_verify setting lives in node host config (/etc/containerd/config.toml), not exposed in K8s API objects or workload spec checks.
      - id: KISA-RBAC-01
        name: 최소 권한·cluster-admin 통제
        description: 불필요한 cluster-admin 바인딩 및 권한 승격(bind/impersonate/escalate) 통제 검증
        severity: HIGH
        checks:
          - id: AVD-KSV-0041
          - id: AVD-KSV-0043
      # KISA-TLS-01: Omitted - Istio PeerAuthentication mesh mode (STRICT vs PERMISSIVE) coverage is an Istio CRD setting, not covered by Trivy built-in K8s checks.
      - id: KISA-POD-01
        name: Pod Security Admission 적용
        description: Privileged/hostNetwork/hostPID/root 등 Pod 보안 표준 위반 검증
        severity: MEDIUM
        checks:
          - id: AVD-KSV-0017
          - id: AVD-KSV-0001
          - id: AVD-KSV-0008
          - id: AVD-KSV-0009
          - id: AVD-KSV-0010
          - id: AVD-KSV-0012
      # KISA-OBS-01: Omitted - Alertmanager receiver notification routing lives in Alertmanager config, out of scope for Trivy K8s scanner.
      - id: KISA-NET-01
        name: Ingress default-deny NetworkPolicy 적용
        description: 네임스페이스별 NetworkPolicy 정의 여부 검증
        severity: MEDIUM
        checks:
          - id: AVD-KSV-0038
      # KISA-IMG-02: Omitted - Cosign signature state and image tag policies are verified by image policy webhooks/Kyverno, no built-in Trivy K8s config audit check ID exists.
      # KISA-IMG-03: Omitted - Image vulnerability findings are produced by Trivy VulnerabilityReport CRDs, not by ClusterComplianceReport checks.
      - id: KISA-ADM-01
        name: 정책 강제 (Policy-as-Code)
        description: Container Capabilities 제한 정책 준수 여부 검증
        severity: MEDIUM
        checks:
          - id: AVD-KSV-0003
          - id: AVD-KSV-0004
      # KISA-TLS-02: Omitted - cert-manager Certificate CRD state and expiration are cert-manager internal object statuses, not scanned by Trivy K8s config audit checks.
      - id: KISA-RBAC-02
        name: RBAC 위험 바인딩 점검
        description: 시크릿 접근 권한 및 와일드카드 리소스/버브 부여 점검
        severity: MEDIUM
        checks:
          - id: AVD-KSV-0044
          - id: AVD-KSV-0045
          - id: AVD-KSV-0046
      # KISA-CFG-01: Omitted - Meta-metric calculated by Trivy operator / portal across frameworks, not an individual workload spec check.
