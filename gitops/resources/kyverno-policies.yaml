---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # chaos-daemon requires privileged: true (chart default) to inject
          # faults into other pods' network/IO namespaces.
          - resources:
              namespaces:
                - chaos-testing
      validate:
        message: "Privileged mode is disallowed."
        # =() 옵셔널 앵커 필수: 앵커 없이 쓰면 privileged 필드가 없는 파드
        # (사실상 대부분)가 Enforce에서 전부 admission 거부되어 재기동 불능이 된다.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # node-exporter는 노드 메트릭 수집을 위해 hostNetwork/hostPID가 필수.
          # monitoring 네임스페이스를 통째 여는 대신 이 워크로드만 예외 처리한다
          # (와일드카드가 DaemonSet과 해시 접미 파드 이름 모두 매칭).
          - resources:
              namespaces:
                - monitoring
              names:
                - "prometheus-stack-prometheus-node-exporter*"
          # chaos-daemon hardcodes hostPID: true (chaos-daemon-daemonset.yaml,
          # not a values toggle) to reach other pods' process namespaces.
          - resources:
              namespaces:
                - chaos-testing
      validate:
        message: "Sharing the host namespace (hostNetwork, hostPID, hostIPC) is disallowed."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow Host Ports
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-ports-none
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # node-exporter는 hostPort 9100으로 노드 메트릭을 노출한다 (hostNetwork와
          # 함께 필수). host-namespaces와 동일하게 이 워크로드만 예외 처리.
          - resources:
              namespaces:
                - monitoring
              names:
                - "prometheus-stack-prometheus-node-exporter*"
      validate:
        message: "Use of host ports is disallowed."
        pattern:
          spec:
            containers:
              - =(ports):
                  - =(hostPort): 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "The label 'app.kubernetes.io/name' is required."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "Using 'latest' tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "Images must be from approved registries: ghcr.io, registry.k8s.io, quay.io, docker.io"
        pattern:
          spec:
            containers:
              - image: "ghcr.io/* | registry.k8s.io/* | quay.io/* | docker.io/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-securitycontext
  annotations:
    policies.kyverno.io/title: Add Default SecurityContext
    policies.kyverno.io/category: Best Practices
spec:
  background: false
  rules:
    - name: add-default-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      mutate:
        patchStrategicMerge:
          spec:
            # runAsNonRoot: true는 의도적으로 주입하지 않는다 — uid를 지정하지 않는
            # 약한 통제인데, USER가 비숫자(cnb/node 등)인 업스트림 이미지는 kubelet이
            # non-root 검증을 못 해 CreateContainerConfigError로 파드가 못 뜬다
            # (2026-07-10 velero-ui·velero 2건 발생). 실제 non-root 강제가 필요한
            # 워크로드는 차트에서 runAsUser를 명시한다. seccomp 기본값만 주입.
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
