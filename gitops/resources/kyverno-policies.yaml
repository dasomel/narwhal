---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # chaos-daemon requires privileged: true (chart default) to inject
          # faults into other pods' network/IO namespaces.
          - resources:
              namespaces:
                - chaos-testing
          # nfs-quota-agent runs privileged to manage XFS project quotas on the
          # host NFS export path. The v0.2.1 pod predates this Enforce policy
          # (grandfathered); the v0.3.0 rollout was blocked with FailedCreate
          # until this exclusion was added (2026-07-19).
          - resources:
              namespaces:
                - nfs-quota-agent
      validate:
        message: "Privileged mode is disallowed."
        # =() 옵셔널 앵커 필수: 앵커 없이 쓰면 privileged 필드가 없는 파드
        # (사실상 대부분)가 Enforce에서 전부 admission 거부되어 재기동 불능이 된다.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # node-exporter는 노드 메트릭 수집을 위해 hostNetwork/hostPID가 필수.
          # monitoring 네임스페이스를 통째 여는 대신 이 워크로드만 예외 처리한다
          # (와일드카드가 DaemonSet과 해시 접미 파드 이름 모두 매칭).
          - resources:
              namespaces:
                - monitoring
              names:
                - "prometheus-stack-prometheus-node-exporter*"
          # chaos-daemon hardcodes hostPID: true (chaos-daemon-daemonset.yaml,
          # not a values toggle) to reach other pods' process namespaces.
          - resources:
              namespaces:
                - chaos-testing
          # nfs-quota-agent sets hostPID: true (both v0.2.1 and v0.3.0) alongside
          # privileged + hostPath(/dev,/srv/nfs/k8s) to manage XFS project quotas
          # on the host. The running v0.2.1 pod was grandfathered before Enforce.
          - resources:
              namespaces:
                - nfs-quota-agent
      validate:
        message: "Sharing the host namespace (hostNetwork, hostPID, hostIPC) is disallowed."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow Host Ports
    policies.kyverno.io/category: Pod Security Standards (Baseline)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-ports-none
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
          # node-exporter는 hostPort 9100으로 노드 메트릭을 노출한다 (hostNetwork와
          # 함께 필수). host-namespaces와 동일하게 이 워크로드만 예외 처리.
          - resources:
              namespaces:
                - monitoring
              names:
                - "prometheus-stack-prometheus-node-exporter*"
      validate:
        message: "Use of host ports is disallowed."
        pattern:
          spec:
            containers:
              - =(ports):
                  - =(hostPort): 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "The label 'app.kubernetes.io/name' is required."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
spec:
  # narwhal#52 D2-A: Audit -> Enforce. The pre-merge CI gate
  # (scripts/gitops/check-no-mutable-tags.py, R65/R66) already blocks the same
  # `:latest`/untagged shape before it reaches gitops/, and no in-scope namespace
  # (kaniko build runs in devtools, already excluded below) currently runs one — see
  # docs/common/supply-chain-policy.md and narwhal#52 for the verification that led
  # here. `verify-image-signatures` stays Audit (pending narwhal#35).
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "Using 'latest' tag is not allowed."
        # =() 옵셔널 앵커 필수 (위 disallow-privileged-containers와 동일 이유): 대부분의
        # 파드는 initContainers/ephemeralContainers가 없으므로, 앵커 없이 쓰면 전부
        # Enforce에서 admission 거부된다.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      validate:
        message: "Images must be from approved registries: ghcr.io, registry.k8s.io, quay.io, docker.io"
        pattern:
          spec:
            containers:
              - image: "ghcr.io/* | registry.k8s.io/* | quay.io/* | docker.io/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-securitycontext
  annotations:
    policies.kyverno.io/title: Add Default SecurityContext
    policies.kyverno.io/category: Best Practices
spec:
  background: false
  rules:
    - name: add-default-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      mutate:
        patchStrategicMerge:
          spec:
            # runAsNonRoot: true는 의도적으로 주입하지 않는다 — uid를 지정하지 않는
            # 약한 통제인데, USER가 비숫자(cnb/node 등)인 업스트림 이미지는 kubelet이
            # non-root 검증을 못 해 CreateContainerConfigError로 파드가 못 뜬다
            # (2026-07-10 velero-ui·velero 2건 발생). 실제 non-root 강제가 필요한
            # 워크로드는 차트에서 runAsUser를 명시한다. seccomp 기본값만 주입.
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures & Attestations
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >-
      Verifies Cosign image signatures and CycloneDX/SPDX SBOM attestations on container images.
      Introduced in Audit mode to log verification results without blocking workloads in air-gapped environments.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: verify-signature-and-sbom
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - istio-system
                - platform-system
                - devtools
                - security-system
      verifyImages:
        - imageReferences:
            - "*"
          mutateDigest: false
          verifyDigest: true
          required: false
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE/narwhal/cosign/trusted/signer/pub
                      -----END PUBLIC KEY-----
          attestations:
            - predicateType: https://cyclonedx.org/schema/1.4
              attestors:
                - count: 1
                  entries:
                    - keys:
                        publicKeys: |
                          -----BEGIN PUBLIC KEY-----
                          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE/narwhal/cosign/trusted/signer/pub
                          -----END PUBLIC KEY-----
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-tuning-job-admission
  annotations:
    policies.kyverno.io/title: Restrict Privileged Node-Tuning Job Admission
    policies.kyverno.io/category: Pod Security Standards (Custom)
    policies.kyverno.io/description: >-
      narwhal-portal#55's node-tuning Job (k8s-job-runner.ts runHostJob) is
      privileged + hostPID + hostNetwork by design and runs in the devtools
      namespace, which the baseline disallow-privileged-containers /
      disallow-host-namespaces policies above exclude wholesale (devtools also
      hosts ArgoCD, Gitea, Harbor, Headlamp -- none of those need host access).
      That exclusion means, today, ANY pod in devtools -- not just the tuning
      Job -- could set privileged/hostPID/hostNetwork and admission would not
      stop it; and the tuning Job's own nodeName is only checked in the portal
      route handler (application code), never at the cluster layer. This
      policy is the narwhal-side completion of #55: it narrows "privileged +
      host namespaces in devtools" to the dedicated narwhal-tuning-job
      ServiceAccount only (gitops/resources/rbac-policies.yaml), and separately
      forbids that ServiceAccount's pods from targeting a control-plane node,
      so an authorization bypass or app-layer bug in the portal can no longer
      reach a master node's host namespace even if it reaches this namespace.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: only-tuning-sa-may-use-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - devtools
      # A pod using ANY of privileged/hostPID/hostNetwork in devtools must run as
      # the dedicated tuning-job identity. Pods that use none of the three are
      # untouched by this rule regardless of ServiceAccount.
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
            operator: NotEquals
            value: narwhal-tuning-job
      validate:
        message: >-
          Only the narwhal-tuning-job ServiceAccount may run pods with
          hostPID, hostNetwork, or a privileged container in the devtools
          namespace (see narwhal-portal#55).
        pattern:
          spec:
            =(hostPID): "false"
            =(hostNetwork): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tuning-job-control-plane-node-guard
  annotations:
    policies.kyverno.io/title: Block Node-Tuning Job From Targeting Control-Plane Nodes
    policies.kyverno.io/category: Pod Security Standards (Custom)
    policies.kyverno.io/description: >-
      Defense-in-depth companion to restrict-tuning-job-admission above (see
      narwhal-portal#55): denies the narwhal-tuning-job ServiceAccount's pods
      from setting spec.nodeName to a control-plane node. Kept as a SEPARATE
      policy in Audit mode: the live context.apiCall Node lookup below has not
      been exercised against a running cluster in any agent session to date
      (no cluster was available). Kyverno's failurePolicy defaults to Fail on
      an apiCall error, so shipping this rule straight to Enforce risks a
      total outage of the one feature it protects if the apiCall doesn't
      resolve as expected (RBAC gap, API server hiccup, malformed jmesPath).
      Flip validationFailureAction to Enforce only after a live cluster run
      confirms: (a) the apiCall actually resolves node role labels, and (b) a
      deliberate control-plane nodeName is denied while a worker nodeName is
      allowed. Record that result in docs/common/lessons-log.md before
      flipping.
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: tuning-sa-may-not-target-control-plane-nodes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - devtools
              names:
                - "*"
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
            operator: Equals
            value: narwhal-tuning-job
          - key: "{{ request.object.spec.nodeName || '' }}"
            operator: NotEquals
            value: ""
      context:
        - name: targetNodeRole
          apiCall:
            urlPath: "/api/v1/nodes/{{ request.object.spec.nodeName }}"
            jmesPath: "metadata.labels.\"node-role.kubernetes.io/control-plane\" || 'not-control-plane'"
      validate:
        message: >-
          The narwhal-tuning-job ServiceAccount may not target a
          control-plane node (node-role.kubernetes.io/control-plane) via
          spec.nodeName (see narwhal-portal#55). This is defense-in-depth for
          the equivalent check already enforced in the portal route handler.
        deny:
          conditions:
            all:
              - key: "{{ targetNodeRole }}"
                operator: NotEquals
                value: not-control-plane
