---
# MetalLB IP Address Pool
# Assigns IPs from 192.168.56.200-220 for LoadBalancer services
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: platform-system
spec:
  addresses:
    - 192.168.56.200-192.168.56.220
---
# L2 Advertisement
# Announces IPs via ARP on the local network
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: platform-system
spec:
  ipAddressPools:
    - default-pool
