# Unified PostgreSQL HA Cluster for all Narwhal platform apps
# Managed by CNPG operator, replaces individual DB clusters
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: v1
kind: Secret
metadata:
  name: narwhal-db-credentials
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: keycloak-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-s3-credentials
  namespace: database
type: Opaque
stringData:
  ACCESS_KEY_ID: admin
  ACCESS_SECRET_KEY: admin
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: narwhal-db
  namespace: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      dataChecksums: true
      secret:
        name: narwhal-db-credentials
      postInitSQL:
        - CREATE USER harbor WITH PASSWORD 'harbor-db-password'
        - CREATE USER gitea WITH PASSWORD 'gitea-db-password'
        - CREATE DATABASE harbor OWNER harbor
        - CREATE DATABASE gitea OWNER gitea
        - GRANT ALL PRIVILEGES ON DATABASE harbor TO harbor
        - GRANT ALL PRIVILEGES ON DATABASE gitea TO gitea

  storage:
    size: 20Gi
    storageClass: nfs-csi

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      max_connections: "200"
      max_wal_size: "1GB"

  monitoring:
    enablePodMonitor: false

  affinity:
    tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule

  # Backup enabled after SeaweedFS deployment via GitOps
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://cnpg-backup/narwhal-db
  #     endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
  #     s3Credentials:
  #       accessKeyId:
  #         name: cnpg-s3-credentials
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: cnpg-s3-credentials
  #         key: ACCESS_SECRET_KEY
  #     wal:
  #       compression: gzip
  #     data:
  #       compression: gzip
  #   retentionPolicy: "14d"
---
# Cross-namespace ExternalName services
# Apps reference their original service names for zero-config migration
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db-rw
  namespace: keycloak
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-db-rw
  namespace: harbor
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-db-rw
  namespace: gitea
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
