# Unified PostgreSQL HA Cluster for all Narwhal platform apps
# Managed by CNPG operator, replaces individual DB clusters
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
# D-s3auth: Secret database/cnpg-s3-credentials is deliberately NOT in this file. 14-gitops-
# bootstrap.sh re-applies it on every run and used to revert the keys to the inline default; the
# per-client random keys are created by scripts/common/lib.sh ensure_s3_identities (07-cnpg.sh).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: narwhal-db
  namespace: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # D-pvb-exclude (#431): exclude the volume from Velero fs-backup. NFS root_squash maps kopia (uid 0) to
  # nobody, which cannot read owner-only files, so the PodVolumeBackup is Canceled and leaves the whole Backup
  # InProgress, queueing every later schedule. This volume (barman covers the DB) is NOT protected by Velero; see CHANGELOG.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata

  # D-CNPG-APPDB: the application database must be one that exists. CNPG's default monitoring queries
  # (cnpg_pg_database_*, pg_stat_*, ...) connect to bootstrap.initdb.database, and the live cluster was
  # created by 07-cnpg.sh with 'narwhal' (git log -S: this file kept 'authentik' from 94b72c37 and was
  # never updated by a301deb1, which only fixed the scripts). 14-gitops-bootstrap.sh then applied 'authentik' (kubectl apply, no Argo
  # Application owns this Cluster) into the live spec, a database that does not exist: every default query failed with SQLSTATE 3D000 (R326 notes
  # it, the WAL alert had to use the built-in collector). initdb runs only at cluster creation, so on the
  # live cluster this edit changes only the monitoring target (server dry-run accepted by the webhook
  # 2026-11-08). A fresh GitOps-only bootstrap now also creates 'narwhal' owned by 'narwhal', matching
  # narwhal-db-credentials.username and 07-cnpg.sh. Escape hatch: revert, or set
  # spec.monitoring.customQueriesConfigMap with an explicit target.
  bootstrap:
    initdb:
      database: narwhal
      owner: narwhal
      dataChecksums: true
      secret:
        name: narwhal-db-credentials
      postInitSQL:
        - CREATE USER harbor WITH PASSWORD 'harbor-db-password'
        - CREATE USER gitea WITH PASSWORD 'gitea-db-password'
        - CREATE DATABASE harbor OWNER harbor
        - CREATE DATABASE gitea OWNER gitea
        - GRANT ALL PRIVILEGES ON DATABASE harbor TO harbor
        - GRANT ALL PRIVILEGES ON DATABASE gitea TO gitea

  storage:
    size: 20Gi
    storageClass: nfs-csi

  # D-CNPG-RESOURCES: the live postgres container had NO requests/limits (BestEffort), so the scheduler
  # ignored it and it was the first OOM/eviction victim. Same values as scripts/cluster/07-cnpg.sh.
  # Memory limit 1Gi is ~4x shared_buffers (256MB) plus work_mem x connections headroom; no CPU limit,
  # because CFS throttling of the postgres or instance-manager process delays /healthz and would turn
  # a busy moment into a liveness failure. Cost: 512Mi/250m reserved per instance on two workers; a
  # worker without that free leaves the instance Pending (see D-CNPG-AA-REQUIRED).
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      max_connections: "200"
      max_wal_size: "1GB"

  # D-CNPG-MON (#600): enable PodMonitor so Prometheus scrapes CNPG metrics (exporter port 9187)
  monitoring:
    enablePodMonitor: true

  # D-CNPG-RESTART-AMP (#600 incident, 2026-11-08): with master-1 etcd/NFS I/O stalled the apiserver timed
  # out; the default liveness (3 failures x 10s, isolationCheck 1s) restarted healthy postgres containers
  # and failed the DB over, which amplified a storage stall into an outage. Kept in sync with
  # scripts/cluster/07-cnpg.sh. Fields: spec.probes.liveness (CNPG 1.29 CRD; it supersedes the older
  # livenessProbeTimeout, so that one is not set). Docs: https://cloudnative-pg.io/documentation/current/instance_manager/
  # Liveness tolerates ~120s (12 x 10s, 10s timeout, isolationCheck 5s) instead of ~30s. Readiness and
  # startup stay default, so a slow instance still leaves the -rw/-ro Services quickly.
  # Cost: a truly hung instance manager is restarted after ~2 min instead of ~30s, and a primary that has
  # lost the apiserver is demoted later. Escape hatch: delete this probes block to return to the defaults.
  # Rollout: only when 14-gitops-bootstrap.sh (kubectl apply) is next run; no Argo Application syncs this Cluster. The
  # change rolls the instances (replicas first, primaryUpdateStrategy unsupervised, primaryUpdateMethod restart:
  # the primary restarts in place, no switchover).
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 12
      isolationCheck:
        enabled: true
        connectionTimeout: 5000
        requestTimeout: 5000

  # D-CNPG-AA-REQUIRED (#564): required hostname anti-affinity, so the two instances never share a node
  # (2026-11-04/06: both on worker-1, one stall failed over the DB and a drain blocked WAL archiving).
  # Checked 2026-11-06: 3 untainted workers, 3 control-plane nodes tainted NoSchedule, instances: 2.
  # Cost: a rescheduled instance needs a worker that does not host the other instance. Single-worker drain
  # on 3 workers: the evicted pod goes to the third worker, but only if it has CPU/memory requests free;
  # if not, or if a second worker is down/cordoned, the pod stays Pending (one instance, no HA) instead of
  # co-locating. Pending is the intended outcome, not a bug: fix capacity or uncordon.
  # Rollout: anti-affinity only applies at schedule time, existing pods are not evicted
  # (IgnoredDuringExecution); CNPG rolls replicas first and the primary last (primaryUpdateMethod
  # restart, in place, no switchover). Escape hatch: set podAntiAffinityType back to preferred.
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backup/narwhal-db
      endpointURL: http://seaweedfs-s3.storage.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"
---
# Cross-namespace ExternalName services
# Apps reference their original service names for zero-config migration
apiVersion: v1
kind: Service
metadata:
  name: authentik-db-rw
  namespace: iam
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-db-rw
  namespace: devtools
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-db-rw
  namespace: devtools
spec:
  type: ExternalName
  externalName: narwhal-db-rw.database.svc.cluster.local
  ports:
    - port: 5432
