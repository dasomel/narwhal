---
# NetworkPolicy: 네임스페이스별 egress 정책 (현재 전체 허용) + Velero metrics ingress
#
# 설계 원칙:
#   - deny-by-default egress는 사용하지 않음 (Cilium deny-by-default 충돌 경험)
#   - egress는 제한하지 않음: 모든 정책이 `- {}` (allow-all) 단일 규칙
#   - 정책 오브젝트는 네임스페이스별로 유지 — 이후 egress를 다시 좁힐 때
#     오브젝트 추가 없이 규칙만 교체하면 되는 재강화 지점
#
# 네임스페이스 목록:
#   iam        - Keycloak, OAuth2-Proxy (SSO/IAM)
#   devtools   - ArgoCD, Gitea, Harbor, Headlamp (개발 도구)
#   monitoring - Prometheus, Grafana, Loki, Tempo (관측성)
#   storage    - SeaweedFS, OpenBao, Velero (스토리지/시크릿/백업)
#   database   - CloudNative-PG (PostgreSQL)

# ============================================================
# 1. IAM 네임스페이스 (Keycloak, OAuth2-Proxy)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam-egress
  namespace: iam
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 2. DevTools 네임스페이스 (ArgoCD, Gitea, Harbor, Headlamp)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devtools-egress
  namespace: devtools
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 3. Monitoring 네임스페이스 (Prometheus, Grafana, Loki, Tempo)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 4. Storage 네임스페이스 (SeaweedFS, OpenBao, Velero)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-egress
  namespace: storage
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 5. Database 네임스페이스 (CloudNative-PG)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-egress
  namespace: database
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# D-velero-scrape (#456): the matching PeerAuthentication velero-metrics (8085 PERMISSIVE)
# lives with the other PeerAuthentications in narwhal-platform istio-ambient-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-metrics
  namespace: storage
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: velero
      app.kubernetes.io/instance: velero
      name: velero
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 8085
        # R200: every port-limited rule in an ambient namespace keeps HBONE open.
        - protocol: TCP
          port: 15008
---
# D610-6: explicit portal -> Alertmanager API path, including HBONE for mesh callers.
# monitoring has no ingress deny/AuthorizationPolicy; monitoring-permissive already
# admits the portal's ambient opt-out plaintext. Do not add a new ALLOW policy there:
# it would implicitly deny existing Prometheus/APISIX/Falco callers.
# Cost: currently redundant with devtools-egress allow-all. Escape: remove this policy;
# retain it when narrowing that baseline so notification GET/POST stays reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: narwhal-portal-alertmanager-egress
  namespace: devtools
spec:
  podSelector:
    matchLabels:
      app: narwhal-portal
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
              alertmanager: prometheus-stack-kube-prom-alertmanager
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 15008
---
# D-ALLOY-OTLP-INGRESS (#735): restrict alloy-logs OTLP trace ingest (4317/4318) to
# Grafana (self-tracing) and namespaces explicitly opted in via narwhal.io/otlp-ingest: "true",
# while preserving Prometheus metrics scraping (:12345).
#   - k8s-monitoring-alloy-logs Service sets istio.io/use-waypoint: none, so ambient callers
#     connect directly over HBONE 15008 with their source pod/namespace identity intact
#     (monitoring/waypoint is NOT allowed here).
#   - Every port-limited ingress rule in ambient-enrolled monitoring keeps TCP 15008 per R200.
#   - Kubelet /-/ready probes (:12345) arrive via 169.254.7.127/32 CCNP (allow-ambient-kubelet-probes);
#     config-reloader runs as a sidecar inside the same Pod (localhost:12345); alloy-operator
#     watches only the Kubernetes API.
#   - Escape hatch: add label narwhal.io/otlp-ingest: "true" on an opted-in Namespace, or
#     delete this policy to restore cluster-wide OTLP access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-logs-ingress-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
      app.kubernetes.io/instance: k8s-monitoring-alloy-logs
  policyTypes:
    - Ingress
  ingress:
    # 1. Grafana (monitoring) -> alloy-logs OTLP gRPC self-tracing (4317).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: prometheus-stack
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 15008
    # 2. Explicitly opted-in namespaces -> alloy-logs OTLP gRPC/HTTP ingest (4317/4318).
    - from:
        - namespaceSelector:
            matchLabels:
              narwhal.io/otlp-ingest: "true"
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 15008
    # 3. Prometheus (monitoring) -> alloy-logs HTTP metrics scrape (12345).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 12345
        - protocol: TCP
          port: 15008
---
# D-TEMPO-INGRESS (#691): close direct-to-Tempo OTLP bypass; accept trace ingest (4317)
# only from alloy-logs collector pods, and query/metrics (3200) only from known readers.
# Monitoring is ambient-enrolled with monitoring-permissive + waypoint:
#   - Every port-limited ingress rule keeps TCP 15008 (HBONE) per R200.
#   - Tempo Service carries istio.io/use-waypoint: none so alloy-logs ztunnel connects
#     directly to Tempo over HBONE 15008 with alloy-logs' pod IP (not monitoring/waypoint),
#     and waypoint is NOT permitted here (otherwise any ambient pod could hop through it).
#   - Opted-out readers (grafana, prometheus, narwhal-portal) reach 3200 via plain TCP
#     under monitoring-permissive. Kubelet /ready probes arrive via 169.254.7.127/32 CCNP.
#   - Grafana OTLP self-tracing remains routed via alloy-logs:4317 (not Tempo directly).
#   - Unused chart receivers/ports (4318, 14250, 14268, 9411, 55680, 55681, 6831/6832) are
#     denied by omission. Escape hatch: add a new caller rule or delete this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
  policyTypes:
    - Ingress
  ingress:
    # 1. alloy-logs collector pods (monitoring) -> Tempo OTLP gRPC ingest (4317).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-logs
              app.kubernetes.io/instance: k8s-monitoring-alloy-logs
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 15008
    # 2. Grafana (monitoring) -> Tempo HTTP query API (3200).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: prometheus-stack
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 15008
    # 3. Prometheus (monitoring) -> Tempo /metrics scrape (3200).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 15008
    # 4. narwhal-portal (devtools) -> Tempo HTTP query API (3200).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devtools
          podSelector:
            matchLabels:
              app: narwhal-portal
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 15008
    # 5. Tempo self/peer query path (monitoring) -> Tempo HTTP (3200).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
              app.kubernetes.io/instance: tempo
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 15008
