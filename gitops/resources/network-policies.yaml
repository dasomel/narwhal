---
# NetworkPolicy: 네임스페이스별 egress 정책 (현재 전체 허용)
#
# 설계 원칙:
#   - deny-by-default egress는 사용하지 않음 (Cilium deny-by-default 충돌 경험)
#   - egress는 제한하지 않음: 모든 정책이 `- {}` (allow-all) 단일 규칙
#   - 정책 오브젝트는 네임스페이스별로 유지 — 이후 egress를 다시 좁힐 때
#     오브젝트 추가 없이 규칙만 교체하면 되는 재강화 지점
#
# 네임스페이스 목록:
#   iam        - Keycloak, OAuth2-Proxy (SSO/IAM)
#   devtools   - ArgoCD, Gitea, Harbor, Headlamp (개발 도구)
#   monitoring - Prometheus, Grafana, Loki, Tempo (관측성)
#   storage    - SeaweedFS, OpenBao, Velero (스토리지/시크릿/백업)
#   database   - CloudNative-PG (PostgreSQL)

# ============================================================
# 1. IAM 네임스페이스 (Keycloak, OAuth2-Proxy)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam-egress
  namespace: iam
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 2. DevTools 네임스페이스 (ArgoCD, Gitea, Harbor, Headlamp)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devtools-egress
  namespace: devtools
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 3. Monitoring 네임스페이스 (Prometheus, Grafana, Loki, Tempo)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 4. Storage 네임스페이스 (SeaweedFS, OpenBao, Velero)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-egress
  namespace: storage
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}

---
# ============================================================
# 5. Database 네임스페이스 (CloudNative-PG)
# ============================================================
apiVersion: networking.k8s.io/v1
