apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: narwhal-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:

    # -------------------------------------------------------------------------
    # cluster-health: API 서버, etcd, CoreDNS, 노드 상태
    # -------------------------------------------------------------------------
    - name: cluster-health
      rules:
        - alert: KubeNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "노드 NotReady: {{ $labels.node }}"
            description: "노드 {{ $labels.node }}가 5분 이상 Ready 상태가 아닙니다."

        - alert: KubeAPIServerDown
          expr: absent(up{job="apiserver"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kube-apiserver 타겟 없음"
            description: "kube-apiserver 스크레이프 타겟이 5분 이상 0개입니다. API 서버가 다운되었을 수 있습니다."

        - alert: EtcdHighCommitDuration
          expr: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m])) > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd 커밋 지연 높음: {{ $labels.instance }}"
            description: "etcd 인스턴스 {{ $labels.instance }}의 99번째 백분위 커밋 지연이 10분 이상 250ms를 초과합니다. 현재값: {{ $value | humanizeDuration }}"

        - alert: CoreDNSDown
          expr: absent(up{job="coredns"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CoreDNS 인스턴스 없음"
            description: "CoreDNS 스크레이프 타겟이 5분 이상 0개입니다. 클러스터 DNS가 작동하지 않을 수 있습니다."

    # -------------------------------------------------------------------------
    # node-health: 노드 리소스 압력 및 사용률
    # -------------------------------------------------------------------------
    - name: node-health
      rules:
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "노드 디스크 압박: {{ $labels.node }}"
            description: "노드 {{ $labels.node }}에 5분 이상 DiskPressure 조건이 발생했습니다. 디스크 공간을 확인하세요."

        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "노드 메모리 압박: {{ $labels.node }}"
            description: "노드 {{ $labels.node }}에 5분 이상 MemoryPressure 조건이 발생했습니다. 메모리 사용량을 확인하세요."

        - alert: NodeHighCPU
          expr: |
            (
              1 - avg by (node) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            ) * 100 > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "노드 CPU 사용률 높음: {{ $labels.node }}"
            description: "노드 {{ $labels.node }}의 CPU 사용률이 15분 이상 90%를 초과합니다. 현재값: {{ $value | humanize }}%"

        - alert: NodeHighDiskUsage
          expr: |
            (
              1 - (
                node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                /
                node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              )
            ) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "노드 루트 디스크 사용률 높음: {{ $labels.instance }}"
            description: "인스턴스 {{ $labels.instance }}의 루트 파일시스템 사용률이 10분 이상 85%를 초과합니다. 현재값: {{ $value | humanize }}%"

        # D-VM-DISK-WRITE-RATE: Vagrant/VMware VM disks are sparse linked clones that never shrink, so a
        # sustained write rate is what grows the host vmdk while guest `df` stays flat (worker-3: 298G
        # on disk, 43G used). Measured 2026-11-06: worker steady median 8-27 GB/day, bursts (scan waves,
        # reschedules after a drain) 40-140 GB/h; control planes write 27-54 GB/day (etcd WAL + NFS)
        # but overwrite in place and their vmdks stayed 9-25G, so they are excluded to keep this
        # signal meaningful. 20 GB/day averaged over 6h fires on a real burst, not on the baseline.
        - alert: NodeDiskWriteRateHigh
          expr: |
            sum by (instance) (rate(node_disk_written_bytes_total{device=~"nvme[0-9]+n[0-9]+|sd[a-z]+|vd[a-z]+"}[6h])) * 86400 > 20e9
            unless on (instance) node_uname_info{nodename=~".*master.*"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "노드 디스크 쓰기량 과다: {{ $labels.instance }}"
            description: >-
              인스턴스 {{ $labels.instance }}의 6시간 평균 디스크 쓰기가 하루 20GB를 넘는 속도입니다(현재 {{ $value | humanize1024 }}B/일).
              sparse linked-clone vmdk는 한 번 커지면 줄지 않으므로 container_fs_writes_bytes_total을 pod별로 확인해
              쓰기 주체(Trivy 스캔 Job, 이미지 pull 등)를 찾으세요.
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/vagrant/operations.md#12-vm-디스크-증가와-회수-d-vm-disk-guard

    # -------------------------------------------------------------------------
    # platform-apps: 핵심 플랫폼 컴포넌트 가용성
    # -------------------------------------------------------------------------
    - name: platform-apps
      # D-DOWN-WORKLOAD: alert on workload availability, not on kube_pod_labels{label_*} joins.
      # kube-prometheus-stack ships kube-state-metrics with metricLabelsAllowlist: [] and this repo
      # never sets it, so label_* series do not exist and such a join is always empty (never fires).
      # `X == 0 or absent(X)` also fires when the workload is deleted; absent() keeps the equality
      # matcher labels (namespace, workload name). Escape hatch: renaming a workload needs this
      # expression and R298 updated together.
      rules:
        - alert: KeycloakDown
          expr: |
            kube_statefulset_status_replicas_ready{namespace="iam",statefulset="keycloak"} == 0
            or absent(kube_statefulset_status_replicas_ready{namespace="iam",statefulset="keycloak"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Keycloak 다운 (namespace: iam)"
            description: "namespace=iam에서 Ready 상태인 Keycloak pod가 5분 이상 없습니다. SSO 기능이 중단되었습니다."

        - alert: ArgoCDDown
          expr: |
            kube_deployment_status_replicas_available{namespace="devtools",deployment="argocd-server"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="devtools",deployment="argocd-server"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD 서버 다운 (namespace: devtools)"
            description: "namespace=devtools에서 Ready 상태인 argocd-server pod가 5분 이상 없습니다. GitOps 동기화가 중단되었습니다."

        - alert: HarborDown
          expr: |
            kube_deployment_status_replicas_available{namespace="devtools",deployment="harbor-core"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="devtools",deployment="harbor-core"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Harbor 코어 다운 (namespace: devtools)"
            description: "namespace=devtools에서 Ready 상태인 harbor-core pod가 5분 이상 없습니다. 컨테이너 레지스트리를 사용할 수 없습니다."

        - alert: GiteaDown
          expr: |
            kube_deployment_status_replicas_available{namespace="devtools",deployment="gitea"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="devtools",deployment="gitea"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Gitea 다운 (namespace: devtools)"
            description: "namespace=devtools에서 Ready 상태인 Gitea pod가 5분 이상 없습니다. Git 저장소에 접근할 수 없습니다."

        - alert: ApisixDown
          expr: |
            kube_deployment_status_replicas_available{namespace="platform-system",deployment="apisix"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="platform-system",deployment="apisix"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "APISIX 게이트웨이 다운 (namespace: platform-system)"
            description: "namespace=platform-system에서 가용한 APISIX 게이트웨이 pod가 5분 이상 없습니다. 모든 인그레스 트래픽이 차단되었습니다."

        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status="OutOfSync",namespace="devtools"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD 앱 OutOfSync: {{ $labels.name }}"
            description: "ArgoCD 앱 {{ $labels.name }} (프로젝트: {{ $labels.project }})가 10분 이상 OutOfSync 상태입니다. 수동 동기화가 필요할 수 있습니다."

    # -------------------------------------------------------------------------
    # database: CloudNative-PG 클러스터 상태
    # -------------------------------------------------------------------------
    - name: database
      rules:
        - alert: CNPGClusterNotHealthy
          expr: |
            cnpg_collector_up{namespace="database"} == 0
            or
            absent(cnpg_collector_up{namespace="database"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG 클러스터 비정상: {{ $labels.cluster_name }}"
            description: "namespace=database의 CNPG 클러스터 {{ $labels.cluster_name }}가 5분 이상 Healthy 상태가 아닙니다."

        - alert: CNPGReplicationLag
          expr: |
            cnpg_pg_replication_lag{namespace="database"} > 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CNPG 복제 지연 높음: {{ $labels.pod }}"
            description: "CNPG 파드 {{ $labels.pod }}의 스탠바이 복제 지연이 10분 이상 30초를 초과합니다. 현재값: {{ $value | humanizeDuration }}"

        - alert: CNPGHighConnections
          expr: |
            (
              cnpg_backends_total{namespace="database"}
              /
              cnpg_pg_settings_setting{name="max_connections",namespace="database"}
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG 연결 수 높음: {{ $labels.pod }}"
            description: "CNPG 파드 {{ $labels.pod }}의 활성 연결이 max_connections의 80%를 5분 이상 초과합니다. 현재값: {{ $value | humanize }}%"

    # -------------------------------------------------------------------------
    # certificates: cert-manager 인증서 만료 및 상태
    # -------------------------------------------------------------------------
    - name: certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            (
              certmanager_certificate_expiration_timestamp_seconds
              - time()
            ) < (7 * 24 * 3600)
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "인증서 만료 임박: {{ $labels.name }} ({{ $labels.namespace }})"
            description: "namespace={{ $labels.namespace }}의 인증서 {{ $labels.name }}가 7일 이내에 만료됩니다. 만료까지 남은 시간: {{ $value | humanizeDuration }}"

        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "인증서 Ready 아님: {{ $labels.name }} ({{ $labels.namespace }})"
            description: "namespace={{ $labels.namespace }}의 인증서 {{ $labels.name }}가 15분 이상 Ready=False 상태입니다. cert-manager 로그를 확인하세요."

    # -------------------------------------------------------------------------
    # reboot-recovery: VM 리부트 후 복구 감시
    # -------------------------------------------------------------------------
    - name: reboot-recovery
      rules:
        - alert: CiliumAgentNotReady
          expr: |
            kube_node_spec_taint{key="node.cilium.io/agent-not-ready"} == 1
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Cilium agent-not-ready taint 지속: {{ $labels.node }}"
            description: "노드 {{ $labels.node }}에 node.cilium.io/agent-not-ready taint가 3분 이상 지속됩니다. Cilium agent 초기화가 지연되고 있습니다."

        - alert: ZtunnelNotReady
          expr: |
            kube_daemonset_status_number_ready{daemonset="ztunnel",namespace="istio-system"}
            <
            kube_daemonset_status_desired_number_scheduled{daemonset="ztunnel",namespace="istio-system"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ztunnel DaemonSet 미완성"
            description: "ztunnel DaemonSet의 Ready 파드 수가 5분 이상 원하는 수에 미달합니다. HBONE(15008) 트래픽이 단절되어 전체 서비스 메시에 영향을 줄 수 있습니다."

        - alert: IstioCNINotReady
          expr: |
            kube_daemonset_status_number_ready{daemonset="istio-cni-node",namespace="istio-system"}
            <
            kube_daemonset_status_desired_number_scheduled{daemonset="istio-cni-node",namespace="istio-system"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "istio-cni DaemonSet 미완성"
            description: "istio-cni-node DaemonSet의 Ready 파드 수가 5분 이상 원하는 수에 미달합니다. 새 파드의 ambient mesh 참여가 차단됩니다."

    # D-velero-age (#456): age bounds a stuck InProgress without inventing a gauge.
    # Counters reset on restart, so attempt-minus-success is not an active-backup count.
    # Cost: daily schedules get 2h slack; tune 26h if their cadence changes.
    - name: velero-backups
      rules:
        - alert: VeleroBackupStale
          expr: |
            (time() - max by (schedule) (velero_backup_last_successful_timestamp{namespace="storage",schedule!=""}) > 26 * 3600)
            and on (schedule)
            (max by (schedule) (velero_backup_last_successful_timestamp{namespace="storage",schedule!=""}) > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Velero 백업 성공 지연: {{ $labels.schedule }}"
            description: "마지막 성공이 26시간보다 오래되었습니다. InProgress 정체와 대기 중인 백업을 확인하세요."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

        # InitSchedule initializes attempts, but not the last-success gauge (v1.18.1).
        # D-velero-never: missing/zero success gets 26h grace; restart/scrape gaps can
        # reset this pending time. Escape hatch: inspect Backup CRs when telemetry is lost.
        - alert: VeleroBackupNeverSucceeded
          expr: |
            max by (schedule) (velero_backup_attempt_total{namespace="storage",schedule!=""})
            unless on (schedule)
            (max by (schedule) (velero_backup_last_successful_timestamp{namespace="storage",schedule!=""}) > 0)
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Velero 백업 성공 기록 없음: {{ $labels.schedule }}"
            description: "26시간 동안 성공 시각이 없습니다. 스케줄·Backup phase·velero-volume-policy를 확인하세요."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

        - alert: VeleroBackupFailed
          expr: sum by (schedule) (increase(velero_backup_failure_total{namespace="storage"}[1h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero 백업 실패: {{ $labels.schedule }}"
            description: "최근 1시간 내 Failed 백업이 발생했습니다. Backup 상세와 서버 로그를 확인하세요."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

        - alert: VeleroBackupPartiallyFailed
          expr: sum by (schedule) (increase(velero_backup_partial_failure_total{namespace="storage"}[1h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero 백업 부분 실패: {{ $labels.schedule }}"
            description: "최근 1시간 내 PartiallyFailed 백업이 발생했습니다. PVC/PV 바인딩과 PodVolumeBackup 오류를 확인하세요."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

        - alert: VeleroBackupValidationFailed
          expr: sum by (schedule) (increase(velero_backup_validation_failure_total{namespace="storage"}[1h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero 백업 검증 실패: {{ $labels.schedule }}"
            description: "최근 1시간 내 FailedValidation이 발생했습니다. storage/velero-volume-policy의 존재와 접근 권한을 확인하세요. 다음 cron까지 자동 재시도하지 않습니다."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

        - alert: VeleroMetricsUnavailable
          expr: absent(up{namespace="storage",service="velero"}) or max(up{namespace="storage",service="velero"}) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Velero 메트릭 수집 불가"
            description: "ServiceMonitor 선택, 8085 NetworkPolicy와 mTLS 예외 정책, Prometheus target을 확인하세요. 백업 알림의 신뢰성이 저하되었습니다."
            runbook_url: https://github.com/dasomel/narwhal/blob/main/docs/common/storage-protection-policy.md#velero-backup-alerts

    # D-SECDB-STALE (#585): once the Harbor mirror's trivy-db:2 passes its NextUpdate, trivy-server
    # re-downloads the same DB every hour (2026-11-06: 3.67 GiB of container writes per download in
    # cAdvisor, 38 GiB/day to the NFS server). No exporter publishes the mirror age or the DB
    # NextUpdate (live Prometheus has no trivy_* series; the Portal's Trivy DB card reads Harbor
    # directly), so the repeated download itself is the signal: scans write ~0 to this container,
    # a healthy refresh or restart is one download, two within 3h means the mirror is stale.
    # Cost: fires after the second wasted download, not before the first; an undercount when a
    # container restart hides the first sample. Escape hatch: tune 6e9/3h with the download size,
    # or remove the group; the fix is the refresh procedure in scripts/airgap/README.md.
    # cAdvisor reports the same writes once per block device (the LVM dm-0 and the nvme0n1
    # under it), so `max by (pod)` collapses them; `sum` would double one ~3.9e9 download past 6e9.
    - name: security-db
      rules:
        - alert: TrivyServerDbRedownloading
          expr: |
            max by (pod) (increase(container_fs_writes_bytes_total{namespace="security-system",container="trivy-server"}[3h])) > 6e9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "trivy-server가 취약점 DB를 반복 다운로드 중: {{ $labels.pod }}"
            description: >-
              최근 3시간 동안 {{ $labels.pod }}의 컨테이너 쓰기가 {{ $value | humanize1024 }}B입니다(DB 1회 다운로드 약 3.7GiB).
              Harbor 미러의 trivy-db:2가 NextUpdate를 넘겨 같은 DB를 매시간 받고 있을 가능성이 큽니다.
              Portal 보안 페이지의 Trivy DB 상태 카드로 미러 나이를 확인하고 fetch, promote, push로 미러를 갱신하세요.
            runbook_url: https://github.com/dasomel/narwhal/blob/main/scripts/airgap/README.md#보안-db-갱신-절차와-낡은-미러-경보-d-secdb-stale
        # D-SECDB-AUTO-ALERT (#585): the in-cluster refresh (gitops/resources/trivy-db-refresh.yaml)
        # is a CronJob every 6h, and a run that finds the mirror already current also succeeds, so
        # kube-state-metrics' last-successful-time is the mirror-freshness signal. Both alerts are
        # silent where the CronJob does not exist (airgap installs use the manual flow, which
        # TrivyServerDbRedownloading above covers): no series, no result.
        # Failed: the latest scheduled run has not succeeded one hour after it started (the Job
        # deadline is 30m, so a healthy run is long done). Stale: no success for 36h (6 missed runs),
        # or the CronJob is over 12h old and has never succeeded (a first run that cannot push).
        # Cost: Failed stays up until the next good run (up to 6h). Escape hatch: remove these two
        # rules with the CronJob.
        - alert: TrivyDbRefreshFailed
          expr: |
            max(kube_cronjob_status_last_schedule_time{namespace="security-system",cronjob="trivy-db-refresh"})
              > max(kube_cronjob_status_last_successful_time{namespace="security-system",cronjob="trivy-db-refresh"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Trivy DB 미러 자동 갱신 실패"
            description: >-
              trivy-db-refresh 최근 실행이 시작 1시간 뒤에도 성공하지 못했습니다. `kubectl -n security-system logs job/<최근 job>`에서
              ghcr.io 연결, Harbor 로봇 계정(Secret trivy-db-refresh), CA(narwhal-ca-cert)를 확인하세요.
              미러가 낡으면 trivy-server가 같은 DB를 매시간 다시 받습니다.
            runbook_url: https://github.com/dasomel/narwhal/blob/main/scripts/airgap/README.md#보안-db-자동-갱신-d-secdb-auto
        - alert: TrivyDbRefreshStale
          expr: |
            (time() - max(kube_cronjob_status_last_successful_time{namespace="security-system",cronjob="trivy-db-refresh"}) > 129600)
            or
            ((time() - max(kube_cronjob_created{namespace="security-system",cronjob="trivy-db-refresh"}) > 43200)
              unless on() kube_cronjob_status_last_successful_time{namespace="security-system",cronjob="trivy-db-refresh"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Trivy DB 미러 자동 갱신이 36시간 넘게 성공하지 못함"
            description: >-
              trivy-db-refresh가 36시간 동안 성공하지 못했거나, 생성 12시간 뒤에도 한 번도 성공하지 못했습니다.
              Harbor trivy-db 미러가 낡아 가는 중입니다. Secret trivy-db-refresh(08-5가 만든 로봇 계정)가 있는지,
              Job 로그가 무엇을 말하는지 확인하세요.
            runbook_url: https://github.com/dasomel/narwhal/blob/main/scripts/airgap/README.md#보안-db-자동-갱신-d-secdb-auto
