# D-PSS-SPEC-CASE (2026-11-22): Upstream trivy-operator chart 0.27.0 templates
# (templates/specs/k8s-pss-baseline-0.1.yaml controls 6-11, k8s-pss-restricted-0.1.yaml
# controls 6-17) specify lowercase `avd-ksv-*` check IDs, whereas trivy-operator v0.25.0
# (pkg/compliance/io.go:reportsToResults) emits uppercase `AVD-KSV-*` and matches case-
# sensitively — causing failing checks to silently record as empty-placeholder PASS.
# trivy-operator.yaml omits both specs from `compliance.specs` so ArgoCD owns these
# corrected uppercase definitions cleanly with zero resource ownership conflict.
# Cost: keep controls synchronized when upgrading the trivy-operator chart.
# Escape hatch: re-add k8s-pss-baseline-0.1 and k8s-pss-restricted-0.1 to compliance.specs
# in trivy-operator.yaml and remove gitops/charts/narwhal-apps/templates/pss-compliance.yaml.
# D-CCR-SUMMARY (2026-11-25): reportType is "summary" so CCR status never includes detailReport
# (reason: etcd 1.5 MiB object size limit + upstream FromDetailReport Success:false bug; cost:
# detail view no longer in CCR, portal 1.1.28+ reads per-resource reports directly; escape hatch:
# back to detail/all with failed-only records).
---
apiVersion: aquasecurity.github.io/v1alpha1
kind: ClusterComplianceReport
metadata:
  name: k8s-pss-baseline-0.1
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/instance: trivy-operator
    app.kubernetes.io/version: 0.36.1
    app.kubernetes.io/managed-by: kubectl
spec:
  cron: "0 */6 * * *"
  reportType: summary
  compliance:
    id: k8s-pss-baseline-0.1
    platform: k8s
    type: pss-baseline
    title: Kubernetes Pod Security Standards - Baseline
    description: Kubernetes Pod Security Standards - Baseline
    relatedResources:
      - https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
    version: "0.1"
    controls:
      - name: HostProcess
        description: >-
          Windows pods offer the ability to run HostProcess containers which
          enables privileged access to the Windows node. Privileged access to
          the host is disallowed in the baseline policy
        id: "1"
        checks:
          - id: AVD-KSV-0103
        severity: HIGH
      - name: Host Namespaces
        description: Sharing the host namespaces must be disallowed.
        id: "2"
        checks:
          - id: AVD-KSV-0008
        severity: HIGH
      - name: Privileged Containers
        description: >-
          Privileged Pods disable most security mechanisms and must be
          disallowed.
        id: "3"
        checks:
          - id: AVD-KSV-0017
        severity: HIGH
      - name: Capabilities
        description: >-
          Adding additional capabilities beyond those listed below must be
          disallowed.
        id: "4"
        checks:
          - id: AVD-KSV-0022
        severity: MEDIUM
      - name: HostPath Volumes
        description: HostPath volumes must be forbidden.
        id: "5"
        checks:
          - id: AVD-KSV-0023
        severity: MEDIUM
      - name: host ports
        description: >-
          hostports should be disallowed, or at minimum restricted to a known
          list.
        id: "6"
        checks:
          - id: AVD-KSV-0024
        severity: HIGH
      - name: AppArmor
        description: >-
          On supported hosts, the runtime/default AppArmor profile is applied
          by default. The baseline policy should prevent overriding or disabling
          the default AppArmor profile, or restrict overrides to an allowed set
          of profiles.
        id: "7"
        checks:
          - id: AVD-KSV-0002
        severity: HIGH
      - name: SELinux
        description: >-
          Setting the SELinux type is restricted, and setting a custom SELinux
          user or role option is forbidden.
        id: "8"
        checks:
          - id: AVD-KSV-0025
        severity: MEDIUM
      - name: /proc Mount Type
        description: >-
          The default /proc masks are set up to reduce attack surface, and
          should be required.
        id: "9"
        checks:
          - id: AVD-KSV-0027
        severity: MEDIUM
      - name: Seccomp
        description: Seccomp profile must not be explicitly set to Unconfined.
        id: "10"
        checks:
          - id: AVD-KSV-0104
        severity: MEDIUM
      - name: Sysctls
        description: >-
          Sysctls can disable security mechanisms or affect all containers on
          a host, and should be disallowed except for an allowed 'safe' subset.
          A sysctl is considered safe if it is namespaced in the container or
          the Pod, and it is isolated from other Pods or processes on the same
          Node.
        id: "11"
        checks:
          - id: AVD-KSV-0026
        severity: MEDIUM
---
apiVersion: aquasecurity.github.io/v1alpha1
kind: ClusterComplianceReport
metadata:
  name: k8s-pss-restricted-0.1
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/instance: trivy-operator
    app.kubernetes.io/version: 0.36.1
    app.kubernetes.io/managed-by: kubectl
spec:
  cron: "0 */6 * * *"
  reportType: summary
  compliance:
    id: k8s-pss-restricted-0.1
    platform: k8s
    type: pss-restricted
    title: Kubernetes Pod Security Standards - Restricted
    description: Kubernetes Pod Security Standards - Restricted
    relatedResources:
      - https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
    version: "0.1"
    controls:
      - name: HostProcess
        description: >-
          Windows pods offer the ability to run HostProcess containers which
          enables privileged access to the Windows node. Privileged access to
          the host is disallowed in the baseline policy
        id: "1"
        checks:
          - id: AVD-KSV-0103
        severity: HIGH
      - name: Host Namespaces
        description: Sharing the host namespaces must be disallowed.
        id: "2"
        checks:
          - id: AVD-KSV-0008
        severity: HIGH
      - name: Privileged Containers
        description: >-
          Privileged Pods disable most security mechanisms and must be
          disallowed.
        id: "3"
        checks:
          - id: AVD-KSV-0017
        severity: HIGH
      - name: Capabilities
        description: >-
          Adding additional capabilities beyond those listed below must be
          disallowed.
        id: "4"
        checks:
          - id: AVD-KSV-0022
        severity: MEDIUM
      - name: HostPath Volumes
        description: HostPath volumes must be forbidden.
        id: "5"
        checks:
          - id: AVD-KSV-0023
        severity: MEDIUM
      - name: host ports
        description: >-
          hostports should be disallowed, or at minimum restricted to a known
          list.
        id: "6"
        checks:
          - id: AVD-KSV-0024
        severity: HIGH
      - name: AppArmor
        description: >-
          On supported hosts, the runtime/default AppArmor profile is applied
