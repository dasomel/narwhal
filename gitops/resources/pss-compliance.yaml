          of profiles.
        id: "7"
        checks:
          - id: AVD-KSV-0002
        severity: HIGH
      - name: SELinux
        description: >-
          Setting the SELinux type is restricted, and setting a custom SELinux
          user or role option is forbidden.
        id: "8"
        checks:
          - id: AVD-KSV-0025
        severity: MEDIUM
      - name: /proc Mount Type
        description: >-
          The default /proc masks are set up to reduce attack surface, and
          should be required.
        id: "9"
        checks:
          - id: AVD-KSV-0027
        severity: MEDIUM
      - name: Seccomp
        description: Seccomp profile must not be explicitly set to Unconfined.
        id: "10"
        checks:
          - id: AVD-KSV-0104
        severity: MEDIUM
      - name: Sysctls
        description: >-
          Sysctls can disable security mechanisms or affect all containers on
          a host, and should be disallowed except for an allowed 'safe' subset.
          A sysctl is considered safe if it is namespaced in the container or
          the Pod, and it is isolated from other Pods or processes on the same
          Node.
        id: "11"
        checks:
          - id: AVD-KSV-0026
        severity: MEDIUM
      - name: Volume Types
        description: The restricted policy only permits specific volume types.
        id: "12"
        checks:
          - id: AVD-KSV-0028
        severity: LOW
      - name: Privilege Escalation
        description: >-
          Privilege escalation (such as via set-user-ID or set-group-ID file
          mode) should not be allowed.
        id: "13"
        checks:
          - id: AVD-KSV-0001
        severity: MEDIUM
      - name: Running as Non-root
        description: Containers must be required to run as non-root users.
        id: "14"
        checks:
          - id: AVD-KSV-0012
        severity: MEDIUM
      - name: Running as Non-root user
        description: Containers must not set runAsUser to 0
        id: "15"
        checks:
          - id: AVD-KSV-0105
        severity: LOW
      - name: Seccomp
        description: >-
          Seccomp profile must be explicitly set to one of the allowed values.
          Both the Unconfined profile and the absence of a profile are
          prohibited
        id: "16"
        checks:
          - id: AVD-KSV-0030
        severity: LOW
      - name: Capabilities
        description: >-
          Containers must drop ALL capabilities, and are only permitted to add
          back the NET_BIND_SERVICE capability.
        id: "17"
        checks:
          - id: AVD-KSV-0106
        severity: LOW
