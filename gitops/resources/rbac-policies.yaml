---
# RBAC Policies - OIDC 그룹 기반 세분화된 접근 제어
#
# 이 파일의 ClusterRole들은 scripts/cluster/11-keycloak.sh의
# ClusterRoleBinding에서 참조됩니다.
# ClusterRole 수정 시 11-keycloak.sh의 roleRef도 함께 수정하세요:
#   oidc:cluster-admin → platform-admin  (NOT cluster-admin)
#   oidc:developer     → developer
#   oidc:viewer        → platform-viewer
#
# 최소 권한 원칙 (Principle of Least Privilege) 적용:
#   platform-admin : 플랫폼 전체 관리 (노드 조작·RBAC 전체 권한 제외)
#   developer      : 앱 배포 및 디버깅 (Secrets 쓰기 불가)
#   platform-viewer: 전체 네임스페이스 읽기 전용

---
# Platform Admin
# cluster-admin에서 위험한 권한을 제거한 플랫폼 관리자 역할.
# 노드 조작(cordon/drain/delete), ClusterRole/ClusterRoleBinding 변경,
# 클러스터 레벨 스토리지 삭제 등은 허용하지 않음.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-admin
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-tier: admin
rules:
  # 노드: 읽기 전용 (cordon/drain 금지)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # 코어 리소스: 전체 관리 (네임스페이스 포함)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/portforward
      - pods/attach
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - serviceaccounts
      - events
      - namespaces
      - endpoints
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 앱 배포 리소스: 전체 관리
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 배치 작업: 전체 관리
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 네트워크 정책 및 인그레스: 전체 관리
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # HPA/VPA: 전체 관리
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PodDisruptionBudget: 전체 관리
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC: 읽기 전용 (Roles/ClusterRoles 변경 불가)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # Storage: PVC 관리, StorageClass 읽기
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # ArgoCD 앱 및 프로젝트: 전체 관리
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API: 라우트 및 게이트웨이 관리
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Istio: 트래픽 및 보안 정책 읽기 (와일드카드 리소스 제거)
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
      - sidecars
      - envoyfilters
      - telemetries
      - wasmplugins
      - peerauthentications
      - requestauthentications
      - authorizationpolicies
      - workloadentries
      - workloadgroups
    verbs: ["get", "list", "watch"]
  # Cert-manager: 인증서 관리
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # CNPG: 데이터베이스 클러스터 읽기
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch"]
  # Metrics: 읽기
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
# Developer — READ-ONLY at cluster scope
#
# 2026-08-20: 이 역할은 cluster-wide 변경 권한을 가지고 있었다. `oidc-developer`
# ClusterRoleBinding이 이것을 oidc:developer 그룹에 클러스터 전역으로 묶으므로,
# 개발자는 `iam`의 Keycloak 파드, `database`의 CNPG Postgres, `platform-system`의
# 게이트웨이에 **exec 할 수 있었고** 그곳의 워크로드를 수정·삭제할 수 있었다.
# pods/exec + 워크로드 변경 + 전역 범위는 단일 조합으로 가장 위험한 축에 든다.
#
# 이제 역할은 get/list/watch만 가진다. 변경 권한은 아래
# `developer-workload-admin`으로 분리했고, 그것은 **ClusterRoleBinding이 없다** —
# 네임스페이스 RoleBinding으로만 부여된다.
#
# 클러스터 전역 READ는 의도적으로 남긴다. 개발자의 kubectl 가시성이 여기서만
# 나오고, 읽기만으로는 다른 팀 워크로드를 바꿀 수 없다. Secrets는 여전히 없다 —
# 2026-07-10에 iam/platform의 DB 비밀번호·OIDC 시크릿 열람 때문에 제거했다.
#
# 무엇이 바뀌는가(직접 kubectl 사용 한정 — 포털은 자체 ServiceAccount를 쓴다):
#   dev 네임스페이스        변화 없음. developer-full-access(edit) + 아래 RoleBinding
#   devtools, monitoring    변화 없음. oidc-developer-view(view)
#   그 외 모든 네임스페이스   읽기만 가능. exec·변경·Job 생성 불가
#   Application patch/sync  kubectl로는 불가. 포털과 argocd CLI는 각자의 인가를 쓴다.
#                           kubectl 경로 복원은 AppProject 범위 설계에 달려 있다(#157)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-tier: developer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
      - endpoints
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
# Developer workload admin — NAMESPACE-SCOPED ONLY
#
# 위 `developer`에서 떼어낸 변경 권한이다. **이 역할에 ClusterRoleBinding을 만들지
# 말 것.** 그것이 이 분리의 요점이며, 그렇게 하는 순간 2026-08-20 이전 상태로
# 정확히 되돌아간다. 부여는 네임스페이스 RoleBinding으로만 한다.
#
# 새 개발자 네임스페이스(포털의 `dev-*` 셀프서비스 포함)는 생성 시 이것을 묶는
# RoleBinding이 필요하다. 현재 포털의 createNamespace는 만들지 않는다 — #146의
# "onboarding/offboarding이 바인딩을 결정론적으로 갱신" 항목에 해당한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-workload-admin
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-tier: developer
rules:
  # exec/portforward/attach는 여기 있다 — 전역으로 주면 안 되는 이유 그 자체다.
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/portforward
      - pods/attach
      - services
      - configmaps
      - endpoints
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PVC: 생성 및 읽기 (삭제 불가 — 기존 동작 유지)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ArgoCD 앱: 조회 및 동기화 (앱 생성/삭제 불가)
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications/sync"]
    verbs: ["create"]

---
# Platform Viewer
# 전체 네임스페이스 읽기 전용. exec/portforward 없음.
# 기본 view ClusterRole 대비 모니터링/GitOps 리소스 추가.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-viewer
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-tier: viewer
rules:
  # 코어 리소스: 읽기 전용 (exec/portforward 제외)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
      - namespaces
      - persistentvolumeclaims
      - serviceaccounts
      - endpoints
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  # Nodes: 읽기 전용
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # 앱 배포 리소스: 읽기 전용
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch"]
  # 배치 작업: 읽기 전용
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # 네트워크: 읽기 전용
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # HPA: 읽기 전용
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # ArgoCD: 읽기 전용
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch"]
  # Gateway API: 읽기 전용
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes"]
    verbs: ["get", "list", "watch"]
  # StorageClass/PV: 읽기 전용
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Metrics: 읽기
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # Cert-manager: 읽기 전용
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding: platform-admin
# OIDC 그룹 oidc:cluster-admin → platform-admin 매핑
# 주의: 원래 cluster-admin이었으나 최소 권한 원칙에 따라 platform-admin으로 변경
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admin
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-group: cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:cluster-admin"

---
# ClusterRoleBinding: developer
# OIDC 그룹 oidc:developer → developer 매핑.
#
# 클러스터 전역이지만 이제 READ-ONLY다 — `developer` ClusterRole에서 변경 권한을
# `developer-workload-admin`으로 분리했기 때문이다. 그 역할을 여기에 묶지 말 것;
# 그러면 분리가 무의미해진다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-developer
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-group: developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:developer"

---
# ClusterRoleBinding: platform-viewer
# OIDC 그룹 oidc:viewer → platform-viewer 매핑
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-viewer
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-group: viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:viewer"

---
# RoleBinding: developer-full-access (dev 네임스페이스)
# developer 그룹에게 dev 네임스페이스에서 기본 edit 권한 추가 부여.
# ClusterRoleBinding의 developer 역할에 더해 dev ns에서 Secrets 쓰기,
# PVC 삭제 등 개발 편의 권한을 추가로 허용.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-full-access
  namespace: dev
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-group: developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:developer"

---
# RoleBinding: developer-workload-admin (dev 네임스페이스)
#
# `developer-workload-admin`의 유일한 바인딩이며, 이것이 이 설계의 형태다:
# 변경 권한은 승인된 네임스페이스마다 명시적으로 부여하지, 클러스터 전역으로
# 한 번에 주지 않는다.
#
# 바로 위의 developer-full-access(edit)와 겹치는 부분이 있다. 의도한 것이다 —
# edit은 k8s 내장 역할이라 argoproj.io를 모르고, 이쪽은 narwhal 고유 권한을
# 담는다. 그리고 새 `dev-*` 네임스페이스가 복제해야 할 템플릿은 edit이 아니라
# 이 RoleBinding이다.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-workload-admin
  namespace: dev
  labels:
    app.kubernetes.io/managed-by: narwhal
    narwhal.io/rbac-group: developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-workload-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:developer"

---
# ClusterRole: velero-ui-readonly
# velero-ui SA용 최소 클러스터 권한. 기존에는 cluster-admin 바인딩이었으나
# velero.io CRUD는 storage ns의 Role(velero-ui-*-permissions)이 이미 담당하므로,
# 클러스터 범위는 백업 대상 선택 UI에 필요한 읽기 전용으로 축소.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-ui-readonly
  labels:
    app.kubernetes.io/managed-by: narwhal
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumesnapshotclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshotclasses
      - volumesnapshots
      - volumesnapshotcontents
    verbs: ["get", "list", "watch"]

---
# Role: velero-ui-custom-role
# 기존 차트의 velero-ui-permissions 및 velero-ui-velero-permissions 통합 대체.
# 와일드카드 (*) 제거 및 verbs/resources 명시.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-ui-custom-role
  namespace: storage
  labels:
    app.kubernetes.io/managed-by: narwhal
rules:
  # Pods, Secrets, ConfigMaps 읽기 전용 (UI 표시용)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - secrets
      - configmaps
    verbs: ["get", "list", "watch"]
  # Velero 백업/복원 관련 CRUD 권한 (와일드카드 제거)
  - apiGroups: ["velero.io"]
    resources:
      - backups
      - restores
      - schedules
      - backupstoragelocations
      - volumesnapshotlocations
      - downloadrequests
      - deletebackuprequests
      - podvolumebackups
      - podvolumerestores
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding: velero-ui-custom-binding
# velero-ui 서비스 어카운트에 커스텀 Role 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-ui-custom-binding
  namespace: storage
  labels:
    app.kubernetes.io/managed-by: narwhal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velero-ui-custom-role
subjects:
  - kind: ServiceAccount
    name: velero-ui
    namespace: storage

---
# ClusterRoleBinding: velero-ui-readonly-binding
# velero-ui SA가 클러스터 범위의 읽기 권한을 갖도록 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-ui-readonly-binding
  labels:
    app.kubernetes.io/managed-by: narwhal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-ui-readonly
subjects:
  - kind: ServiceAccount
    name: velero-ui
    namespace: storage

---
# ServiceAccount: narwhal-tuning-job
# Dedicated identity for narwhal-portal#55's node-tuning Job pod
# (narwhal-portal/src/lib/k8s-job-runner.ts runHostJob, TUNING_JOB_SERVICE_ACCOUNT).
# Previously the Job ran with no serviceAccountName set — i.e. the devtools `default`
# SA, a broad reuse pattern shared with anything else that also omits the field.
#
# Deliberately carries NO Role/RoleBinding/ClusterRoleBinding: the Job pod only
# nsenters into the host to run allowlisted tuning commands (see
# narwhal-portal/src/lib/tuning-commands.ts) — it never calls the K8s API from inside
# the pod, so it needs zero RBAC grants. k8s-job-runner.ts additionally sets
# automountServiceAccountToken: false on the pod spec, so this SA's own token is never
# projected into it either — this object exists purely so the pod has an identity
# distinct from `default`, not to grant anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: narwhal-tuning-job
  namespace: devtools
  labels:
    app.kubernetes.io/managed-by: narwhal
automountServiceAccountToken: false
