---
# TLS Certificate for Gateway
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-tls
  namespace: platform-system
spec:
  secretName: traefik-tls
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.local.narwhal.io"
    - "local.narwhal.io"
  duration: 8760h
  renewBefore: 720h
---
# Traefik Gateway (uses internal entrypoint ports 8000/8443)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: platform-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: traefik-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
---
# Traefik Rate Limit Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-system
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Traefik Body Size Limit Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-100m
  namespace: platform-system
spec:
  buffering:
    maxRequestBodyBytes: 104857600  # 100MB
---
# Traefik Body Size Limit (10MB for APIs)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-10m
  namespace: platform-system
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10MB
---
# ArgoCD HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: devtools
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: platform-system
  hostnames:
    - "argocd.local.narwhal.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
