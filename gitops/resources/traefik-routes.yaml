---
# TLS Certificate for Gateway
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-tls
  namespace: platform-system
spec:
  secretName: traefik-tls
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.local.narwhal.io"
    - "local.narwhal.io"
  duration: 8760h
  renewBefore: 720h
---
# Traefik Gateway (uses internal entrypoint ports 8000/8443)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: platform-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - iam
                  - devtools
                  - monitoring
                  - storage
                  - platform-system
    - name: websecure
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: traefik-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - iam
                  - devtools
                  - monitoring
                  - storage
                  - platform-system
---
# Security Headers Middleware (platform-system)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform-system
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: false
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
# Traefik Rate Limit Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-system
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Traefik Body Size Limit Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-100m
  namespace: platform-system
spec:
  buffering:
    maxRequestBodyBytes: 104857600  # 100MB
---
# Traefik Body Size Limit (10MB for APIs)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-10m
  namespace: platform-system
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10MB
---
# Auth redirect page: serves JavaScript auto-redirect to OAuth2-Proxy login
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-redirect-page
  namespace: devtools
data:
  index.html: |
    <!DOCTYPE html>
    <html><head><meta charset="utf-8"><script>
    // Prevent multiple simultaneous OAuth flows (PKCE collision)
    var key='_oauth2_redirect_ts';
    var now=Date.now();
    var last=parseInt(sessionStorage.getItem(key)||'0');
    if(now-last>5000){
      sessionStorage.setItem(key,now);
      // Per-app post-login redirect (triggers app's own SSO via Keycloak session)
      var appRedirects={
        'argocd.local.narwhal.io':'/auth/login?return_url=https%3A%2F%2Fargocd.local.narwhal.io%2Fapplications',
        'grafana.local.narwhal.io':'/login/generic_oauth',
        'gitea.local.narwhal.io':'/user/oauth2/keycloak',
        'harbor.local.narwhal.io':'/c/oidc/login'
      };
      var h=window.location.hostname;
      var dest=appRedirects[h]?'https://'+h+appRedirects[h]:window.location.href;
      window.location.href='https://oauth2-proxy.local.narwhal.io/oauth2/start?rd='+encodeURIComponent(dest);
    }
    </script></head><body>Redirecting to login...</body></html>
---
# Minimal nginx serving the redirect page
# docker.io: no ghcr.io/registry.k8s.io alternative for static content server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redirect
  namespace: devtools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-redirect
  template:
    metadata:
      labels:
        app: auth-redirect
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: auth-redirect-page
---
apiVersion: v1
kind: Service
metadata:
  name: auth-redirect
  namespace: devtools
spec:
  selector:
    app: auth-redirect
  ports:
    - port: 80
---
# Security Headers Middleware (devtools)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: devtools
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: false
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
# ForwardAuth Middleware: delegates auth to OAuth2-Proxy
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2
  namespace: devtools
spec:
  forwardAuth:
    address: http://oauth2-proxy.iam.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
---
# Errors Middleware: catch ForwardAuth 401 → serve JS redirect page
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-signin
  namespace: devtools
spec:
  errors:
    status:
      - "401"
    service:
      name: auth-redirect
      port: 80
    query: /
---
# ArgoCD HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: devtools
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: platform-system
  hostnames:
    - "argocd.local.narwhal.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-signin
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-oauth2
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: argocd-server
          port: 80
