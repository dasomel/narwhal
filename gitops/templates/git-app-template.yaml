# ================================================
# Narwhal IDP - ArgoCD Application 템플릿 (Git 레포 소스)
# ================================================
# 사용법:
#   1. 이 파일을 복사하여 gitops/apps/<APP_NAME>.yaml 로 저장
#   2. <PLACEHOLDER> 값을 실제 값으로 교체
#   3. Gitea narwhal-gitops 레포에 push
#   4. ArgoCD app-of-apps가 자동으로 감지하여 배포
#
# 이 템플릿은 Helm 차트 대신 Git 레포의 YAML 매니페스트를
# 직접 배포할 때 사용합니다. 개발자가 직접 작성한 앱 매니페스트,
# Kustomize 디렉토리, 또는 plain YAML에 적합합니다.
#
# 필수 교체 항목:
#   <APP_NAME>   - 앱 이름 (예: my-webapp, api-service)
#   <REPO_NAME>  - Gitea 레포 이름 (예: my-webapp)
#                  레포 URL: http://gitea.local.narwhal.internal/<ORG>/<REPO_NAME>
#   <ORG_NAME>   - Gitea 조직 또는 유저명 (예: narwhal, dev-team)
#   <MANIFEST_PATH> - 매니페스트 경로 (예: k8s/, deploy/, .)
#   <NAMESPACE>  - 대상 네임스페이스 (예: dev)
#
# Gitea 레포 구조 예시:
#   my-webapp/
#   ├── k8s/
#   │   ├── deployment.yaml
#   │   ├── service.yaml
#   │   └── httproute.yaml   # Traefik Gateway API 라우트
#   └── src/
#       └── ...
#
# Kustomize 사용 시:
#   <MANIFEST_PATH> 를 kustomization.yaml이 있는 디렉토리로 설정
#   ArgoCD가 kustomization.yaml 감지 시 자동으로 Kustomize 빌드 수행
# ================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <APP_NAME>
  namespace: devtools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: narwhal-gitops
spec:
  project: tenants
  source:
    # Gitea 내부 서비스 주소 (클러스터 내부 통신)
    # 외부 주소(https://gitea.local.narwhal.internal) 사용 금지:
    #   ArgoCD repo-server가 TLS 검증 없이 내부 통신해야 하고
    #   IPv6 DNS 해석 실패 이슈 방지를 위해 내부 주소 사용
    repoURL: http://gitea-http.devtools.svc.cluster.local:3000/<ORG_NAME>/<REPO_NAME>.git
    targetRevision: HEAD
    path: <MANIFEST_PATH>

    # -----------------------------------------------
    # Kustomize 사용 시 (선택 사항)
    # kustomize.yaml이 path 디렉토리에 있으면 자동 감지
    # 환경별 오버레이가 필요하면 path를 k8s/overlays/dev 로 변경
    # -----------------------------------------------
    # kustomize:
    #   version: v5.0.0

    # -----------------------------------------------
    # Helm 차트가 레포에 포함된 경우 (선택 사항)
    # chart 디렉토리에 Chart.yaml이 있으면 활성화
    # -----------------------------------------------
    # helm:
    #   valueFiles:
    #     - values.yaml
    #     - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: <NAMESPACE>
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD가 크거나(>262KB) field manager 충돌 시 활성화
      # - ServerSideApply=true
