# D-KUBELET-KERNEL-DEFAULTS (CIS 4.2.6, protectKernelDefaults=true):
# Required by kubelet pkg/kubelet/cm/container_manager_linux.go before kubelet starts.
# Ordering invariant: persisted and verified BEFORE kubelet starts with protectKernelDefaults=true,
# or kubelet refuses startup with Invalid kernel flag.
# Escape hatch: set protectKernelDefaults: false in /var/lib/kubelet/config.yaml and kubelet-config CM.
vm.overcommit_memory = 1
vm.panic_on_oom = 0
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.keys.root_maxkeys = 1000000
kernel.keys.root_maxbytes = 25000000
