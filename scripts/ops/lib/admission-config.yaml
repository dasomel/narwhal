apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - {type: Server, qps: 500, burst: 1000}
        - {type: Namespace, qps: 50, burst: 100, cacheSize: 2000}
