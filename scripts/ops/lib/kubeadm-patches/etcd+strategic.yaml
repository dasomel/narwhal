# D-CP-STATIC-POD-SC / D-CP-ETCD-DAC (CIS 5.2.6/5.2.9/5.2.10, KSV001/KSV003/KSV004):
# Drop all Linux capabilities except DAC_OVERRIDE and disable privilege escalation on etcd.
# etcd binds ports 2379/2380/2381 (>1024) and runs as UID 0 while /var/lib/etcd stays
# etcd:etcd 0700 (harden-node-files.sh, CIS 1.1.12 / KCV0059 via node-collector passwd/group).
# Without CAP_DAC_OVERRIDE, UID 0 gets EACCES on an etcd:etcd 0700 directory.
# Cost: KSV022 (CIS 5.2.8) and KSV106 (PSS Restricted) fire on capabilities.add=[DAC_OVERRIDE]
# and are exact-accepted for etcd-narwhal-master-1 alongside KSV012/020/021 until kubeadm
# RootlessControlPlane moves etcd off UID 0.
# Escape hatch: remove /etc/kubernetes/patches/etcd+strategic.yaml and re-run kubeadm/ops rollback.
apiVersion: v1
kind: Pod
metadata:
  name: etcd
  namespace: kube-system
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: etcd
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - DAC_OVERRIDE
