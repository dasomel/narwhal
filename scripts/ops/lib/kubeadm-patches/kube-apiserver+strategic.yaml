# D-CP-STATIC-POD-SC (CIS 5.2.6/5.2.9/5.2.10, KSV001/KSV003/KSV004):
# Drop all Linux capabilities and disable privilege escalation on the kube-apiserver static Pod.
# kube-apiserver binds port 6443 (>1024) and reads root-owned PKI/enc/audit/admission files as UID 0.
# Cost: KSV012/020/021 stay accepted until kubeadm RootlessControlPlane is GA.
# Escape hatch: remove /etc/kubernetes/patches/kube-apiserver+strategic.yaml and re-run kubeadm/ops rollback.
# D-CP-APISERVER-FILECAP: keep NET_BIND_SERVICE because the 1.35.7 image binary has cap_net_bind_service=ep.
# Cost: one default capability remains; escape hatch: remove this add if upstream drops the file capability.
apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kube-apiserver
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
