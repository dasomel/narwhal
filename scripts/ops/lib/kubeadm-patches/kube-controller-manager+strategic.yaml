# D-CP-STATIC-POD-SC (CIS 5.2.6/5.2.9/5.2.10, KSV001/KSV003/KSV004):
# Drop all Linux capabilities and disable privilege escalation on kube-controller-manager.
# kube-controller-manager binds port 10257 (>1024) and reads root-owned PKI/kubeconfig as UID 0.
# Cost: KSV012/020/021 stay accepted until kubeadm RootlessControlPlane is GA.
# Escape hatch: remove /etc/kubernetes/patches/kube-controller-manager+strategic.yaml and re-run kubeadm/ops rollback.
apiVersion: v1
kind: Pod
metadata:
  name: kube-controller-manager
  namespace: kube-system
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kube-controller-manager
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
