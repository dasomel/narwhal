apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: safe-webhook
webhooks:
  - name: validate.safe.example.test
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions: ["v1"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - platform-system
    clientConfig:
      service:
        name: safe-webhook
        namespace: platform-system
  - name: validate.ignore.example.test
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions: ["v1"]
