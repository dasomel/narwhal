jobs:
  tools:
    steps:
      - run: npm install -g markdownlint-cli@0.49.1 --ignore-scripts
      - run: |
          npm ci --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          python3 -m pip install --only-binary=:all: 'jsonschema==4.25.1'
          pip install --only-binary :all: --require-hashes -r reqs.txt
          echo "never: npm install -g evil"
