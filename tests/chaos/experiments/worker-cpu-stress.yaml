apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: worker-cpu-stress
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
      - chaos-testing
    labelSelectors:
      chaos-target: stress
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: '60s'
